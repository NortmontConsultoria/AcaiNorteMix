      const cotaAc = somaMeta('cota'), metaAc = somaMeta('meta'), superAc = somaMeta('super');
      // faturamento dos MESMOS meses que têm meta, para a comparação ser justa
      const fatComMeta = mesesComMeta.reduce(function(s,m){ return s + (SERIES.faturamento[m] || 0); }, 0);
      const atingCota  = cotaAc  ? (fatComMeta / cotaAc)  * 100 : 0;
      const atingMeta  = metaAc  ? (fatComMeta / metaAc)  * 100 : 0;
      const atingSuper = superAc ? (fatComMeta / superAc) * 100 : 0;
      html += '<hr class="np-divider">';
      html += '<h3 class="section-title">'+(unico ? 'Meta vs Realizado · '+mesSingle
                                                 : 'Cobertura de metas · consolidado '+periodTxt)+'</h3>';
      html += '<p class="lead" style="margin-bottom:16px;color:var(--text-on-light-muted);">';
      if (unico) html += 'Faturamento de '+mesSingle+': <strong>'+fmtBRL(fatComMeta)+'</strong>.';
      else html += 'Faturamento acumulado de '+periodTxt+': <strong>'+fmtBRL(fatComMeta)
                 + '</strong>, contra a soma da Cota, Meta e Super Meta dos '+mesesComMeta.length+' meses do período.';
      html += '</p>';
      html += '<div class="grid-3" style="margin-bottom:16px;">';
      html += kpiCardLight((unico?'Cota · ':'Cota do período · ')+fmtBRLk(cotaAc), fmtPctSim(atingCota),
        (atingCota>=100?'+':'')+fmtBRLk(fatComMeta-cotaAc)+(atingCota>=100?' acima':' abaixo'),
        atingCota>=100?'pos':'neg', '', atingCota);
      html += kpiCardLight((unico?'Meta · ':'Meta do período · ')+fmtBRLk(metaAc), fmtPctSim(atingMeta),
        (atingMeta>=100?'+':'')+fmtBRLk(fatComMeta-metaAc)+(atingMeta>=100?' acima':' abaixo'),
        atingMeta>=100?'pos':'neg', '', atingMeta);
      html += kpiCardLight((unico?'Super Meta · ':'Super Meta do período · ')+fmtBRLk(superAc), fmtPctSim(atingSuper),
        (atingSuper>=100?'+':'')+fmtBRLk(fatComMeta-superAc)+(atingSuper>=100?' acima':' abaixo'),
        atingSuper>=100?'pos':'neg', '', atingSuper);
      html += '</div>';
      html += '<div style="margin-bottom:36px;padding:14px 18px;background:rgba(15,66,69,.06);border-radius:6px;font-size:12px;color:var(--text-on-light-muted);">';
      html += 'Comissão'+(unico?'':' acumulada')+' por nível: Cota '+fmtBRLk(somaMeta('com_cota'))
            + ' · Meta '+fmtBRLk(somaMeta('com_meta'))+' · Super Meta '+fmtBRLk(somaMeta('com_super'))+'</div>';
    }
  }

  // === Evolução histórica vs metas ===
  html += '<hr class="np-divider">';
  html += '<h3 class="section-title">Evolução Faturamento × Metas</h3>';
  html += '<div class="chart-card light" style="display:flex;flex-direction:column;margin-bottom:36px;">';
  html += '<div class="chart-card-title">Faturamento mensal vs Metas</div>';
  html += '<div class="chart-card-sub">Cota · Meta · Super Meta (linhas) e Faturamento (barras)</div>';
  html += '<div style="position:relative;height:440px;"><canvas id="chVendaMeta"></canvas></div>';
  html += '</div>';
  // === Comparativo YoY ===
  var temYoY26 = meses.some(function(m){ return m.endsWith('/26') && SERIES.faturamento[m.replace('/26','/25')] != null; });
  if (temYoY26){
    html += '<hr class="np-divider">';
    html += '<h3 class="section-title">Comparativo YoY · '+periodTxt+' vs 2025</h3>';
    html += '<p class="lead" style="margin-bottom:20px;color:var(--text-on-light-muted);">Barras pareadas: mês de 2025 (cinza claro) ao lado do mês equivalente de 2026 (azul-petróleo).</p>';
    if (fatYoY > 0) {
      const varYoY = (fat/fatYoY - 1) * 100;
      html += '<div class="grid-3" style="margin-bottom:24px;">';
      html += kpiCardLight('Faturamento ' + periodTxt, fmtBRLk(fat), '', 'neu');
      html += kpiCardLight('Mesmo período 2025', fmtBRLk(fatYoY), '', 'neu');
      html += kpiCardLight('Variação YoY', fmtPctSim(varYoY),
        varYoY > 0 ? 'crescimento' : 'queda', varYoY > 0 ? 'pos' : 'neg');
      html += '</div>';
    }
    html += '<div class="grid-2" style="margin-bottom:24px;">';
    html += '<div class="chart-card light"><div class="chart-card-title">Faturamento · 2025 vs 2026</div><div class="chart-card-sub">Regime competência</div>'+miniYoYCard(meses,'faturamento','soma',fmtBRLk)+'<div style="position:relative;height:330px;"><canvas id="chYoYFat"></canvas></div></div>';
    html += '<div class="chart-card light"><div class="chart-card-title">Ticket médio · 2025 vs 2026</div><div class="chart-card-sub">Valor médio por venda</div>'+miniYoYCard(meses,'ticket','media',function(v){return v==null?'—':'R$ '+fmtNum(v,0);})+'<div style="position:relative;height:330px;"><canvas id="chYoYTkt"></canvas></div></div>';
    html += '</div>';
    html += '<div class="grid-2" style="margin-bottom:24px;">';
    html += '<div class="chart-card light"><div class="chart-card-title">Clientes ativos · 2025 vs 2026</div><div class="chart-card-sub">Base ativa por mês</div>'+miniYoYCard(meses,'clientes_ativos','media',function(v){return v==null?'—':fmtNum(v,0);})+'<div style="position:relative;height:330px;"><canvas id="chYoYCli"></canvas></div></div>';
    html += '<div class="chart-card light"><div class="chart-card-title">N° de vendas · 2025 vs 2026</div><div class="chart-card-sub">Volume mensal</div>'+miniYoYCard(meses,'n_vendas','soma',function(v){return v==null?'—':fmtNum(v,0);})+'<div style="position:relative;height:330px;"><canvas id="chYoYNV"></canvas></div></div>';
    html += '</div>';
    html += '<div class="chart-card light" style="margin-bottom:36px;"><div class="chart-card-title">Variação YoY · resumo</div><div class="chart-card-sub">% de crescimento por mês — Faturamento, Ticket, Clientes, Vendas</div><div style="position:relative;height:350px;"><canvas id="chYoYResumo"></canvas></div></div>';
  }

  // === Projeção de fechamento do ano — ÚLTIMA seção da página ===
  {
    const pj = projecaoAnualYoY();
    if (pj && pj.futuros.length > 0) {
      html += '<hr class="np-divider">';
      html += '<h3 class="section-title">Projeção de fechamento de '+pj.anoL+'</h3>';
      html += '<p class="lead" style="margin-bottom:20px;color:var(--text-on-light-muted);">';
      html += 'Nos '+pj.realizados.length+' meses já fechados, '+pj.anoL+' faturou <strong>'+fmtBRL(pj.acumAtual)
            + '</strong> contra <strong>'+fmtBRL(pj.acumAnterior)+'</strong> nos mesmos meses de '+pj.anoAntL
            + ' — crescimento de <strong>'+fmtPctSim(pj.crescimento*100)+'</strong>. ';
      html += 'Mantendo esse mesmo crescimento sobre cada mês de '+pj.anoAntL
            + ', os meses restantes e o fechamento do ano ficariam assim.</p>';
      html += '<div class="grid-3" style="margin-bottom:24px;">';
      html += kpiCardLight('Realizado · '+pj.realizados.length+' meses', fmtBRLk(pj.acumAtual),
        fmtPctSim(pj.crescimento*100)+' vs '+pj.anoAntL, pj.crescimento>=0?'pos':'neg');
      html += kpiCardLight('Projetado · '+pj.futuros.length+' meses restantes', fmtBRLk(pj.totalProjetado),
        'sobre '+fmtBRLk(pj.baseAnteriorFuturo)+' de '+pj.anoAntL, 'neu');
      html += kpiCardLight('Fechamento do ano projetado', fmtBRLk(pj.totalAno),
        pj.anoAntL+' fechou em '+fmtBRLk(pj.totalAnoAnterior), 'neu');
      html += '</div>';
      html += '<div class="chart-card light" style="margin-bottom:16px;">';
      html += '<div class="chart-card-title">Faturamento '+pj.anoL+' · realizado × projetado</div>';
      html += '<div class="chart-card-sub">Escuro: fechado · Claro: projetado sobre '+pj.anoAntL
            + ' com o crescimento de '+fmtPctSim(pj.crescimento*100)+'</div>';
      html += '<div style="position:relative;height:420px;"><canvas id="chProjecaoAno"></canvas></div></div>';
      html += '<div class="chart-card light" style="margin-bottom:24px;padding:0;overflow:hidden;">';
      html += '<div class="chart-card-title" style="padding:16px 18px 4px;">Detalhe da projeção</div>';
      html += '<div style="overflow-x:auto;"><table class="abc-table">';
      html += '<thead><tr><th class="abc-name">Mês</th><th>'+pj.anoAntL+'</th><th>Crescimento aplicado</th><th>'
            + pj.anoL+' projetado</th></tr></thead><tbody>';
      pj.futuros.forEach(function(m){
        html += '<tr><td class="abc-name"><strong>'+m+'</strong></td>';
        html += '<td>'+fmtBRLk(SERIES.faturamento[m.replace('/'+pj.ano,'/'+pj.anoAnt)]||0)+'</td>';
        html += '<td>'+fmtPctSim(pj.crescimento*100)+'</td>';
        html += '<td><strong>'+fmtBRLk(pj.projData[m])+'</strong></td></tr>';
      });
      html += '<tr class="row-result"><td class="abc-name"><strong>Total dos meses restantes</strong></td>';
      html += '<td><strong>'+fmtBRLk(pj.baseAnteriorFuturo)+'</strong></td><td>—</td>';
      html += '<td><strong>'+fmtBRLk(pj.totalProjetado)+'</strong></td></tr>';
      html += '</tbody></table></div></div>';
      html += '<div style="margin-bottom:36px;padding:14px 18px;background:rgba(15,66,69,.06);border-radius:6px;font-size:12px;color:var(--text-on-light-muted);line-height:1.6;">';
      html += '<strong style="color:var(--navy);">Metodologia:</strong> crescimento year-over-year acumulado — soma do faturamento dos meses já fechados de '
            + pj.anoL+' dividida pela soma dos mesmos meses de '+pj.anoAntL+'. Essa taxa é aplicada a cada mês de '
            + pj.anoAntL+' ainda não realizado em '+pj.anoL+'. O método preserva a sazonalidade do negócio (alta de verão, baixa de inverno), porque projeta em cima da curva do ano anterior em vez de extrapolar a tendência dos últimos meses. Pressupõe que o ritmo de crescimento observado até aqui se mantém — não considera ações comerciais, novos canais ou perda de clientes relevantes.</div>';
    }
  }

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

/* ============ ABA 03 — COMERCIAL · CLIENTES ============ */
function renderComClientes(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);
  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';

  // Header
  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--navy);"><span class="pill-num">03</span> · Comercial · Clientes</div>';
  html += '<h2 class="title-xl">Clientes<br><u>e segmentação</u></h2>';
  html += '<p class="lead" style="color:var(--text-on-light-muted);">Evolução da base ativa, mix B2B vs B2C e curva ABC de clientes.<br>Período: '+periodTxt+'.</p>';
  html += '</div></div>';
  html += '<hr class="np-divider">';

  // === ABC CLIENTES — merge de todos os meses (feito aqui para alimentar tanto o Mix B2B/B2C quanto a Curva ABC) ===
  const cliMap = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.clientes_abc) return;
    d.clientes_abc.forEach(function(c){
      if (!c.nome) return;
      if (!cliMap[c.nome]) cliMap[c.nome] = {nome:c.nome, qtd:0, total:0, tipoRaw: c.tipo};
      // qtd=0 em Jan/Fev/Mar indica falha na extração do ERP; recalcula via round(total/tkt)
      const qtdReal = (c.qtd > 0) ? c.qtd : (c.tkt > 0 ? Math.round(c.total / c.tkt) : 0);
      cliMap[c.nome].qtd += qtdReal;
      cliMap[c.nome].total += c.total||0;
    });
  });
  const cliArr = Object.values(cliMap).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  // Resolve posição (curva ABC) e tipo B2B/B2C direto do relatório, já com o ranking do período selecionado
  cliArr.forEach(function(c, i){ c.pos = i+1; c.tipo = getTipo(c.nome, c.tipoRaw, c.pos); c.semClass = isSemClassificacao(c.nome, c.tipoRaw); });

  // === Mix B2B vs B2C (calculado a partir da classificação corrigida por cliente) ===
  const b2bAgg = calcB2BByCli(cliArr);
  if (b2bAgg.b2b_fat > 0 || b2bAgg.b2c_fat > 0) {
    const totB2 = b2bAgg.b2b_fat + b2bAgg.b2c_fat;
    html += '<hr class="np-divider">';
    html += '<h3 class="section-title">Mix B2B vs B2C · '+periodTxt+'</h3>';
    html += '<div class="grid-4" style="margin-bottom:24px;">';
    html += kpiCardLight('B2B', fmtBRLk(b2bAgg.b2b_fat), totB2 ? fmtPctSim(b2bAgg.b2b_fat/totB2*100)+' da receita' : '', 'neu');
    html += kpiCardLight('B2C', fmtBRLk(b2bAgg.b2c_fat), totB2 ? fmtPctSim(b2bAgg.b2c_fat/totB2*100)+' da receita' : '', 'neu');
    html += kpiCardLight('Clientes B2B / B2C', fmtNum(b2bAgg.b2b_clientes,0)+' / '+fmtNum(b2bAgg.b2c_clientes,0), 'clientes distintos no período', 'neu');
    html += kpiCardLight('Vendas B2B / B2C', fmtNum(b2bAgg.b2b_vendas,0)+' / '+fmtNum(b2bAgg.b2c_vendas,0), 'no período', 'neu');
    html += '</div>';
    html += '<div class="grid-2" style="margin-bottom:36px;">';
    html += '<div class="chart-card light"><div class="chart-card-title">Faturamento · B2B vs B2C</div><div class="chart-card-sub">Participação na receita</div><div style="position:relative;height:310px;"><canvas id="chB2BFat"></canvas></div></div>';
    html += '<div class="chart-card light"><div class="chart-card-title">Ticket médio · B2B vs B2C</div><div class="chart-card-sub">Valor médio por venda</div><div style="position:relative;height:310px;"><canvas id="chB2BTkt"></canvas></div></div>';
    html += '</div>';
  }

  // === Curva ABC de clientes (usa o cliArr já calculado acima) ===
  const totFatCli = cliArr.reduce((s,c)=>s+c.total,0);
  let runShare = 0;
  cliArr.forEach(function(c, i){
    c.mix = totFatCli ? (c.total/totFatCli*100) : 0;
    runShare += c.mix;
    c.share_ac = runShare;
    c.pos = i+1;
    c.tkt = c.qtd ? c.total/c.qtd : 0;
  });

  if (cliArr.length > 0) {
    const top5_share  = cliArr.slice(0,  5).reduce((s,c)=>s+(c.mix||0), 0);
    const top10_share = cliArr.slice(0, 10).reduce((s,c)=>s+(c.mix||0), 0);
    const top20_share = cliArr.slice(0, 20).reduce((s,c)=>s+(c.mix||0), 0);

    // Grupos ABC (por share acumulado)
    const grpA = cliArr.filter(c=>c.share_ac <= 25);
    const grpB = cliArr.filter(c=>c.share_ac > 25 && c.share_ac <= 50);
    const grpC = cliArr.filter(c=>c.share_ac > 50 && c.share_ac <= 75);
    const grpD = cliArr.filter(c=>c.share_ac > 75);

    html += '<hr class="np-divider">';
    html += '<h3 class="section-title">Curva ABC de Clientes · '+periodTxt+'</h3>';

    // KPIs
    html += '<div class="grid-4" style="margin-bottom:24px;">';
    html += kpiCardLight('Top 5 clientes', fmtPctSim(top5_share), 'da receita no período', 'neu');
    html += kpiCardLight('Top 10 clientes', fmtPctSim(top10_share), 'da receita no período', 'neu');
    html += kpiCardLight('Top 20 clientes', fmtPctSim(top20_share), 'da receita no período', 'neu');
    html += kpiCardLight('Clientes ativos', fmtNum(cliArr.length, 0), 'no período selecionado', 'neu');
    html += '</div>';

    // === Tabela Segmentação por grupo — 1º bloco (destaque visual) ===
    const grpsDef = [
      {id:'A', label:'Altíssimo', arr:grpA, faixa:'0% a 25%',
        bg:'#0F4245', color:'#fff', badgeBg:'#0F4245', badgeColor:'#fff', rowBg:'rgba(15,66,69,.07)'},
      {id:'B', label:'Alto',      arr:grpB, faixa:'25% a 50%',
        bg:'#3F598C', color:'#fff', badgeBg:'#3F598C', badgeColor:'#fff', rowBg:'rgba(63,89,140,.07)'},
      {id:'C', label:'Médio',     arr:grpC, faixa:'50% a 75%',
        bg:'#5c8a5c', color:'#fff', badgeBg:'#5c8a5c', badgeColor:'#fff', rowBg:'rgba(92,138,92,.07)'},
      {id:'D', label:'Baixo',     arr:grpD, faixa:'75% a 100%',
        bg:'#546e8a', color:'#fff', badgeBg:'#546e8a', badgeColor:'#fff', rowBg:'rgba(84,110,138,.07)'},
    ];
    html += '<div class="chart-card light" style="margin-bottom:28px;padding:0;overflow:hidden;border:1.5px solid rgba(1,30,60,.13);box-shadow:0 3px 14px rgba(1,30,60,.09);">';
    html += '<div style="padding:18px 20px 10px;background:linear-gradient(135deg,#011E3C 0%,#0F4245 100%);">';
    html += '<div style="font-size:13px;font-weight:700;color:#E0EEE7;letter-spacing:.04em;text-transform:uppercase;">Segmentação de Clientes por Grupo</div>';
    html += '<div style="font-size:11px;color:rgba(224,238,231,.7);margin-top:3px;">Concentração por faixa de share acumulado · '+periodTxt+'</div>';
    html += '</div>';
    html += '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-family:Montserrat,sans-serif;">';
    html += '<thead><tr style="background:rgba(1,30,60,.06);border-bottom:2px solid rgba(1,30,60,.12);">';
    html += '<th style="padding:11px 18px;text-align:left;font-size:11px;font-weight:700;color:#011E3C;letter-spacing:.06em;text-transform:uppercase;width:80px;">Grupo</th>';
    html += '<th style="padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:#011E3C;letter-spacing:.06em;text-transform:uppercase;">Volume</th>';
    html += '<th style="padding:11px 14px;text-align:center;font-size:11px;font-weight:700;color:#011E3C;letter-spacing:.06em;text-transform:uppercase;background:rgba(1,30,60,.04);">N° de Clientes</th>';
    html += '<th style="padding:11px 14px;text-align:center;font-size:11px;font-weight:700;color:#011E3C;letter-spacing:.06em;text-transform:uppercase;background:rgba(15,66,69,.07);">Faixa Share Acumulado</th>';
    html += '</tr></thead><tbody>';
    grpsDef.forEach(function(g){
      const pct = cliArr.length ? fmtPctSim(g.arr.length/cliArr.length*100) : '—';
      const fatGrp = g.arr.reduce(function(s,c){ return s + (c.total||0); }, 0);
      const fatPct = totFatCli > 0 ? fmtPctSim(fatGrp/totFatCli*100) : '—';
      html += '<tr style="border-bottom:1px solid rgba(1,30,60,.07);background:'+g.rowBg+';transition:background .15s;">';
      html += '<td style="padding:13px 18px;">';
      html += '<span style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:'+g.badgeBg+';color:'+g.badgeColor+';font-size:15px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.18);">'+g.id+'</span>';
      html += '</td>';
      html += '<td style="padding:13px 14px;font-size:13px;font-weight:600;color:#011E3C;">'+g.label+'</td>';
      html += '<td style="padding:13px 14px;text-align:center;background:rgba(1,30,60,.04);">';
      html += '<span style="font-size:18px;font-weight:800;color:'+g.badgeBg+';">'+fmtNum(g.arr.length,0)+'</span>';
      html += '<span style="font-size:11px;color:#546e8a;margin-left:5px;">('+pct+')</span>';
      html += '</td>';
      html += '<td style="padding:13px 14px;text-align:center;background:rgba(15,66,69,.05);">';
      html += '<span style="display:inline-block;padding:4px 12px;border-radius:20px;background:'+g.badgeBg+';color:'+g.badgeColor+';font-size:11px;font-weight:700;letter-spacing:.03em;">'+g.faixa+'</span>';
      html += '<span style="display:block;font-size:11px;color:#546e8a;margin-top:3px;">'+fatPct+' do faturamento</span>';
      html += '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';

    // Tabela ranking com toggle Top 5 / Top 10 / Top 20 / Total (logo após segmentação)
    html += '<div class="chart-card light" style="margin-bottom:28px;padding:0;overflow:hidden;">';
    html += '<div style="padding:16px 18px 4px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">';
    html += '<div class="chart-card-title" style="margin:0;">Ranking de clientes por faturamento</div>';
    html += '<div id="topnBtns" style="display:flex;gap:6px;">';
    [5,10,20].forEach(function(n, i){
      const isActive = (n === 5);
      html += '<button onclick="setCliTopN('+JSON.stringify(n)+')" id="topnBtn'+n+'" style="'
        +'font-family:Montserrat,sans-serif;font-size:11px;font-weight:600;border:1.5px solid #011E3C;'
        +'border-radius:6px;padding:5px 13px;cursor:pointer;transition:all .15s;'
        +(isActive ? 'background:#011E3C;color:#fff;' : 'background:transparent;color:#011E3C;')
        +'" onmouseover="this.style.opacity=.8" onmouseout="this.style.opacity=1">'
        +'Top '+n+'</button>';
    });
    html += '</div></div>';
    html += '<div style="overflow-x:auto;"><table class="abc-table">';
    html += '<thead><tr><th>#</th><th class="abc-name">Cliente</th><th>Tipo</th><th>Qtd Itens</th><th>Faturamento</th><th>Ticket Médio</th><th>Mix %</th><th>Share Ac.</th></tr></thead>';
    html += '<tbody id="cliTableBody">';
    cliArr.slice(0,5).forEach(function(c){
      const tipo = c.tipo || 'B2C';
      html += '<tr><td>'+c.pos+'</td>';
      html += '<td class="abc-name">'+(c.nome||'').toString().slice(0,42)+'</td>';
      html += '<td><span class="tipo-badge tipo-'+tipo.toLowerCase()+'">'+tipo+'</span></td>';
      html += '<td>'+fmtNum(c.qtd,0)+'</td>';
      html += '<td>'+fmtBRLk(c.total)+'</td>';
      html += '<td>'+fmtBRLk(c.tkt)+'</td>';
      html += '<td>'+fmtPctSim(c.mix)+'</td>';
      html += '<td>'+fmtPctSim(c.share_ac)+'</td></tr>';
    });
    html += '</tbody></table></div></div>';

    // Gráficos ABC: Concentração (barras) + Donut ABC grupos — após o ranking
    html += '<div class="grid-2" style="margin-bottom:28px;">';
    html += '<div class="chart-card light"><div class="chart-card-title">Top 10 — Concentração de faturamento</div><div class="chart-card-sub">Participação individual na receita</div><div style="position:relative;height:330px;"><canvas id="chAbcConcentracao"></canvas></div></div>';
    html += '<div class="chart-card light"><div class="chart-card-title">Número de clientes por grupo</div><div class="chart-card-sub">Grupo A · Altíssimo | B · Alto | C · Médio | D · Baixo</div><div style="position:relative;height:330px;"><canvas id="chAbcGrupos"></canvas></div></div>';
    html += '</div>';

    // Armazenar cliArr em STATE para uso em buildComClientesCharts e setCliTopN
    STATE.cliArr = cliArr.map(function(c){ return {pos:c.pos,nome:c.nome,tipo:c.tipo,semClass:c.semClass,qtd:c.qtd,total:c.total,tkt:c.tkt,mix:c.mix,share_ac:c.share_ac}; });

    // Aviso de clientes sem classificação B2B/B2C — no final da página, depois
    // de tudo. Esses clientes ficam de FORA do cálculo de Mix B2B vs B2C acima
    // (não contam nem como B2B nem como B2C) até serem revisados na aba
    // "Classificacao_Clientes" da planilha.
    var semClass = cliArr.filter(function(c){ return c.semClass; });
    if (semClass.length){
      var fatSemClass = semClass.reduce(function(s,c){ return s+(c.total||0); }, 0);
      html += '<div style="background:#FFF6E5;border:1px solid #F0D28A;border-radius:10px;padding:14px 18px;margin:0 0 24px;font-size:13px;color:#7A5A10;">'
        + '⚠ <strong>' + semClass.length + ' cliente(s) sem classificação B2B/B2C</strong> neste período — ' + fmtBRLk(fatSemClass) + ' em faturamento não entram no Mix B2B vs B2C acima até serem revisados. '
        + 'Provavelmente são clientes novos que ainda não entraram nos relatórios do eGestor enviados; assim que forem classificados na aba "Classificacao_Clientes" da planilha, eles passam a contar automaticamente.'
        + '</div>';
    }
  }

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

/* ============ ABA 03 — COMERCIAL · PADRÃO SEMANAL ============ */
function renderComPadraoSemanal(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);
  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';

  // Header
  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--navy);"><span class="pill-num">03</span> · Comercial · Padrão Semanal</div>';
  html += '<h2 class="title-xl">Padrão<br><u>semanal</u></h2>';
  html += '<p class="lead" style="color:var(--text-on-light-muted);">Concentração de faturamento e de vendas por dia da semana.<br>Período: '+periodTxt+'.</p>';
  html += '</div></div>';
  html += '<hr class="np-divider">';

  // === Concentração por dia da semana ===
  const diasOrd = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  const sdAgg = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.share_dia) return;
    Object.entries(d.share_dia).forEach(function([dia, v]){
      if (!sdAgg[dia]) sdAgg[dia] = {qtd:0, fat:0};
      sdAgg[dia].qtd += v.qtd||0;
      sdAgg[dia].fat += v.fat||0;
    });
  });
  const diasComDado = diasOrd.filter(function(d){ return !!sdAgg[d]; });

  if (diasComDado.length > 0) {
    const totFatDia = diasComDado.reduce(function(s,d){ return s+sdAgg[d].fat; }, 0);
    const totQtdDia = diasComDado.reduce(function(s,d){ return s+sdAgg[d].qtd; }, 0);
    const melhorDia = diasComDado.reduce(function(a,b){ return sdAgg[a].fat >= sdAgg[b].fat ? a : b; });
    const piorDia = diasComDado.reduce(function(a,b){ return sdAgg[a].fat <= sdAgg[b].fat ? a : b; });

    html += '<h3 class="section-title">Indicadores · '+periodTxt+'</h3>';
    html += '<div class="grid-3" style="margin-bottom:24px;">';
    html += kpiCardLight('Melhor dia', melhorDia, fmtBRLk(sdAgg[melhorDia].fat)+' no período', 'pos');
    html += kpiCardLight('Dia mais fraco', piorDia, fmtBRLk(sdAgg[piorDia].fat)+' no período', 'neg');
    html += kpiCardLight('Dias com venda', fmtNum(diasComDado.length,0), 'de 7 dias da semana', 'neu');
    html += '</div>';

    html += '<hr class="np-divider">';
    html += '<h3 class="section-title">Concentração por dia da semana · '+periodTxt+'</h3>';
    html += '<div class="grid-2" style="margin-bottom:28px;">';
    html += '<div class="chart-card light"><div class="chart-card-title">Faturamento por dia da semana</div><div class="chart-card-sub">Distribuição da receita</div><div style="position:relative;height:350px;"><canvas id="chDiaFat"></canvas></div></div>';
    html += '<div class="chart-card light"><div class="chart-card-title">Vendas por dia da semana</div><div class="chart-card-sub">Quantidade de vendas únicas</div><div style="position:relative;height:350px;"><canvas id="chDiaQtd"></canvas></div></div>';
    html += '</div>';

    // Tabela detalhada por dia — ordenável por clique no cabeçalho
    STATE.padraoSemanalRows = diasComDado.map(function(d){
      return {
        dia: d,
        diaIdx: diasOrd.indexOf(d),
        fat: sdAgg[d].fat,
        pctFat: totFatDia ? (sdAgg[d].fat/totFatDia*100) : null,
        qtd: sdAgg[d].qtd
      };
    });
    if (!STATE.padraoSemanalSort) STATE.padraoSemanalSort = {col:'diaIdx', dir:1};

    html += '<div class="chart-card light" style="padding:0;overflow:hidden;margin-bottom:28px;">';
    html += '<div style="overflow-x:auto;"><table class="abc-table" id="padraoSemanalTable">';
    html += '<thead><tr>';
    html += '<th class="abc-name" style="cursor:pointer;user-select:none;" onclick="sortPadraoSemanal(\'diaIdx\')">Dia<span id="ps-arrow-diaIdx"></span></th>';
    html += '<th style="cursor:pointer;user-select:none;" onclick="sortPadraoSemanal(\'fat\')">Faturamento<span id="ps-arrow-fat"></span></th>';
    html += '<th style="cursor:pointer;user-select:none;" onclick="sortPadraoSemanal(\'pctFat\')">% do Total<span id="ps-arrow-pctFat"></span></th>';
    html += '<th style="cursor:pointer;user-select:none;" onclick="sortPadraoSemanal(\'qtd\')">N° de vendas<span id="ps-arrow-qtd"></span></th>';
    html += '</tr></thead><tbody id="padraoSemanalTbody"></tbody></table></div></div>';
  } else {
    html += '<div class="placeholder-card"><div class="ph-icon">📅</div><div class="ph-title">Sem dados de padrão semanal</div><div class="ph-sub">O período selecionado não tem detalhamento por dia da semana disponível.</div></div>';
  }

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}


/* ============ ABA 04 — PRODUTOS ============ */
function renderProdutos(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);
  const unico = meses.length === 1;
  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';

  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--navy);"><span class="pill-num">03</span> · Comercial · Produtos</div>';
  html += '<h2 class="title-xl">Mix<br>e <u>Produtos</u></h2>';
  html += '<p class="lead" style="color:var(--text-on-light-muted);">ABC de Produtos, agrupamento Linha × Tamanho, margens e comparativo vendido vs produzido.<br>Custos unitários extraídos do ERP (aba ABC Produtos).</p>';
  html += '</div></div>';
  html += '<hr class="np-divider">';

  // === Agregar produtos de todos os meses selecionados ===
  // Fev/26 usa proxy de Mar/26 nos custos — marcar com ⚠ quando incluso
  const temFev = meses.includes('Fev/26');
  const prodMap = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.produtos_abc) return;
    d.produtos_abc.forEach(function(p){
      if (!p.produto || p.produto === 'TOTAL') return;
      const k = canonProduto(p.produto);
      if (!prodMap[k]) prodMap[k] = {
        produto: p.produto, linha: p.linha, tamanho: p.tamanho,
        qtd: 0, venda_total: 0, custo_total: 0, lucro: 0, _nomeQtd: -1
      };
      if ((p.qtd||0) > prodMap[k]._nomeQtd) { prodMap[k].produto = p.produto; prodMap[k].linha = p.linha; prodMap[k].tamanho = p.tamanho; prodMap[k]._nomeQtd = (p.qtd||0); }
      prodMap[k].qtd += p.qtd||0;
      prodMap[k].venda_total += p.venda_total||0;
      prodMap[k].custo_total += p.custo_total||0;
      prodMap[k].lucro += p.lucro||0;
    });
  });
  const skus = Object.values(prodMap)
    .sort((a,b) => b.venda_total - a.venda_total)
    .map(function(p, i){
      p.pos = i+1;
      p.markup = p.custo_total > 0 ? (p.lucro/p.custo_total*100) : 0;
      return p;
    });
  const totVenda = skus.reduce((s,p)=>s+(p.venda_total||0),0);
  let runMix = 0;
  skus.forEach(p => {
    p.mix = totVenda ? (p.venda_total/totVenda*100) : 0;
    runMix += p.mix;
    p.share_ac = runMix;
  });
  const totLucro = skus.reduce((s,p)=>s+(p.lucro||0),0);
  const totCusto = skus.reduce((s,p)=>s+(p.custo_total||0),0);
  const margemMedia = totVenda ? (totLucro/totVenda*100) : 0;
  const markupMedio = totCusto ? (totLucro/totCusto*100) : 0;

  // === Indicadores (cards) — primeiro bloco da aba ===
  html += '<h3 class="section-title">Indicadores · '+periodTxt+'</h3>';
  // Aviso Fev/26 movido para aba 6 (Qualidade dos Dados)
  html += '<div class="grid-4" style="margin-bottom:24px;">';
  html += kpiCardLight('Produtos vendidos', fmtNum(skus.length,0), 'produtos distintos', 'neu');
  html += kpiCardLight('Faturamento', fmtBRLk(totVenda), '100%', 'neu');
  html += kpiCardLight('Lucro Bruto (s/ rateio)', fmtBRLk(totLucro), 'margem '+fmtPctSim(margemMedia), 'neu');
  html += kpiCardLight('Markup médio', fmtPctSim(markupMedio), 'sobre custo', 'neu');
  html += '</div>';

  // === ABC Produtos completa ===
  html += '<hr class="np-divider">';
  STATE.skusArr = skus.map(function(p){ return {pos:p.pos,produto:p.produto,qtd:p.qtd,venda_total:p.venda_total,custo_total:p.custo_total,lucro:p.lucro,markup:p.markup,mix:p.mix}; });
  html += '<div class="chart-card light" style="margin-bottom:24px;padding:0;overflow:hidden;">';
  html += '<div style="padding:16px 18px 4px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">';
  html += '<div class="chart-card-title" style="margin:0;">ABC completa · '+skus.length+' produtos</div>';
  html += '<div id="prodTopnBtns" style="display:flex;gap:6px;">';
  [5,10,20].forEach(function(n){
    const isActive = (n === 5);
    html += '<button onclick="setProdTopN('+JSON.stringify(n)+')" id="prodTopnBtn'+n+'" style="'
      +'font-family:Montserrat,sans-serif;font-size:11px;font-weight:600;border:1.5px solid #011E3C;'
      +'border-radius:6px;padding:5px 13px;cursor:pointer;transition:all .15s;'
      +(isActive ? 'background:#011E3C;color:#fff;' : 'background:transparent;color:#011E3C;')
      +'" onmouseover="this.style.opacity=.8" onmouseout="this.style.opacity=1">'
      +'Top '+n+'</button>';
  });
  html += '</div></div>';
  html += '<div style="overflow-x:auto;max-height:520px;overflow-y:auto;"><table class="abc-table">';
  html += '<thead><tr><th>#</th><th class="abc-name">Produto</th><th>Qtd</th><th>Faturamento</th><th>Custo Unit.</th><th>Lucro</th><th>Mix %</th></tr></thead>';
  html += '<tbody id="prodTableBody">';
  skus.slice(0,5).forEach(p => {
    const cu = p.qtd ? (p.custo_total/p.qtd) : 0;
    html += '<tr><td>'+p.pos+'</td><td class="abc-name">'+(p.produto||'').trim()+'</td>';
    html += '<td>'+fmtNum(p.qtd,0)+'</td><td>'+fmtBRLk(p.venda_total)+'</td>';
    html += '<td>'+fmtBRLk(cu)+'</td><td>'+fmtBRLk(p.lucro)+'</td>';
    html += '<td>'+fmtPctSim(p.mix)+'</td></tr>';
  });
  html += '</tbody></table></div></div>';

  // === Agrupamento por linha ===
  html += '<hr class="np-divider">';
  html += '<h3 class="section-title">Composição por Linha de produto</h3>';
  const porLinha = {};
  skus.forEach(p => {
    const L = p.linha || 'Tradicional';
    if (!porLinha[L]) porLinha[L] = {qtd:0, venda:0, custo:0, lucro:0};
    porLinha[L].qtd += p.qtd||0;
    porLinha[L].venda += p.venda_total||0;
    porLinha[L].custo += p.custo_total||0;
    porLinha[L].lucro += p.lucro||0;
  });
  html += '<div class="grid-2" style="margin-bottom:24px;">';
  html += '<div class="chart-card light"><div class="chart-card-title">Faturamento por linha</div><div class="chart-card-sub">Composição da receita</div><div style="position:relative;height:330px;"><canvas id="chLinhaFat"></canvas></div></div>';
  html += '<div class="chart-card light"><div class="chart-card-title">Margem % por linha</div><div class="chart-card-sub">Lucro / Venda · Calda excluída (markup distorcido no ERP)</div><div style="position:relative;height:330px;"><canvas id="chLinhaMargem"></canvas></div></div>';
  html += '</div>';

  html += '<div class="chart-card light" style="margin-bottom:36px;padding:0;overflow:hidden;">';
  html += '<div class="chart-card-title" style="padding:16px 18px 4px;">Detalhamento por linha</div>';
  html += '<div style="overflow-x:auto;"><table class="abc-table">';
  html += '<thead><tr><th>#</th><th class="abc-name">Linha</th><th>Qtd Vendida</th><th>Faturamento</th><th>Custo Total</th><th>Lucro</th><th>Margem %</th><th>Mix %</th></tr></thead><tbody>';
  const linhasArr = Object.entries(porLinha).filter(([L])=>(L||'').trim().toLowerCase()!=='calda').sort((a,b)=>b[1].venda - a[1].venda);
  linhasArr.forEach(([L, d], i) => {
    const margem = d.venda ? (d.lucro/d.venda*100) : 0;
    const mix = totVenda ? (d.venda/totVenda*100) : 0;
    html += '<tr><td>'+(i+1)+'</td><td class="abc-name"><strong>'+L+'</strong></td>';
    html += '<td>'+fmtNum(d.qtd,0)+'</td><td>'+fmtBRLk(d.venda)+'</td>';
    html += '<td>'+fmtBRLk(d.custo)+'</td><td>'+fmtBRLk(d.lucro)+'</td>';
    html += '<td>'+fmtPctSim(margem)+'</td><td>'+fmtPctSim(mix)+'</td></tr>';
  });
  html += '</tbody></table></div></div>';

  // === Cruzamento Linha × Tamanho ===
  html += '<h3 class="section-title">Cruzamento Linha × Tamanho · Faturamento</h3>';
  const tamanhos = ['10L','5L','2L','1L','500ml','Galão'];
  const linhas = Array.from(new Set(skus.map(p=>p.linha||'Tradicional')));
  const matriz = {};
  linhas.forEach(L => { matriz[L] = {}; tamanhos.forEach(T => matriz[L][T] = 0); });
  skus.forEach(p => {
    const L = p.linha || 'Tradicional';
    const T = (p.tamanho === '-' || !p.tamanho) ? '500ml' : p.tamanho;
    if (matriz[L] && matriz[L][T] !== undefined) matriz[L][T] += p.venda_total||0;
  });
  html += '<div class="chart-card light" style="margin-bottom:36px;padding:0;overflow:hidden;">';
  html += '<div style="overflow-x:auto;"><table class="abc-table">';
  html += '<thead><tr><th>#</th><th class="abc-name">Linha \\\\ Tamanho</th>';
  tamanhos.forEach(T => html += '<th>'+T+'</th>');
  html += '<th>Total</th></tr></thead><tbody>';
  linhas.forEach((L, i) => {
    html += '<tr><td>'+(i+1)+'</td><td class="abc-name"><strong>'+L+'</strong></td>';
    let tot = 0;
    tamanhos.forEach(T => {
      const v = matriz[L][T] || 0;
      tot += v;
      html += '<td style="'+(v>0?'':'opacity:.3;')+'">'+(v > 0 ? fmtBRLk(v) : '–')+'</td>';
    });
    html += '<td><strong>'+fmtBRLk(tot)+'</strong></td></tr>';
  });
  html += '</tbody></table></div></div>';

  // === Cruzamento vendido vs produzido — só mês único (cruzamento não disponível no JSON) ===
  const cruzamentoMes04 = unico && __ABAS_POR_MES__[meses[0]] ? __ABAS_POR_MES__[meses[0]].cruzamento : null;
  if (unico && cruzamentoMes04) {
    html += '<hr class="np-divider">';
    html += '<h3 class="section-title">Vendido vs Produzido · '+meses[0]+'</h3>';
    html += '<p class="lead" style="margin-bottom:16px;color:var(--text-on-light-muted);font-size:13px;">Diferença positiva indica formação de estoque; negativa indica consumo de estoque ou produção insuficiente.</p>';
    const cruz = cruzamentoMes04.filter(c => c.vendido > 0 || c.produzido > 0)
      .sort((a,b) => Math.abs(b.diferenca) - Math.abs(a.diferenca));
    html += '<div class="chart-card light" style="margin-bottom:36px;padding:0;overflow:hidden;">';
    html += '<div style="overflow-x:auto;"><table class="abc-table">';
    html += '<thead><tr><th>#</th><th class="abc-name">Produto</th><th>Vendido</th><th>Produzido</th><th>Diferença</th><th>Status</th></tr></thead><tbody>';
    cruz.forEach((c, i) => {
      const ststr = c.diferenca > 0 ? '<span style="color:var(--success);">+ estoque</span>' :
                    c.diferenca < 0 ? '<span style="color:var(--danger);">– estoque</span>' :
                    '<span style="opacity:.5;">equilíbrio</span>';
      html += '<tr><td>'+(i+1)+'</td><td class="abc-name">'+c.produto+'</td>';
      html += '<td>'+fmtNum(c.vendido,0)+'</td><td>'+fmtNum(c.produzido,0)+'</td>';
      html += '<td><strong>'+(c.diferenca > 0 ? '+' : '')+fmtNum(c.diferenca,0)+'</strong></td>';
      html += '<td>'+ststr+'</td></tr>';
    });
    html += '</tbody></table></div></div>';
  } else if (!unico) {
    html += '<div style="padding:14px 18px;background:rgba(15,66,69,.06);border-radius:8px;margin-bottom:36px;font-size:12px;color:var(--text-on-light-muted);">';
    html += 'Cruzamento Vendido vs Produzido disponível apenas para análise de mês único.</div>';
  }

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

/* ============ ABA 05 — PRODUÇÃO ============ */
/* ============ PRODUÇÃO · SUBABA "VISÃO GERAL" ============ */
function renderProducaoGeral(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);
  const caldaToggle = 'cenario_a';
  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';

  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--navy);"><span class="pill-num">05</span> · Produção · Visão Geral</div>';
  html += '<h2 class="title-xl">Produção<br>e <u>eficiência</u></h2>';
  const totalBatidasDesc = meses.reduce((s,m)=>{ const d=__ABAS_POR_MES__[m]; return s+(d?d.producao.batidas.length:0); },0);
  html += '<p class="lead" style="color:var(--text-on-light-muted);">Volume por produto, custo unitário e número de ordens de produção.<br>';
  html += '<strong style="font-size:12px;">Ordem de Produção</strong> = registro de lote fabricado no ERP (cada ordem corresponde a um lote fabricado no dia). ';
  html += periodTxt+': '+fmtNum(totalBatidasDesc,0)+' ordens de produção registradas.</p>';
  html += '</div></div>';
  html += '<hr class="np-divider">';

  // === Agregar produção de todos os meses ===
  const aggMap = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.producao || !d.producao.agregado) return;
    d.producao.agregado.forEach(function(a){
      const isCalda = (a.produto||'').toLowerCase().includes('calda');
      if (caldaToggle === 'cenario_a' && isCalda) return; // ocultar calda no cenário A
      const k = canonProduto(a.produto);
      if (!aggMap[k]) aggMap[k] = {
        produto: a.produto, linha: a.linha||'', tamanho: a.tamanho||'',
        qtd: 0, custo_total: 0, _nomeQtd: -1
      };
      if ((a.qtd||0) > aggMap[k]._nomeQtd) { aggMap[k].produto = a.produto; aggMap[k].linha = a.linha||''; aggMap[k].tamanho = a.tamanho||''; aggMap[k]._nomeQtd = (a.qtd||0); }
      aggMap[k].qtd += a.qtd||0;
      aggMap[k].custo_total += a.custo_total||0;
    });
  });
  const agg = Object.values(aggMap).map(function(a){
    a.custo_unit = a.qtd > 0 ? a.custo_total/a.qtd : 0;
    return a;
  }).sort((a,b) => b.qtd - a.qtd);

  const totUnidades = agg.reduce((s,a)=>s+a.qtd,0);
  const totCusto = agg.reduce((s,a)=>s+a.custo_total,0);

  const totalBatidasCount = meses.reduce((s,m)=>{ const d=__ABAS_POR_MES__[m]; return s+(d?d.producao.batidas.length:0); },0);

  // KPIs
  html += '<h3 class="section-title">Indicadores · '+periodTxt+'</h3>';

function renderProducaoBatidas(){

  html += '</div></div>';
  html += '<hr class="np-divider">';

  // === Batidas: concatenar e ordenar por data ===
  let todasBatidas = [];
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.producao) return;
    d.producao.batidas.forEach(function(b){
      todasBatidas.push(Object.assign({}, b, {_mes: m}));
    });
  });
  todasBatidas.sort(function(a,b){
    const pa = a.dt.split('/').reverse().join('');
    const pb = b.dt.split('/').reverse().join('');
    return pa > pb ? 1 : pa < pb ? -1 : 0;
  });

  // === Batidas por dia (agrupadas) ===
  const batidasDia = {};
  const qtdDia = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.producao) return;
    if (d.producao.batidas_por_dia) {
      Object.entries(d.producao.batidas_por_dia).forEach(function([dia, v]){
        batidasDia[dia] = (batidasDia[dia]||0) + v;
      });
    }
    if (d.producao.qtd_por_dia) {
      Object.entries(d.producao.qtd_por_dia).forEach(function([dia, v]){
        qtdDia[dia] = (qtdDia[dia]||0) + v;
      });
    }
  });
  const diasOrdenados = Object.keys(batidasDia).sort(function(a,b){
    const pa = a.split('/').reverse().join('');
    const pb = b.split('/').reverse().join('');

  });

  html += kpiCardLight('Unidades nas ordens', fmtNum(totQtdBatidas, 1), 'soma qtd_total', 'neu');

  html += kpiCardLight('Custo total das ordens', fmtBRLk(totCustoBatidas), 'soma custo_total', 'neu');
  html += kpiCardLight('Dias com produção', fmtNum(diasOrdenados.length, 0), 'dias distintos', 'neu');
  html += '</div>';

    html += '<hr class="np-divider">';
    if (unico) {
      html += '<h3 class="section-title">Distribuição das ordens de produção no mês <span style="font-size:12px;font-weight:400;color:var(--text-on-light-muted);">— por semana</span></h3>';

      html += '<div class="chart-card light"><div class="chart-card-title">Ordens de produção por semana</div><div class="chart-card-sub">Número de lotes produzidos por semana</div><div style="position:relative;height:330px;"><canvas id="chBatidasDia"></canvas></div></div>';
      html += '<div class="chart-card light"><div class="chart-card-title">Volume produzido por semana</div><div class="chart-card-sub">Total de unidades fabricadas por semana</div><div style="position:relative;height:330px;"><canvas id="chQtdDia"></canvas></div></div>';
    } else {

      html += '<div class="grid-2" style="margin-bottom:36px;">';
      html += '<div class="chart-card light"><div class="chart-card-title">Ordens de produção por mês</div><div class="chart-card-sub">Número de lotes produzidos por mês</div><div style="position:relative;height:330px;"><canvas id="chBatidasDia"></canvas></div></div>';

  html += '<div style="overflow-x:auto;max-height:480px;overflow-y:auto;"><table class="abc-table">';
  html += '<thead><tr><th>Ordem</th><th>Mês</th><th>Data</th><th>Itens</th><th>Qtd Total</th><th>Custo Total</th></tr></thead><tbody>';

    html += '<td>'+(b.dt||'-')+'</td>';

    html += '<td>'+fmtNum(b.qtd_total,1)+'</td>';
    html += '<td>'+fmtBRLk(b.custo_total)+'</td></tr>';
  });
  html += '</tbody></table></div></div>';

/* ============ HELPERS SÉRIES ============ */
function sumSerieFat(meses){
  if (!meses) return 0;
  return meses.reduce((s,m) => s + (SERIES.faturamento[m] || 0), 0);
}
function sumSerieVendas(meses){
  return meses.reduce((s,m) => s + (SERIES.n_vendas[m] || 0), 0);
}
function sumSerieDesc(meses){
  return meses.reduce((s,m) => s + (SERIES.descontos[m] || 0), 0);
}
function avgSerie(key, meses){
  const vs = meses.map(m => SERIES[key][m]).filter(v => v != null);
  if (!vs.length) return null;
  return vs.reduce((s,v)=>s+v,0) / vs.length;
}
function prevMonths(meses){
  // Retorna o período imediatamente anterior do mesmo tamanho
  if (!meses.length) return [];
  const idx0 = MESES.indexOf(meses[0]);
  const n = meses.length;
  const start = idx0 - n;
  if (start < 0) return [];
  return MESES.slice(start, idx0);
}
function prevYear(mes){
  // Abr/26 → Abr/25
  const m = mes.match(/^(.+)\/(\d\d)$/);
  if (!m) return mes;
  const yy = parseInt(m[2]) - 1;
  return m[1] + '/' + (yy < 10 ? '0' + yy : yy);
}
function deltaClsAbas(diff){
  if (diff > 0) return 'pos';
  if (diff < 0) return 'neg';
  return 'neu';
}

/* ---- Plugin inline: rótulos acima das barras (sem CDN externa) ---- */
/* Suporta barras verticais e horizontais (indexAxis:'y'); fmtFn pode receber (val, ds, i) para formatação dinâmica */
function makeLabelPlugin(fmtFn, opts){
  // opts: { color, font, negAbaixo }
  opts = opts || {};
  return {
    id: opts.id || 'nortBarLabels',
    afterDatasetsDraw: function(chart, args, pluginOpts){
      var ctx = chart.ctx;
      var horizontal = chart.options && chart.options.indexAxis === 'y';
      chart.data.datasets.forEach(function(ds, di){
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden) return;
        if (ds.type === 'line') return;
        meta.data.forEach(function(bar, i){
          var val = ds.data[i];
          if (val == null || val === 0) return;
          var label = fmtFn(val, ds, i);
          if (!label) return;
          ctx.save();
          ctx.font = (opts.font || '600 10px Montserrat,sans-serif');
          ctx.fillStyle = opts.color || '#011E3C';
          if (horizontal){
            ctx.textAlign = val < 0 ? 'right' : 'left';
            ctx.textBaseline = 'middle';
            var xPos = bar.x + (val < 0 ? -5 : 5);
            ctx.fillText(label, xPos, bar.y);
          } else {
            ctx.textAlign = 'center';
            var isNeg = (val < 0 && opts.negAbaixo);
            ctx.textBaseline = isNeg ? 'top' : 'bottom';
            var yPos = bar.y + (isNeg ? 4 : -4);
            ctx.fillText(label, bar.x, yPos);
          }
          ctx.restore();
        });
      });
    }
  };
}
/* ---- Plugin inline: rótulos acima dos pontos, para gráficos de linha simples ---- */
function makePointLabelPlugin(fmtFn, opts){
  opts = opts || {};
  return {
    id: opts.id || 'nortPointLabels',
    afterDatasetsDraw: function(chart){
      var ctx = chart.ctx;
      chart.data.datasets.forEach(function(ds, di){
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden) return;
        meta.data.forEach(function(pt, i){
          var val = ds.data[i];
          if (val == null) return;
          var label = fmtFn(val, ds, i);
          if (!label) return;
          ctx.save();
          ctx.font = (opts.font || '600 10px Montserrat,sans-serif');
          ctx.fillStyle = opts.color || '#011E3C';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(label, pt.x, pt.y - (opts.offset || 8));
          ctx.restore();
        });
      });
    }
  };
}
/* ---- Formatadores específicos para os rótulos ---- */
var _pluginFat  = makeLabelPlugin(function(v){ return fmtBRLk(v); });
var _pluginTkt  = makeLabelPlugin(function(v){ return 'R$ '+Math.round(v).toLocaleString('pt-BR'); });
var _pluginInt  = makeLabelPlugin(function(v){ return Math.round(v).toLocaleString('pt-BR'); });
var _pluginYoY  = makeLabelPlugin(function(v){ return (v>=0?'+':'')+v.toFixed(1).replace('.',',')+'%'; }, {negAbaixo:true});
/* Plugin exclusivo para chYoYFat (e demais gráficos YoY compactos): rótulo centralizado sobre cada barra, formato compacto (valor em mil, sem "R$"/"mil") */
var _pluginFatOffset = (function(){
  function fmt(v){
    if (v == null || isNaN(v)) return '';
    var mil = v / 1e3;
    var casas = Math.abs(mil) >= 100 ? 0 : 1;
    return mil.toFixed(casas).replace('.', ',');
  }
  return {
    id: 'nortBarLabelsOffset',
    afterDatasetsDraw: function(chart){
      var ctx = chart.ctx;
      chart.data.datasets.forEach(function(ds, di){
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden || ds.type === 'line') return;
        meta.data.forEach(function(bar, i){
          var val = ds.data[i];
          if (val == null || val === 0) return;
          ctx.save();
          ctx.font = '600 9px Montserrat,sans-serif';
          ctx.fillStyle = '#011E3C';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(fmt(val), bar.x, bar.y - 4);
          ctx.restore();
        });
      });
    }
  };
})();

    });

  function vendas25Derivado(m25){
    var fat = SERIES.faturamento[m25] || 0;

  // YoY N° Vendas (2025 derivado vs 2026 real)

/* Tabela ordenável — Padrão Semanal (aba 03) */
function renderPadraoSemanalTbody(){
  const tbody = document.getElementById('padraoSemanalTbody');
  if (!tbody || !STATE.padraoSemanalRows) return;
  const sort = STATE.padraoSemanalSort || {col:'diaIdx', dir:1};
  const rows = STATE.padraoSemanalRows.slice().sort(function(a,b){
    const av = a[sort.col], bv = b[sort.col];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (av < bv) return -1 * sort.dir;
    if (av > bv) return 1 * sort.dir;
    return 0;
  });
  let html = '';
  rows.forEach(function(r){
    const pctTxt = r.pctFat != null ? fmtPctSim(r.pctFat) : '—';
    html += '<tr><td class="abc-name">'+r.dia+'</td><td>'+fmtBRLk(r.fat)+'</td><td>'+pctTxt+'</td><td>'+fmtNum(r.qtd,0)+'</td></tr>';
  });
  tbody.innerHTML = html;
  ['diaIdx','fat','pctFat','qtd'].forEach(function(col){
    const arrowEl = document.getElementById('ps-arrow-'+col);
    if (!arrowEl) return;
    arrowEl.innerHTML = (col === sort.col) ? (sort.dir === 1 ? ' &#9650;' : ' &#9660;') : '';
  });
}
function sortPadraoSemanal(col){
  const sort = STATE.padraoSemanalSort || {col:'diaIdx', dir:1};
  if (sort.col === col){
    sort.dir = sort.dir * -1;
  } else {
    sort.col = col;
    sort.dir = 1;
  }
  STATE.padraoSemanalSort = sort;
  renderPadraoSemanalTbody();
}

function buildProducaoGeralCharts(){
  const meses = STATE.selectedMonths;

  const aggMap = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.producao || !d.producao.agregado) return;
    d.producao.agregado.forEach(function(a){
      const isCalda = (a.produto||'').toLowerCase().includes('calda');
      if (caldaToggle === 'cenario_a' && isCalda) return;
      const k = canonProduto(a.produto);
      if (!aggMap[k]) aggMap[k] = {produto:a.produto, qtd:0, custo_total:0, _nomeQtd:-1};
      if ((a.qtd||0) > aggMap[k]._nomeQtd) { aggMap[k].produto = a.produto; aggMap[k]._nomeQtd = (a.qtd||0); }
      aggMap[k].qtd += a.qtd||0;
      aggMap[k].custo_total += a.custo_total||0;
    });

  const agg = Object.values(aggMap).map(function(a){ a.custo_unit = a.qtd > 0 ? a.custo_total / a.qtd : 0; return a; }).sort((a,b)=>b.qtd-a.qtd);

  const ctxC = document.getElementById('chProdCusto');
  if (ctxC){
    const custoProdMode = STATE.custoProdMode || 'total';

        scales:{x:{ticks:{color:'#011E3C',font:{size:10.5},callback:v=>fmtBRLk(v)},grid:{color:'rgba(1,30,60,.06)'}},

/* ============ PRODUÇÃO · GRÁFICOS "BATIDAS" ============ */
function buildProducaoBatidasCharts(){
  const meses = STATE.selectedMonths;
  const unico = meses.length === 1;

  const ctxOpts = nortChartBaseOpts(function(v){ return v; });

  // Batidas — agrupar por mês (multi) ou por semana (único)
  const batidasDia = {};
  const qtdDia = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.producao) return;
    if (d.producao.batidas_por_dia) {
      Object.entries(d.producao.batidas_por_dia).forEach(function([dia, v]){ batidasDia[dia] = (batidasDia[dia]||0) + v; });
    }
    if (d.producao.qtd_por_dia) {
      Object.entries(d.producao.qtd_por_dia).forEach(function([dia, v]){ qtdDia[dia] = (qtdDia[dia]||0) + v; });
    }
  });
  const diasRaw = Object.keys(batidasDia).sort(function(a,b){
    const pa = a.split('/').reverse().join('');
    const pb = b.split('/').reverse().join('');
    return pa > pb ? 1 : pa < pb ? -1 : 0;
  });

  // Função: converte "DD/MM/YYYY" → semana do mês no formato "Sem N (MM/AAAA)"
  function diaParaSemana(dStr) {
    const parts = dStr.split('/');
    const day = parseInt(parts[0], 10);
    const semN = Math.ceil(day / 7);
    return 'Sem ' + semN + ' (' + parts[1] + '/' + parts[2] + ')';
  }
  // Função: converte "DD/MM/YYYY" → "MMM/AAAA" (ex: "Jan/2026")
  const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  function diaParaMes(dStr) {
    const parts = dStr.split('/');
    const mes = parseInt(parts[1], 10) - 1;
    return MESES_ABREV[mes] + '/' + parts[2];
  }

  // Agregar
  let agrupKeys, agrupBatidas, agrupQtd;
  if (unico) {
    // Por semana
    const mapB = {}, mapQ = {};
    diasRaw.forEach(function(d){
      const k = diaParaSemana(d);
      mapB[k] = (mapB[k]||0) + batidasDia[d];
      mapQ[k] = (mapQ[k]||0) + (qtdDia[d]||0);
    });
    agrupKeys = Object.keys(mapB);
    agrupBatidas = mapB;
    agrupQtd = mapQ;
  } else {
    // Por mês
    const mapB = {}, mapQ = {};
    diasRaw.forEach(function(d){
      const k = diaParaMes(d);
      mapB[k] = (mapB[k]||0) + batidasDia[d];
      mapQ[k] = (mapQ[k]||0) + (qtdDia[d]||0);
    });
    agrupKeys = Object.keys(mapB).sort(function(a,b){
      const ai = MESES_ABREV.indexOf(a.split('/')[0]) + parseInt(a.split('/')[1],10)*12;
      const bi = MESES_ABREV.indexOf(b.split('/')[0]) + parseInt(b.split('/')[1],10)*12;
      return ai - bi;
    });
    agrupBatidas = mapB;
    agrupQtd = mapQ;
  }

  const ctxBD = document.getElementById('chBatidasDia');
  if (ctxBD && agrupKeys.length > 0){
    STATE.charts.batidasDia = new Chart(ctxBD, {
      type:'bar',
      data:{labels: agrupKeys, datasets:[{label:'Ordens de produção', data: agrupKeys.map(k=>agrupBatidas[k]),
        backgroundColor:'#0F4245', borderRadius:4}]},
      options:{...ctxOpts, layout:{padding:{top:24}},
        scales:{x:{ticks:{color:'#011E3C',font:{size:unico?9:10}},grid:{display:false}},
          y:{beginAtZero:true,grace:'12%',ticks:{color:'#011E3C',font:{size:10.5}},grid:{color:'rgba(1,30,60,.06)'}}}},
      plugins: [makeLabelPlugin(function(v){ return Math.round(v).toLocaleString('pt-BR'); }, {font:'600 9.5px Montserrat,sans-serif'})]
    });
  }

  const ctxQD = document.getElementById('chQtdDia');
  if (ctxQD && agrupKeys.length > 0){
    STATE.charts.qtdDia = new Chart(ctxQD, {
      type:'bar',
      data:{labels: agrupKeys, datasets:[{label:'Unidades', data: agrupKeys.map(k=>agrupQtd[k]),
        backgroundColor:'#A8CCA8', borderRadius:4}]},
      options:{...ctxOpts, layout:{padding:{top:24}},
        scales:{x:{ticks:{color:'#011E3C',font:{size:unico?9:10}},grid:{display:false}},
          y:{beginAtZero:true,grace:'12%',ticks:{color:'#011E3C',font:{size:10.5}},grid:{color:'rgba(1,30,60,.06)'}}}},
      plugins: [makeLabelPlugin(function(v){ return Math.round(v).toLocaleString('pt-BR'); }, {font:'600 9.5px Montserrat,sans-serif'})]
    });
  }
}

/* ============ HELPERS UI ============ */
function kpiCardLight(label, value, delta, deltaCls, extra, pct){
  var bar = '';
  if (pct != null && !isNaN(pct)){
    var cls = pct >= 100 ? 'ok' : pct >= 75 ? 'warn' : 'bad';
    var w = Math.min(Math.max(pct, 0), 120);
    bar = '<div class="np-pbar-wrap"><div class="np-pbar '+cls+'" style="width:'+w+'%"></div></div>';
  }
  return '<div class="kpi-card light">'
    + '<div class="kpi-label">'+label+'</div>'
    + '<div class="kpi-value">'+value+'</div>'
    + (delta ? '<div class="kpi-delta '+deltaCls+'">'+delta+'</div>' : '')
    + bar
    + (extra ? '<div class="kpi-extra">'+extra+'</div>' : '')
    + '</div>';
}
function kpiCardDark(label, value, delta, deltaCls, extra){
  return '<div class="kpi-card"><div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+'</div>'
    + (delta ? '<div class="kpi-delta '+deltaCls+'">'+delta+'</div>' : '')
    + (extra ? '<div class="kpi-extra">'+extra+'</div>' : '')
    + '</div>';
}
function nivelCard(num, titulo, valor, desc, meta, nv){
  return '<div class="nivel-card '+nv+'"><div class="nv-num">'+num+'</div>'
    + '<div class="nv-titulo">'+titulo+'</div>'
    + '<div class="nv-valor">'+valor+'</div>'
    + '<div class="nv-desc">'+desc+'</div>'
    + (meta ? '<div class="nv-meta">'+meta+'</div>' : '')
    + '</div>';
}


/* ============================================================
   ABA 1: RESUMO EXECUTIVO
   ============================================================ */
function renderResumo(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);

  // KPIs financeiros principais (regime caixa)
  const recBruta = sumSerie('receita_bruta', meses);
  const lucroBruto = sumSerie('lucro_bruto', meses);
  const lucroOp = sumSerie('lucro_operacional', meses);
  const excedente = sumSerie('excedente', meses);

  // MC e PE (são percentuais/valores diretos, faz sentido pegar média no período)
  let mcAvg = null, peAvg = null;
  if (meses.length === 1){
    mcAvg = (SERIES.margem_contribuicao[meses[0]] || 0) * 100;
    peAvg = SERIES.ponto_equilibrio[meses[0]] || 0;
  } else {
    let mcSum = 0, peSum = 0, count = 0;
    meses.forEach(m => {
      if (SERIES.margem_contribuicao[m]) { mcSum += SERIES.margem_contribuicao[m]; count++; }
      if (SERIES.ponto_equilibrio[m]) peSum += SERIES.ponto_equilibrio[m];
    });
    mcAvg = count > 0 ? (mcSum/count)*100 : null;
    peAvg = meses.length > 0 ? peSum/meses.length : null;
  }

  // Variações
  const yoyRec = yoyPct('receita_bruta', meses);
  const yoyExc = yoyPct('excedente', meses);
  const ahRec = ahPct('receita_bruta', meses);
  const ahExc = ahPct('excedente', meses);

  // Faturamento (competência) - planilha comercial
  const fatComp = sumSerie('faturamento', meses);

  // Metas - só faz sentido para o primeiro mês selecionado ou somatório
  const cota = sumMetas(meses, 'cota');
  const meta = sumMetas(meses, 'meta');
  const superMeta = sumMetas(meses, 'super');
  const hasMeta = cota > 0;
  const coberturaCota = (hasMeta && cota > 0) ? (fatComp / cota) * 100 : null;
  const coberturaMeta = (hasMeta && meta > 0) ? (fatComp / meta) * 100 : null;
  const coberturaSuper = (hasMeta && superMeta > 0) ? (fatComp / superMeta) * 100 : null;

  // Despesas operacionais
  const despOp = sumSerie('desp_operacionais', meses);

  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';
  html += '<div class="mountain-bg"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><path d="M0,900 L0,500 L200,300 L400,420 L600,200 L800,360 L1000,180 L1200,320 L1400,240 L1600,360 L1600,900 Z" fill="#011E3C" fill-opacity=".55"/><path d="M0,900 L0,650 L150,520 L350,580 L520,420 L720,520 L920,380 L1120,490 L1320,400 L1500,500 L1600,460 L1600,900 Z" fill="#011E3C" fill-opacity=".35"/></svg></div>';

  // Header
  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--teal-deep);"><span class="pill-num">01</span> · Resumo Executivo</div>';
  html += '<h2 class="title-xl">Fechamento<br>de <u>'+periodTxt+'</u></h2>';
  html += '<p class="lead">Visão consolidada do desempenho operacional, comercial e financeiro do período selecionado.</p>';
  html += '</div></div>';

  html += '<hr class="np-divider">';

  // YoY baseline (mesmo período 2025)
  var prevMesesYoY = meses.map(function(m){ var p=m.split('/'); return p[0]+'/'+(parseInt(p[1])-1).toString().padStart(2,'0'); });
  var recBrutaYoY  = prevMesesYoY.every(function(m){ return SERIES.receita_bruta && SERIES.receita_bruta[m]!==undefined; }) ? sumSerie('receita_bruta', prevMesesYoY) : null;
  var lucroOpYoY   = prevMesesYoY.every(function(m){ return SERIES.lucro_operacional && SERIES.lucro_operacional[m]!==undefined; }) ? sumSerie('lucro_operacional', prevMesesYoY) : null;
  var excedenteYoY = prevMesesYoY.every(function(m){ return SERIES.excedente && SERIES.excedente[m]!==undefined; }) ? sumSerie('excedente', prevMesesYoY) : null;
  var mcYoY = prevMesesYoY.every(function(m){ return SERIES.margem_contribuicao && SERIES.margem_contribuicao[m]!==undefined; })
    ? (prevMesesYoY.reduce(function(s,m){ return s+(SERIES.margem_contribuicao[m]||0); },0)/prevMesesYoY.length)*100 : null;
  var peYoY = prevMesesYoY.every(function(m){ return SERIES.ponto_equilibrio && SERIES.ponto_equilibrio[m]!==undefined; })
    ? prevMesesYoY.reduce(function(s,m){ return s+(SERIES.ponto_equilibrio[m]||0); },0)/prevMesesYoY.length : null;

  // Variações YoY adicionais
  var yoyLucroOp = pctChange(lucroOp, lucroOpYoY);
  var yoyMC = pctChange(mcAvg, mcYoY);
  var yoyPE = pctChange(peAvg, peYoY);

  // ===== KPIs principais =====
  html += '<h3 class="section-title">Indicadores do período</h3>';
  html += '<div class="grid-5" style="margin-bottom:36px;">';

  html += kpiCardLight('Receita Bruta (caixa)', fmtBRLshort(recBruta),
    '', '',
    recBrutaYoY !== null ? '<span>2025: '+fmtBRLshort(recBrutaYoY)+'</span>' + deltaInline(yoyRec) : '');

  html += kpiCardLight('Lucro Operacional', fmtBRLshort(lucroOp),
    recBruta ? fmtPct((lucroOp/recBruta)*100)+' margem' : '', 'neu',
    lucroOpYoY !== null ? '<span>2025: '+fmtBRLshort(lucroOpYoY)+'</span>' + deltaInline(yoyLucroOp) : '');

  html += kpiCardLight('Excedente (Caixa Líquido)', fmtBRLshort(excedente),
    '', '',
    excedenteYoY !== null ? '<span>2025: '+fmtBRLshort(excedenteYoY)+'</span>' + deltaInline(yoyExc) : '');

  html += kpiCardLight('Margem de Contribuição', mcAvg !== null ? fmtPct(mcAvg) : '-', '', 'neu',
    mcYoY !== null ? '<span>2025: '+fmtPct(mcYoY)+'</span>' + deltaInline(yoyMC) : '');

  // PE invertido: subir é ruim, descer é bom
  html += kpiCardLight('Ponto de Equilíbrio', peAvg !== null ? fmtBRLshort(peAvg) : '-', '', 'neu',
    peYoY !== null ? '<span>2025: '+fmtBRLshort(peYoY)+'</span>' + deltaInline(yoyPE, true) : '');

  html += '</div>';

  // ===== Cobertura de meta =====
  if (hasMeta){
    html += '<h3 class="section-title">Cobertura de meta comercial</h3>';
    html += '<p class="lead" style="margin-bottom:12px;">Faturamento de '+periodTxt+' (regime competência): <strong>'+fmtBRL(fatComp)+'</strong>. Comparação com Cota, Meta e Super Meta do período.</p>';
    html += '<div class="meta-row">';
    html += metaCard('Cota', cota, coberturaCota);

  const recLiq = sumSerie('receita_liquida', meses);
  const impostos = sumSerie('impostos', meses);
  const cmv = sumSerie('cmv', meses);
  const investProv = sumSerie('invest_provisoes', meses);
  html += '<div class="chart-card light"><div class="chart-card-title">Valores</div><div class="chart-card-sub">Em R$</div>';
  html += '<table class="cascata-table">';
  html += casRow('(+) Receita Bruta', recBruta, 100, true);
  html += casRow('(−) Impostos', -impostos, recBruta ? -(impostos/recBruta*100) : null);
  html += casRow('(=) Receita Líquida', recLiq, recBruta ? (recLiq/recBruta*100) : null, true, true);
  html += casRow('(−) CMV', -cmv, recBruta ? -(cmv/recBruta*100) : null);
  html += casRow('(=) Lucro Bruto', lucroBruto, recBruta ? (lucroBruto/recBruta*100) : null, true, true);
  html += casRow('(−) Despesas Operacionais', -despOp, recBruta ? -(despOp/recBruta*100) : null);
  html += casRow('(=) Lucro Operacional', lucroOp, recBruta ? (lucroOp/recBruta*100) : null, true, true);
  html += casRow('(−) Investimentos e Provisões', -investProv, recBruta ? -(investProv/recBruta*100) : null);
  html += casRow('(=) Excedente', excedente, recBruta ? (excedente/recBruta*100) : null, true, true);
  html += '</table></div>';

  html += '</div>';

  // ===== Variação consolidada do período vs mesmo período do ano anterior =====
  const mesesYoYCasc = meses.filter(m => m.endsWith('/26') && SERIES.receita_bruta[m.replace('/26','/25')] != null)
    .map(m => m.replace('/26','/25'));
  if (mesesYoYCasc.length > 0){
    const recBrutaYoY = sumSerie('receita_bruta', mesesYoYCasc);
    const lucroBrutoYoY = sumSerie('lucro_bruto', mesesYoYCasc);
    const lucroOpYoY = sumSerie('lucro_operacional', mesesYoYCasc);
    const excedenteYoY = sumSerie('excedente', mesesYoYCasc);
    html += '<h3 class="section-title">Variação consolidada do período <span style="font-size:12px;font-weight:400;color:var(--text-on-light-muted);">— total do período vs mesmo período de 2025</span></h3>';
    html += '<p class="lead" style="margin-bottom:20px;">Soma de '+periodTxt+' comparada à soma dos meses equivalentes em 2025 — complementa a visão mês a mês da DRE (Aba 02).</p>';
    html += '<div class="chart-card light" style="margin-bottom:36px;"><div class="chart-card-title">Receita e lucros · consolidado do período</div><div class="chart-card-sub">2025 (cinza) vs 2026 (petróleo) · Em R$</div><div style="position:relative;height:360px;"><canvas id="chCascataYoY"></canvas></div></div>';
    STATE._cascataYoYData = {
      labels:['Receita Bruta','Lucro Bruto','Lucro Operacional','Excedente'],
      v25:[recBrutaYoY, lucroBrutoYoY, lucroOpYoY, excedenteYoY],
      v26:[recBruta, lucroBruto, lucroOp, excedente]
    };
  } else {
    STATE._cascataYoYData = null;
  }

  html += '<hr class="np-divider">';

  // ===== 4 níveis (Receita / Custo / Despesas / Caixa) =====
  html += '<h3 class="section-title">Estrutura do resultado</h3>';
  html += '<div class="grid-4" style="margin-bottom:36px;">';
  html += nivelCard('01', 'Receita Bruta', fmtBRLshort(recBruta),
    'Total recebido no período em regime de caixa.',
    'Faturamento competência: '+fmtBRLshort(fatComp), 'nv1');
  html += nivelCard('02', 'CMV', fmtBRLshort(cmv),
    'Custo das mercadorias vendidas: matérias-primas, embalagens, frete.',
    recBruta ? fmtPct(cmv/recBruta*100)+' da receita' : '', 'nv3');
  html += nivelCard('03', 'Despesas Operacionais', fmtBRLshort(despOp),
    'Administrativas, pessoal, marketing e financeiras.',
    recBruta ? fmtPct(despOp/recBruta*100)+' da receita' : '', 'nv4');
  html += nivelCard('04', 'Excedente', fmtBRLshort(excedente),
    'Geração líquida após investimentos e provisões.',
    recBruta ? fmtPct(excedente/recBruta*100)+' da receita' : '', 'nv2');
  html += '</div>';

  html += '<hr class="np-divider">';

  // ===== Leitura textual =====
  html += '<h3 class="section-title">Leitura do período</h3>';
  html += '<div class="grid-2" style="gap:16px;margin-bottom:36px;">';

  // Receita
  html += '<div class="insight-card light"><div class="insight-label">Receita</div><div class="insight-text">';
  html += 'A receita bruta totalizou <strong>'+fmtBRL(recBruta)+'</strong> em '+periodTxt+'.';
  if (ahRec !== null && isFinite(ahRec)){
    const dir = ahRec >= 0 ? 'crescimento' : 'retração';
    html += ' Frente ao período anterior comparável, <strong>'+dir+' de '+fmtPct(Math.abs(ahRec))+'</strong>.';
  }
  if (yoyRec !== null && isFinite(yoyRec)){
    const dir = yoyRec >= 0 ? 'expansão' : 'retração';
    html += ' Contra o mesmo período de 2025, <strong>'+dir+' de '+fmtPct(Math.abs(yoyRec))+'</strong>.';
  }
  html += '</div></div>';

  // Margem
  html += '<div class="insight-card light"><div class="insight-label">Margem e CMV</div><div class="insight-text">';
  if (mcAvg !== null) html += 'A margem de contribuição '+(meses.length>1?'média do período':'')+ ' foi de <strong>'+fmtPct(mcAvg)+'</strong>. ';
  if (recBruta && cmv) html += 'O CMV representou <strong>'+fmtPct(cmv/recBruta*100)+'</strong> da receita bruta. ';
  if (peAvg !== null) html += 'O ponto de equilíbrio '+(meses.length>1?'médio':'')+' do período foi <strong>'+fmtBRL(peAvg)+'</strong>.';
  html += '</div></div>';

  // Caixa
  html += '<div class="insight-card light"><div class="insight-label">Geração de caixa</div><div class="insight-text">';
  html += 'O excedente de caixa atingiu <strong>'+fmtBRL(excedente)+'</strong>';
  if (recBruta) html += ', equivalente a <strong>'+fmtPct(excedente/recBruta*100)+'</strong> sobre a receita';
  html += '. ';
  if (investProv > 0) html += 'Foram absorvidos <strong>'+fmtBRL(investProv)+'</strong> em investimentos e provisões.';
  html += '</div></div>';

  // Síntese
  html += '<div class="insight-card light" style="border-left-color:var(--warning);"><div class="insight-label" style="color:var(--warning);">Síntese</div><div class="insight-text">';
  if (excedente > 0 && lucroOp > 0 && recBruta && (lucroOp/recBruta) > 0.15){
    html += 'O período fecha com <strong>operação superavitária e margem operacional saudável</strong>. ';
  } else if (excedente > 0){
    html += 'O período fecha com <strong>geração positiva de caixa</strong>. ';
  } else {
    html += 'O período exigiu <strong>consumo de caixa</strong> para sustentar a operação. ';
  }
  if (hasMeta && coberturaMeta !== null){
    if (coberturaMeta >= 100) html += 'A meta comercial foi <strong>atingida ('+fmtPct(coberturaMeta)+')</strong>.';
    else if (coberturaCota >= 100) html += 'A cota foi atingida, mas a meta cheia ficou em <strong>'+fmtPct(coberturaMeta)+'</strong>.';
    else html += 'A cota comercial ficou em <strong>'+fmtPct(coberturaCota)+'</strong> — abaixo do mínimo esperado.';
  }
  html += '</div></div>';

  html += '</div>';

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

function casRow(label, value, pct, major, result){
  const cls = result ? 'result-row' : (major ? 'major-row' : '');
  const valCls = value < 0 ? 'neg' : (value > 0 ? 'pos' : '');
  const pctStr = pct !== null && pct !== undefined ? (pct >= 0 ? '+' : '') + pct.toFixed(1).replace('.',',') + '%' : '';
  return '<tr class="'+cls+'"><td class="label-cell">'+label+'</td><td class="num '+valCls+'">'+fmtBRL(value)+'</td><td class="pct-cell">'+pctStr+'</td></tr>';
}

function metaCard(name, target, cobertura){
  let cls = 'fraco';
  if (cobertura >= 100) cls = 'atingida';
  else if (cobertura >= 80) cls = 'parcial';
  const cardCls = cobertura >= 100 ? 'atingida' : '';
  const fill = Math.min(cobertura || 0, 150);
  return '<div class="meta-pill-card '+cardCls+'">'
    + '<div class="meta-name">'+name+'</div>'
    + '<div class="meta-target">'+fmtBRLshort(target)+'</div>'
    + '<div class="meta-cob '+cls+'">'+fmtPct(cobertura||0)+'</div>'
    + '<div class="meta-progress"><div class="meta-progress-fill '+cls+'" style="width:'+fill+'%;"></div></div>'
    + '</div>';
}

/* ============ FINANCEIRO · SUBABA "INDICADORES" (KPIs + gráficos) ============ */
function renderFinIndicadores(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);

  // KPIs do topo
  const recBruta = sumSerie('receita_bruta', meses);
  const lucroBruto = sumSerie('lucro_bruto', meses);
  const lucroOp = sumSerie('lucro_operacional', meses);
  const excedente = sumSerie('excedente', meses);

  let mcAvg = null, peAvg = null;
  if (meses.length === 1){
    mcAvg = (SERIES.margem_contribuicao[meses[0]] || 0) * 100;
    peAvg = SERIES.ponto_equilibrio[meses[0]] || 0;
  } else {
    let mcSum = 0, peSum = 0, c = 0;
    meses.forEach(m => { if (SERIES.margem_contribuicao[m]) { mcSum += SERIES.margem_contribuicao[m]; c++;} if (SERIES.ponto_equilibrio[m]) peSum += SERIES.ponto_equilibrio[m]; });
    mcAvg = c > 0 ? (mcSum/c)*100 : null;
    peAvg = meses.length > 0 ? peSum/meses.length : null;

  html += kpiCardLight('Lucro Operacional', fmtBRLshort(lucroOp), recBruta ? fmtPct(lucroOp/recBruta*100)+' AV' : '', 'neu');
  html += kpiCardLight('Excedente', fmtBRLshort(excedente), recBruta ? fmtPct(excedente/recBruta*100)+' AV' : '', 'neu');
  html += kpiCardLight('Margem de Contribuição', mcAvg !== null ? fmtPct(mcAvg) : '-', meses.length > 1 ? 'média do período' : 'do mês', 'neu');
  html += kpiCardLight('Ponto de Equilíbrio', peAvg !== null ? fmtBRLshort(peAvg) : '-', meses.length > 1 ? 'média mensal' : 'do mês', 'neu');
  html += '</div>';

  html += '<hr class="np-divider">';

  // ===== Faturamento vs Receita (comp vs caixa) =====

  html += '<p class="lead" style="margin-bottom:20px;">Comparativo entre faturamento (regime competência — venda emitida) e receita (regime caixa — efetivamente recebida).</p>';
  html += '<div class="chart-card light" style="margin-bottom:36px;"><div class="chart-card-title">Competência vs Caixa</div><div class="chart-card-sub">Série mensal completa</div><div style="position:relative;height:350px;"><canvas id="chFatRec"></canvas></div></div>';

  html += '<hr class="np-divider">';

  // ===== Composição (período selecionado) =====

  html += '<div class="chart-card light"><div class="chart-card-title">Composição despesas · '+periodTxt+'</div><div class="chart-card-sub">Peso de cada categoria</div><div style="position:relative;height:310px;"><canvas id="chDespComp"></canvas></div></div>';

  html += '<hr class="np-divider">';

  html += '<p class="lead" style="margin-bottom:20px;">Mesmos meses do ano anterior lado a lado, com o valor de cada ano e a variação ao lado do gráfico — CMV, indicadores de saúde financeira e despesas por categoria. Use o botão "Comparativo 2025" para mostrar só 2026.</p>';

    + '</div>'
    + '<div class="fin-yoy-cards" id="finYoyCards_'+key+'"></div>'
  + '</div>';
}
