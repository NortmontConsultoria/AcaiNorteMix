const Login = {
  init() {
    // Se a sessão anterior ficou pela metade, entrar direto pode travar a tela.
    // Qualquer falha aqui volta pro botão de login em vez de deixar em branco.
    if (sessionStorage.getItem(SESSION_KEY) === 'ok') {
      try { this.entrarNoApp(); return; }
      catch (e) {
        console.warn('Sessão anterior inconsistente, limpando:', e);
        sessionStorage.removeItem(SESSION_KEY);
        sessionStorage.removeItem(EMAIL_LOGADO_KEY);
      }
    }
    this.renderBotaoGoogle();
  },
  _tentativas: 0,
  renderBotaoGoogle() {
    if (!window.google || !google.accounts || !google.accounts.id) {
      this._tentativas++;
      if (this._tentativas > 40) { this._mostrarPlanoB('A biblioteca de login do Google não carregou.'); return; }
      setTimeout(() => this.renderBotaoGoogle(), 300);
      return;
    }
    try {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: (resp) => this.aoLogar(resp),
        auto_select: false,
        itp_support: true,
        use_fedcm_for_prompt: true,
        cancel_on_tap_outside: true
      });
      google.accounts.id.renderButton(
        document.getElementById('google-btn-container'),
        { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', width: 280 }
      );
    } catch (e) {
      this._mostrarPlanoB('Não foi possível montar o botão do Google: ' + e.message);
      return;
    }
    // Se o clique não retornar em 8s, o navegador provavelmente bloqueou o
    // fluxo (FedCM ou cookies de terceiros). Oferece o caminho alternativo.
    const cont = document.getElementById('google-btn-container');
    if (cont && !cont._vigiado) {
      cont._vigiado = true;
      cont.addEventListener('click', () => {
        setTimeout(() => {
          if (sessionStorage.getItem(SESSION_KEY) !== 'ok') {
            this._mostrarPlanoB('O Google não respondeu ao login. Isso costuma ser bloqueio de cookies de terceiros no navegador.');
          }
        }, 8000);
      }, true);
    }
  },

  // Caminho alternativo: popup OAuth. Não depende de FedCM nem de cookie
  // de terceiro, então funciona quando o botão padrão trava.
  _mostrarPlanoB(motivo) {
    const box = document.getElementById('loginError');
    if (!box || box._planoB) return;
    box._planoB = true;
    box.innerHTML = '<div style="margin-bottom:10px;opacity:.85;">' + motivo + '</div>' +
      '<button id="btnPlanoB" style="background:#E0EEE7;color:#011E3C;border:none;' +
      'padding:9px 18px;border-radius:50px;font-family:inherit;font-size:12px;' +
      'font-weight:700;cursor:pointer;letter-spacing:.4px;">Entrar por outro caminho</button>';
    const btn = document.getElementById('btnPlanoB');
    if (btn) btn.addEventListener('click', () => this.entrarViaPopup());
  },

  entrarViaPopup() {
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      document.getElementById('loginError').textContent =
        'A biblioteca do Google não carregou. Recarregue a página com Ctrl+Shift+R.';
      return;
    }
    const cli = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: 'openid email profile',
      callback: (resp) => {
        if (!resp || !resp.access_token) {
          document.getElementById('loginError').textContent = 'Login cancelado ou negado pelo Google.';
          return;
        }
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { Authorization: 'Bearer ' + resp.access_token }
        })
          .then(r => r.json())
          .then(info => this._autorizar((info.email || '').toLowerCase().trim()))
          .catch(err => {
            document.getElementById('loginError').textContent =
              'Não foi possível ler o e-mail da conta: ' + err.message;
          });
      }
    });
    cli.requestAccessToken();
  },

  _autorizar(email) {
    const box = document.getElementById('loginError');
    if (!email) { if (box) box.textContent = 'Não foi possível identificar o e-mail da conta.'; return; }
    const ok = EMAILS_AUTORIZADOS.map(e => e.toLowerCase().trim()).includes(email);
    if (!ok) {
      if (box) box.textContent = 'E-mail (' + email + ') não autorizado. Fale com a equipe Nortmont pra liberar o acesso.';
      return;
    }
    sessionStorage.setItem(SESSION_KEY, 'ok');
    sessionStorage.setItem(EMAIL_LOGADO_KEY, email);
    if (box) { box.innerHTML = ''; box._planoB = false; }
    this.entrarNoApp();
  },
  // Decodifica o JWT do Google no navegador, sem verificar assinatura —
  // suficiente pra ler o e-mail no client-side. A validação de "quem pode
  // entrar" é a lista EMAILS_AUTORIZADOS. Proteção real do dado é a
  // planilha do Google continuar privada.
  _decodificarJWT(token) {
    const payload = token.split('.')[1];
    const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
    ).join(''));
    return JSON.parse(json);
  },
  aoLogar(resp) {
    let dados;
    try { dados = this._decodificarJWT(resp.credential); }
    catch (e) {
      this._mostrarPlanoB('Não foi possível ler os dados de login.');
      return;
    }
    this._autorizar((dados.email || '').toLowerCase().trim());
  },
  entrarNoApp() {
    // showApp() precisa rodar mesmo se o backend falhar ou se carregarDadosAoVivo
    // lançar de forma síncrona. A tela nunca fica presa no login.
    let p;
    try { p = carregarDadosAoVivo(); }
    catch (e) { console.error('carregarDadosAoVivo falhou:', e); showApp(); return; }
    if (!p || typeof p.then !== 'function') { showApp(); return; }
    p.then(() => showApp())
     .catch(err => {
       console.error('Falha ao buscar dados ao vivo, usando JSON estático embutido:', err);
       showApp();
     });
  }
};

function _normNome(nome){ return (nome||'').replace(/\s+/g,' ').trim(); }
// Cliente cadastrado com o número do documento (CPF/CNPJ) na frente do nome
// (ex.: "48.718.011 ALINE VERA VAZ ROCHA") indica pessoa/empresa que se
// formalizou pra comprar — na prática, revenda. Confirmado pelo cliente:
// sempre que o nome tem esse prefixo numérico, é B2B, mesmo que o relatório
// do eGestor (que classifica por CPF x CNPJ) tenha marcado como consumidor
// final. Essa regra tem prioridade sobre a lista de relatórios abaixo.
function _temPrefixoDocumento(nome){
  return /^\d{2}\.\d{3}\.\d{3}\s/.test(_normNome(nome));
}
// A classificação B2B/B2C vem direto dos relatórios (coluna de tipo de cliente:
// consumidor final = B2C, não consumidor final = B2B). Não aplicamos mais nenhuma
// heurística por posição no ranking ou por formato do nome — isso divergia da
// classificação oficial dos relatórios e inflava artificialmente o B2B.
function getTipo(nome, tipoOriginal, pos) {
  if (STATE.overridesTipo[nome]) return STATE.overridesTipo[nome];
  if (_FIXED_TIPO_OVERRIDES[nome]) return _FIXED_TIPO_OVERRIDES[nome];
  if (_temPrefixoDocumento(nome)) return 'B2B';
  if (_RELATORIO_TIPO_CLIENTE[_normNome(nome)]) return _RELATORIO_TIPO_CLIENTE[_normNome(nome)];
  // Sem nenhuma fonte confiável — cai em B2C por padrão só pra não quebrar
  // contas, mas isSemClassificacao() abaixo sinaliza esse caso pra exibir
  // um aviso na tela em vez de esconder o problema.
  return (tipoOriginal === 'B2B') ? 'B2B' : 'B2C';
}
// Verdadeiro quando NENHUMA fonte confiável classificou o cliente (nem
// override manual, nem prefixo de documento, nem a lista dos relatórios, nem
// um "B2B"/"B2C" explícito vindo da planilha — inclui o caso "S/C" que a
// fórmula da aba Top Clientes retorna pra cliente novo ainda não revisado).
function isSemClassificacao(nome, tipoOriginal){
  if (STATE.overridesTipo[nome] || _FIXED_TIPO_OVERRIDES[nome]) return false;
  if (_temPrefixoDocumento(nome)) return false;
  if (_RELATORIO_TIPO_CLIENTE[_normNome(nome)]) return false;
  return tipoOriginal !== 'B2B' && tipoOriginal !== 'B2C';
}

// ── Recalcula b2b_b2c a partir dos clientes_abc com overrides ───────────────
function calcB2BByCli(cliArr) {
  var fat2b = 0, fat2c = 0, v2b = 0, v2c = 0, n2b = 0, n2c = 0;
  cliArr.forEach(function(c, i) {
    // Cliente sem classificação confiável não entra no cálculo de B2B nem
    // de B2C — fica de fora até ser revisado (ver aviso no fim da página).
    var semClass = (c.semClass !== undefined) ? c.semClass : isSemClassificacao(c.nome, c.tipoRaw || c.tipo);
    if (semClass) return;
    var t = c.tipo || getTipo(c.nome, c.tipoRaw || c.tipo, c.pos || (i+1));
    if (t === 'B2B') { fat2b += (c.total||0); v2b += (c.qtd||0); n2b++; }
    else              { fat2c += (c.total||0); v2c += (c.qtd||0); n2c++; }
  });
  return { b2b_fat: fat2b, b2c_fat: fat2c, b2b_vendas: v2b, b2c_vendas: v2c, b2b_clientes: n2b, b2c_clientes: n2c };
}

// ── Modo edição ────────────────────────────────────────────────────────────
function enterEditMode() {
  STATE.editMode = true;
  document.getElementById('btnEditar').style.display = 'none';
  document.getElementById('editBadge').style.display = 'flex';
  document.getElementById('editActions').style.display = 'flex';
  applyEditables();
}

function exitEditMode(save) {
  STATE.editMode = false;
  if (!save) { STATE.savedEdits = {}; }
  document.getElementById('btnEditar').style.display = '';
  document.getElementById('editBadge').style.display = 'none';
  document.getElementById('editActions').style.display = 'none';
  // remove contenteditable
  document.querySelectorAll('[contenteditable]').forEach(function(el) {
    el.removeAttribute('contenteditable');
  });
  if (!save) { render(); }
}

function applyEditables() {
  if (!STATE.editMode) return;
  var SELS = ['.dash-title','.dash-sub','.card-title','.kpi-label','.kpi-title',
              '.section-title','.chart-title','.chart-sub','.tab-label',
              'h1','h2','h3','.top-period'];
  SELS.forEach(function(sel) {
    document.querySelectorAll(sel).forEach(function(el, i) {
      if (el.getAttribute('contenteditable')) return; // already set
      var key = sel + ':' + i;
      el.setAttribute('contenteditable', 'true');
      el.setAttribute('data-ekey', key);
      if (STATE.savedEdits[key] !== undefined) {
        el.textContent = STATE.savedEdits[key];
      }
      el.addEventListener('blur', function() {
        STATE.savedEdits[key] = el.textContent;
      });
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      });
    });
  });
}

function reapplySavedEdits() {
  if (!STATE.editMode) return;
  setTimeout(applyEditables, 80);
}

// ── Modal B2B/B2C ────────────────────────────────────────────────────────
function openB2BModal() {
  document.getElementById('edtOverlay').classList.add('active');
  document.getElementById('edtSearch').value = '';
  renderEdtList('');
}

function closeB2BModal() {
  document.getElementById('edtOverlay').classList.remove('active');
  // re-render to apply any changes
  render();
}

function filterEdtClientes() {
  renderEdtList(document.getElementById('edtSearch').value.toLowerCase());
}

function getEdtClientes() {
  var map = {};
  // Abas por mês
  Object.keys(__ABAS_POR_MES__).forEach(function(mes) {
    var d = __ABAS_POR_MES__[mes];
    if (d && d.clientes_abc) {
      d.clientes_abc.forEach(function(c) {
        if (!map[c.nome]) map[c.nome] = c.tipo || 'B2C';
      });
    }
  });
  return Object.keys(map).sort().map(function(n) { return { nome: n, tipo: map[n] }; });
}

function renderEdtList(filter) {
  var all = getEdtClientes();
  if (filter) all = all.filter(function(c) { return c.nome.toLowerCase().indexOf(filter) >= 0; });
  var ovrCount = Object.keys(STATE.overridesTipo).length;
  document.getElementById('edtInfo').textContent =
    ovrCount > 0 ? ovrCount + ' correção(ões) ativa(s)' : 'Sem correções ativas';
  var html = all.map(function(c) {
    var tipoAtual = STATE.overridesTipo[c.nome] || c.tipo;
    var hasOvr = !!STATE.overridesTipo[c.nome];
    var nomeSafe = c.nome.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    var tipoOrig = c.tipo;
    return '<div class="edt-row">'
      + '<span class="edt-nome">' + c.nome
      + (hasOvr ? '<span class="edt-ovr">✎</span>' : '')
      + '</span>'
      + '<button class="edt-tipo-btn ' + tipoAtual.toLowerCase()
      + '" onclick="toggleCliTipo(\'' + nomeSafe + '\',\'' + tipoOrig + '\')">'
      + tipoAtual + '</button></div>';
  }).join('');
  document.getElementById('edtList').innerHTML = html || '<div style="padding:20px;color:rgba(255,255,255,.3);font-size:12px;">Nenhum cliente encontrado.</div>';
}

function toggleCliTipo(nome, tipoOriginal) {
  var atual = STATE.overridesTipo[nome] || tipoOriginal;
  var novo = atual === 'B2B' ? 'B2C' : 'B2B';
  if (novo === tipoOriginal) {
    delete STATE.overridesTipo[nome];
  } else {
    STATE.overridesTipo[nome] = novo;
  }
  renderEdtList(document.getElementById('edtSearch').value.toLowerCase());
}

function salvarTudo(){
  const btn = document.querySelector('.btn-salvar');
  if (btn) { btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;flex-shrink:0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Salvando…'; btn.disabled = true; }
  try {
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'Fechamento_Açaí_-_Atual.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  } catch(e) {
    console.error('Erro ao salvar:', e);
  } finally {
    if (btn) {
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;flex-shrink:0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Salvar';
      }, 1500);

  }

   Financeiro e Produção ainda têm 1 painel só — subdivisão fica para a
   próxima etapa (evita quebrar gráficos já validados). */
const MAIN_TABS_CFG = {
  resumo: { label:'Resumo', subs:[] },
  fin:    { label:'Financeiro', subs:[
    {id:'dre',         label:'DFC'},
    {id:'indicadores', label:'Indicadores'},

  ]},
  com:    { label:'Comercial', subs:[
    {id:'faturamento',  label:'Faturamento'},

    {id:'padraoSemanal',label:'Padrão Semanal'},
    {id:'produtos',     label:'Produtos'}
  ]},
  prod:   { label:'Produção', subs:[
    {id:'producao',      label:'Visão Geral'},
    {id:'batidas',       label:'Ordens de Produção'},
    {id:'producaoVenda', label:'Produção×Venda'}
  ]}
};
/* painel de conteúdo default de cada aba principal (quando não tem subabas,
   ou subaba ainda não escolhida nesta sessão) */
const MAIN_DEFAULT_PANEL = { resumo:'resumo', fin:'dre', com:'faturamento', prod:'producao' };
let CUR_MAIN = 'resumo';
const CUR_SUB = { fin:'dre', com:'faturamento', prod:'producao' }; // última subaba ativa por aba principal

function bindTabs(){ /* onclick já vem inline nos botões (showMainTab) */ }

/* Mede as alturas reais do header (top-bar + stickyNav) e ajusta os offsets.
   Evita qualquer "costura" entre faixas causada por valores de px chutados —
   #stickyNav e main.padding-top são sempre recalculados a partir do DOM real. */
function adjustHeaderOffsets(){
  const topBar = document.querySelector('.top-bar');
  const stickyNav = document.getElementById('stickyNav');
  const main = document.querySelector('main');
  if (!topBar || !stickyNav || !main) return;
  const topBarH = topBar.offsetHeight;
  stickyNav.style.top = topBarH + 'px';
  const stickyNavH = stickyNav.offsetHeight;
  main.style.paddingTop = (topBarH + stickyNavH) + 'px';
}
window.addEventListener('resize', adjustHeaderOffsets);

function showMainTab(mainId){
  CUR_MAIN = mainId;
  document.querySelectorAll('#tabsList .tab-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('mtab-'+mainId);
  if (btn) btn.classList.add('active');
  buildSubtabNav();
  const panelId = MAIN_TABS_CFG[mainId].subs.length ? (CUR_SUB[mainId] || MAIN_TABS_CFG[mainId].subs[0].id) : MAIN_DEFAULT_PANEL[mainId];
  goTab(panelId);
}

function buildSubtabNav(){
  const nav = document.getElementById('subtabNav');
  const cfg = MAIN_TABS_CFG[CUR_MAIN];
  if (!cfg || !cfg.subs.length){
    nav.classList.remove('visible');
    document.body.classList.remove('has-subtabs');
    nav.innerHTML = '';
    adjustHeaderOffsets();
    return;
  }
  document.body.classList.add('has-subtabs');
  nav.classList.add('visible');
  const activeSub = CUR_SUB[CUR_MAIN] || cfg.subs[0].id;
  nav.innerHTML = cfg.subs.map(s =>
    '<button class="stab'+(s.id===activeSub?' active':'')+'" onclick="showSubTab(\''+s.id+'\')">'+s.label+'</button>'
  ).join('');
  adjustHeaderOffsets();
}

function showSubTab(subId){
  CUR_SUB[CUR_MAIN] = subId;
  document.querySelectorAll('#subtabNav .stab').forEach(b => b.classList.remove('active'));
  buildSubtabNav();
  goTab(subId);
}

function goTab(tabId){
  STATE.currentTab = tabId;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============ PERÍODO ESTILO G5 ============ */

// Gera os botões de mês e de intervalo com base nos meses que realmente têm
// dado comercial vindo da planilha (chaves de __ABAS_POR_MES__), em vez de
// uma lista fixa escrita no HTML. Assim, quando um mês novo (ex.: Jul/26)
// aparecer na planilha, o botão dele passa a existir sozinho, sem precisar
// editar o código a cada fechamento mensal.
function buildPeriodChips(){
  const chipsWrap = document.getElementById('g5Chips');
  const rangesWrap = document.getElementById('g5Ranges');
  if (!chipsWrap || !rangesWrap) return;

  const mesesComDado = MESES.filter(m => __ABAS_POR_MES__[m]);
  if (!mesesComDado.length) return; // sem dado comercial: mantém o que já está no HTML (fallback estático)

  chipsWrap.innerHTML = mesesComDado.map(m =>
    '<button class="g5-chip" data-month="' + m + '">' + m + '</button>'
  ).join('');

  // Ranges dinâmicos: "1º Tri" = 3 primeiros meses com dado; "Todos" = todos
  // os meses com dado comercial disponíveis no momento.
  const ranges = [];
  if (mesesComDado.length >= 3){
    const tri = mesesComDado.slice(0, 3);
    ranges.push({label:'1º Tri', meses:tri});
  }
  if (mesesComDado.length >= 2){
    ranges.push({label: mesesComDado[0] + '–' + mesesComDado[mesesComDado.length-1], meses: mesesComDado});
  }
  rangesWrap.innerHTML = ranges.map(r =>
    '<button class="g5-range" data-months="' + r.meses.join(',') + '">' + r.label + '</button>'
  ).join('');

  // Seleciona o mês mais recente com dado por padrão.
  STATE.selectedMonths = [mesesComDado[mesesComDado.length - 1]];
}

function initPeriodChips(){
  buildPeriodChips();
  const chipsWrap = document.getElementById('g5Chips');
  const rangesWrap = document.getElementById('g5Ranges');

  // Clique normal num mês: sempre isola aquele mês (não fica alternando
  // dentro da seleção atual — era isso que dava sensação de botão travado
  // ao tentar sair de um intervalo como Jan-Jun).
  // Ctrl/Cmd+clique: adiciona ou remove aquele mês da seleção atual, sem
  // mexer nos demais — assim dá pra combinar meses não seguidos, tipo
  // Jan + Mar, pulando Fevereiro.
  chipsWrap.querySelectorAll('.g5-chip').forEach(chip => {
    chip.addEventListener('click', (ev) => {
      const m = chip.dataset.month;
      if (ev.ctrlKey || ev.metaKey){
        const idx = STATE.selectedMonths.indexOf(m);
        if (idx >= 0){
          // não deixa desmarcar o último mês restante
          if (STATE.selectedMonths.length > 1) STATE.selectedMonths.splice(idx, 1);
        } else {
          STATE.selectedMonths.push(m);
        }
        STATE.selectedMonths.sort((a,b)=> MESES.indexOf(a) - MESES.indexOf(b));
      } else {
        STATE.selectedMonths = [m];
      }
      updateChips();
      render();
    });
  });

  // Ranges (1º Tri, Jan-Abr)
  rangesWrap.querySelectorAll('.g5-range').forEach(btn => {
    btn.addEventListener('click', () => {
      const ms = (btn.dataset.months || '').split(',').filter(Boolean);
      if (!ms.length) return;
      STATE.selectedMonths = MESES.filter(m => ms.includes(m));
      updateChips();
      render();
    });
  });

  updateChips();
}

function updateChips(){
  const sel = STATE.selectedMonths;

  // Marca chips de mês
  document.querySelectorAll('.g5-chip').forEach(chip => {
    chip.classList.toggle('active', sel.includes(chip.dataset.month));
  });

  // Marca ranges que batem exatamente com a seleção
  document.querySelectorAll('.g5-range').forEach(btn => {
    const ms = (btn.dataset.months || '').split(',').filter(Boolean);
    const match = ms.length === sel.length && ms.every(m => sel.includes(m));
    btn.classList.toggle('active', match);
  });

  // Label no topo + resumo
  let lbl;
  if (sel.length === 1) lbl = sel[0];
  else {
    const idxs = sel.map(m => MESES.indexOf(m)).sort((a,b)=>a-b);
    const contiguo = idxs.every((v,i)=> i===0 || v===idxs[i-1]+1);
    lbl = contiguo ? sel[0] + ' – ' + sel[sel.length-1] : sel.length + ' meses';
  }
  const topEl = document.getElementById('topPeriodo');
  if (topEl) topEl.textContent = lbl;

  const sumEl = document.getElementById('periodSummary');
  if (sumEl){
    sumEl.innerHTML = sel.length === 1
      ? '<strong>'+sel[0]+'</strong> selecionado'
      : '<strong>'+sel.length+' meses</strong> · '+sel[0]+' → '+sel[sel.length-1];
  }
}

}

/* helpers comuns */
function fmtBRLk(v){
  if (v == null || isNaN(v)) return '-';
  if (Math.abs(v) >= 1e6) return 'R$ ' + (v/1e6).toFixed(2).replace('.',',') + ' mi';
  if (Math.abs(v) >= 1e3) return 'R$ ' + (v/1e3).toFixed(1).replace('.',',') + ' mil';
  return 'R$ ' + v.toFixed(2).replace('.',',');
}
function fmtNum(v, d){
  if (v == null || isNaN(v)) return '-';
  return v.toLocaleString('pt-BR', {minimumFractionDigits: d||0, maximumFractionDigits: d||0});
}
function fmtPctSim(v){
  if (v == null || isNaN(v)) return '-';
  return v.toFixed(1).replace('.',',') + '%';
}

/* Mini-card consolidado YoY, exibido no topo de cada gráfico comparativo.
   modo='soma' → total do período (Faturamento, N° Vendas); modo='media' → média mensal (Ticket, Clientes).
   fmt: função de formatação do valor (fmtBRLk, fmtInt, etc). */
function miniYoYCard(meses, key, modo, fmt){
  var mesesPrev = meses.map(prevYear);
  var v26, v25;
  if (modo === 'soma'){
    v26 = sumSerie(key, meses);
    v25 = sumSerie(key, mesesPrev);
  } else {
    v26 = avgSerie(key, meses);
    v25 = avgSerie(key, mesesPrev);
  }
  var temPar = (v25 != null && v25 > 0);
  var varPct = temPar ? (v26 / v25 - 1) * 100 : null;
  var rotulo = modo === 'soma' ? 'Total do período' : 'Média do período';
  var cls = varPct == null ? 'neu' : (varPct >= 0 ? 'pos' : 'neg');
  var deltaTxt = varPct == null ? '—'
    : (varPct >= 0 ? '▲ ' : '▼ ') + fmtPctSim(Math.abs(varPct)) + ' YoY';
  var h = '<div class="mini-yoy">';
  h +=   '<div class="mini-yoy-col"><span class="mini-yoy-lbl">'+rotulo+' · 2026</span><span class="mini-yoy-val">'+fmt(v26)+'</span></div>';
  h +=   '<div class="mini-yoy-col"><span class="mini-yoy-lbl">2025</span><span class="mini-yoy-val mut">'+(temPar?fmt(v25):'—')+'</span></div>';
  h +=   '<div class="mini-yoy-col mini-yoy-delta '+cls+'"><span class="mini-yoy-lbl">Variação</span><span class="mini-yoy-val">'+deltaTxt+'</span></div>';
  h += '</div>';
  return h;
}

function renderComFaturamento(){
  const meses = STATE.selectedMonths;

  html += '<h2 class="title-xl">Faturamento<br><u>e metas</u></h2>';
  const linhasDesc = meses.map(m => { const d = __ABAS_POR_MES__[m]; return d ? d.meta.qtd_linhas_vendas : 0; }).reduce((a,b)=>a+b,0);
  const vendasDesc = meses.map(m => { const d = __ABAS_POR_MES__[m]; return d ? d.meta.qtd_vendas_unicas : 0; }).reduce((a,b)=>a+b,0);
  html += '<p class="lead" style="color:var(--text-on-light-muted);">Faturamento competência vs caixa, ticket médio, evolução vs metas e comparativo YoY.<br>';
  if (unico) html += 'Detalhamento: '+fmtNum(vendasDesc,0)+' vendas únicas / '+fmtNum(linhasDesc,0)+' linhas em '+mesSingle+'.';
  else html += 'Período: '+periodTxt+' — '+fmtNum(meses.length,0)+' meses selecionados.';
  html += '</p>';
  html += '</div></div>';
  html += '<hr class="np-divider">';

  // === KPIs principais ===
  html += '<h3 class="section-title">Indicadores · '+periodTxt+'</h3>';
  const fat = sumSerieFat(meses);
  const tkt = avgSerie('ticket', meses);
  const cli = avgSerie('clientes_ativos', meses);
  const nVendas = sumSerieVendas(meses);
  const descontos = sumSerieDesc(meses);
  const fatPrev = sumSerieFat(prevMonths(meses));
  const fatYoY = sumSerieFat(meses.map(prevYear));

  var multi = meses.length > 1;
  var nMeses = meses.length;
  html += '<div class="grid-4" style="margin-bottom:24px;">';

  html += kpiCardLight('Faturamento (competência)', fmtBRLk(fat),
    fatPrev ? fmtPctSim((fat/fatPrev-1)*100)+' vs período anterior' : '', deltaClsAbas(fat-fatPrev),
    multi ? 'média/mês: '+fmtBRLk(fat/nMeses) : '');

  html += kpiCardLight('Ticket Médio', fmtBRLk(tkt),
    unico ? 'excl. vendas com R$ 0' : 'média do período', 'neu');

  html += kpiCardLight('Clientes Ativos', fmtNum(cli, 0),
    'média mensal', 'neu');

  html += kpiCardLight('N° de Vendas', fmtNum(nVendas, 0),
    unico ? fmtNum(vendasDesc,0)+' únicas / '+fmtNum(linhasDesc,0)+' linhas' : 'soma do período', 'neu',
    multi ? 'média/mês: '+fmtNum(nVendas/nMeses, 0) : '');

  html += '</div>';

  // === Faturamento competência vs caixa (mês único) ===
  if (unico) {
    const md = __ABAS_POR_MES__[mesSingle];
    if (md) {
      html += '<hr class="np-divider">';
      html += '<h3 class="section-title">Competência vs Caixa · '+mesSingle+'</h3>';
      const compFat = md.meta.fat_competencia;
      const caixaFat = sumSerie('venda', [mesSingle]);
      html += '<div class="grid-3" style="margin-bottom:24px;">';
      html += kpiCardLight('Competência (Comercial)', fmtBRLk(compFat), 'data da venda', 'neu');
      html += kpiCardLight('Caixa (DRE)', fmtBRLk(caixaFat), 'data do recebimento', 'neu');
      html += kpiCardLight('Diferença', fmtBRLk(caixaFat - compFat),
        caixaFat > compFat ? 'caixa maior (recebimentos anteriores)' : 'competência maior (a receber)', 'neu');
      html += '</div>';
    }
  }

  // === Meta vs Realizado (mês único com meta disponível) ===
  if (unico) {
    const meta = METAS[mesSingle] || {};
    const md = __ABAS_POR_MES__[mesSingle];
    if (meta.cota && md) {
      html += '<hr class="np-divider">';
      html += '<h3 class="section-title">Meta vs Realizado · '+mesSingle+'</h3>';
      const fatComp = md.meta.fat_competencia;
      const atingCota = (fatComp / meta.cota) * 100;
      const atingMeta = (fatComp / meta.meta) * 100;
      const atingSuper = (fatComp / meta.super) * 100;
      html += '<div class="grid-3" style="margin-bottom:24px;">';
      html += kpiCardLight('Cota · '+fmtBRLk(meta.cota), fmtPctSim(atingCota),
        atingCota >= 100 ? 'atingida' : 'não atingida', atingCota >= 100 ? 'pos' : 'neg', '', atingCota);
      html += kpiCardLight('Meta · '+fmtBRLk(meta.meta), fmtPctSim(atingMeta),
        atingMeta >= 100 ? 'atingida' : 'não atingida', atingMeta >= 100 ? 'pos' : 'neg', '', atingMeta);
      html += kpiCardLight('Super Meta · '+fmtBRLk(meta.super), fmtPctSim(atingSuper),
        atingSuper >= 100 ? 'atingida' : 'não atingida', atingSuper >= 100 ? 'pos' : 'neg', '', atingSuper);
      html += '</div>';
      html += '<div style="margin-bottom:36px;padding:14px 18px;background:rgba(15,66,69,.06);border-radius:6px;font-size:12px;color:var(--text-on-light-muted);">';
      html += 'Comissão por nível: Cota '+fmtBRLk(meta.com_cota)+' · Meta '+fmtBRLk(meta.com_meta)+' · Super '+fmtBRLk(meta.com_super)+'</div>';
    }
  }

  // === Evolução histórica vs metas ===
  html += '<hr class="np-divider">';
  html += '<h3 class="section-title">Evolução Faturamento × Metas</h3>';
  html += '<div class="grid-2" style="margin-bottom:8px;">';
  html += '<div class="chart-card light" style="display:flex;flex-direction:column;">';
  html += '<div class="chart-card-title">Faturamento mensal vs Metas</div>';
  html += '<div class="chart-card-sub">Cota · Meta · Super Meta (linhas) e Faturamento (barras)</div>';
  html += '<div style="position:relative;height:370px;"><canvas id="chVendaMeta"></canvas></div>';
  html += '</div>';
  html += '<div class="chart-card light"><div class="chart-card-title">Ticket médio · evolução</div><div class="chart-card-sub">2025 e 2026</div><div style="position:relative;height:370px;"><canvas id="chTicket"></canvas></div></div>';
  html += '</div>';
  // Botão + tabela de valores recolhível — só se houver metas disponíveis
  var temMeta = meses.some(function(m){ return !!METAS[m]; });
  var mesesVM = meses.filter(function(m){ return SERIES.faturamento[m] != null; });
  if (mesesVM.length > 0) {
    html += '<div style="margin-bottom:28px;">';
    html += '<button id="vmToggle" onclick="toggleVmTable()" style="font-family:Montserrat,sans-serif;font-size:11px;font-weight:700;background:transparent;border:1.5px solid rgba(1,30,60,.25);color:#011E3C;padding:6px 16px;border-radius:20px;cursor:pointer;letter-spacing:.5px;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;transition:all .15s;">&#9654; Valores</button>';
    html += '<div id="vmTable" style="display:none;">';
    html += '<div class="chart-card light" style="padding:0;overflow:hidden;">';
    html += '<table style="width:100%;border-collapse:collapse;font-family:Montserrat,sans-serif;font-size:12px;font-variant-numeric:tabular-nums;">';
    html += '<thead><tr style="background:linear-gradient(135deg,#011E3C 0%,#0F4245 100%);">';
    html += '<th style="padding:11px 16px;text-align:left;font-size:10px;font-weight:700;color:#E0EEE7;letter-spacing:1.3px;text-transform:uppercase;">M&#234;s</th>';
    html += '<th style="padding:11px 14px;text-align:right;font-size:10px;font-weight:700;color:#E0EEE7;letter-spacing:1.3px;text-transform:uppercase;">Faturamento</th>';
    html += '<th style="padding:11px 14px;text-align:right;font-size:10px;font-weight:700;color:#E0EEE7;letter-spacing:1.3px;text-transform:uppercase;">Cota</th>';
    html += '<th style="padding:11px 14px;text-align:right;font-size:10px;font-weight:700;color:#E0EEE7;letter-spacing:1.3px;text-transform:uppercase;">Meta</th>';
    html += '<th style="padding:11px 14px;text-align:right;font-size:10px;font-weight:700;color:#E0EEE7;letter-spacing:1.3px;text-transform:uppercase;">Super Meta</th>';
    html += '</tr></thead><tbody>';
    mesesVM.forEach(function(m, idx){
      var fatV = SERIES.faturamento[m] || 0;
      var mt = METAS[m] || {};
      var cota = mt.cota || null;
      var meta = mt.meta || null;
      var sup  = mt.super || null;
      var zebra = idx % 2 === 1 ? 'background:#F4FBF6;' : '';
      var fatStyle = 'color:#011E3C;font-weight:800;font-size:13px;';
      function metaCell(val){
        if (!val) return '<td style="padding:10px 14px;text-align:right;color:#bbb;' + zebra + '">&#8212;</td>';
        var ok = fatV >= val;
        var bg = ok ? 'rgba(30,106,79,.09)' : 'rgba(143,42,42,.08)';
        var col = ok ? '#1e6a4f' : '#8f2a2a';
        var icon = ok ? '&#10003; ' : '&#10007; ';
        return '<td style="padding:10px 14px;text-align:right;' + zebra + 'background:' + bg + ';color:' + col + ';font-weight:700;">' + icon + fmtBRLk(val) + '</td>';
      }
      html += '<tr style="border-bottom:1px solid rgba(1,30,60,.07);">';
      html += '<td style="padding:10px 16px;font-weight:600;color:#011E3C;' + zebra + '">' + m + '</td>';
      html += '<td style="padding:10px 14px;text-align:right;' + zebra + fatStyle + '">' + fmtBRLk(fatV) + '</td>';
      html += metaCell(cota);
      html += metaCell(meta);
      html += metaCell(sup);
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';
    html += '</div>';
  }

  // === Comparativo YoY ===
  var temYoY26 = meses.some(function(m){ return m.endsWith('/26') && SERIES.faturamento[m.replace('/26','/25')] != null; });
  if (temYoY26){

    html += '</div>';
    html += '<div class="chart-card light" style="margin-bottom:36px;"><div class="chart-card-title">Variação YoY · resumo</div><div class="chart-card-sub">% de crescimento por mês — Faturamento, Ticket, Clientes, Vendas</div><div style="position:relative;height:350px;"><canvas id="chYoYResumo"></canvas></div></div>';
  }

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

function renderComClientes(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);
  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';

  // Header
  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--navy);"><span class="pill-num">03</span> · Comercial · Clientes</div>';
  html += '<h2 class="title-xl">Clientes<br><u>e segmentação</u></h2>';
  html += '<p class="lead" style="color:var(--text-on-light-muted);">Evolução da base ativa, mix B2B vs B2C e curva ABC de clientes.<br>Período: '+periodTxt+'.</p>';
  html += '</div></div>';
  html += '<hr class="np-divider">';

  // === ABC CLIENTES — merge de todos os meses (feito aqui para alimentar tanto o Mix B2B/B2C quanto a Curva ABC) ===
  const cliMap = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.clientes_abc) return;
    d.clientes_abc.forEach(function(c){
      if (!c.nome) return;
      if (!cliMap[c.nome]) cliMap[c.nome] = {nome:c.nome, qtd:0, total:0, tipoRaw: c.tipo};
      // qtd=0 em Jan/Fev/Mar indica falha na extração do ERP; recalcula via round(total/tkt)
      const qtdReal = (c.qtd > 0) ? c.qtd : (c.tkt > 0 ? Math.round(c.total / c.tkt) : 0);
      cliMap[c.nome].qtd += qtdReal;
      cliMap[c.nome].total += c.total||0;
    });
  });
  const cliArr = Object.values(cliMap).filter(c=>c.total>0).sort((a,b)=>b.total-a.total);
  // Resolve posição (curva ABC) e tipo B2B/B2C direto do relatório, já com o ranking do período selecionado
  cliArr.forEach(function(c, i){ c.pos = i+1; c.tipo = getTipo(c.nome, c.tipoRaw, c.pos); c.semClass = isSemClassificacao(c.nome, c.tipoRaw); });

  // === Mix B2B vs B2C (calculado a partir da classificação corrigida por cliente) ===
  const b2bAgg = calcB2BByCli(cliArr);
  if (b2bAgg.b2b_fat > 0 || b2bAgg.b2c_fat > 0) {
    const totB2 = b2bAgg.b2b_fat + b2bAgg.b2c_fat;
    html += '<hr class="np-divider">';
    html += '<h3 class="section-title">Mix B2B vs B2C · '+periodTxt+'</h3>';
    html += '<div class="grid-4" style="margin-bottom:24px;">';
    html += kpiCardLight('B2B', fmtBRLk(b2bAgg.b2b_fat), totB2 ? fmtPctSim(b2bAgg.b2b_fat/totB2*100)+' da receita' : '', 'neu');
    html += kpiCardLight('B2C', fmtBRLk(b2bAgg.b2c_fat), totB2 ? fmtPctSim(b2bAgg.b2c_fat/totB2*100)+' da receita' : '', 'neu');
    html += kpiCardLight('Clientes B2B / B2C', fmtNum(b2bAgg.b2b_clientes,0)+' / '+fmtNum(b2bAgg.b2c_clientes,0), 'clientes distintos no período', 'neu');
    html += kpiCardLight('Vendas B2B / B2C', fmtNum(b2bAgg.b2b_vendas,0)+' / '+fmtNum(b2bAgg.b2c_vendas,0), 'no período', 'neu');
    html += '</div>';
    html += '<div class="grid-2" style="margin-bottom:36px;">';
    html += '<div class="chart-card light"><div class="chart-card-title">Faturamento · B2B vs B2C</div><div class="chart-card-sub">Participação na receita</div><div style="position:relative;height:310px;"><canvas id="chB2BFat"></canvas></div></div>';
    html += '<div class="chart-card light"><div class="chart-card-title">Ticket médio · B2B vs B2C</div><div class="chart-card-sub">Valor médio por venda</div><div style="position:relative;height:310px;"><canvas id="chB2BTkt"></canvas></div></div>';
    html += '</div>';
  }

  // === Curva ABC de clientes (usa o cliArr já calculado acima) ===
  const totFatCli = cliArr.reduce((s,c)=>s+c.total,0);
  let runShare = 0;
  cliArr.forEach(function(c, i){
    c.mix = totFatCli ? (c.total/totFatCli*100) : 0;
    runShare += c.mix;
    c.share_ac = runShare;
    c.pos = i+1;
    c.tkt = c.qtd ? c.total/c.qtd : 0;
  });

  if (cliArr.length > 0) {
    const top5_share  = cliArr.slice(0,  5).reduce((s,c)=>s+(c.mix||0), 0);
    const top10_share = cliArr.slice(0, 10).reduce((s,c)=>s+(c.mix||0), 0);
    const top20_share = cliArr.slice(0, 20).reduce((s,c)=>s+(c.mix||0), 0);

    // Grupos ABC (por share acumulado)
    const grpA = cliArr.filter(c=>c.share_ac <= 25);
    const grpB = cliArr.filter(c=>c.share_ac > 25 && c.share_ac <= 50);
    const grpC = cliArr.filter(c=>c.share_ac > 50 && c.share_ac <= 75);
    const grpD = cliArr.filter(c=>c.share_ac > 75);

    html += '<hr class="np-divider">';
    html += '<h3 class="section-title">Curva ABC de Clientes · '+periodTxt+'</h3>';

    // KPIs
    html += '<div class="grid-4" style="margin-bottom:24px;">';
    html += kpiCardLight('Top 5 clientes', fmtPctSim(top5_share), 'da receita no período', 'neu');
    html += kpiCardLight('Top 10 clientes', fmtPctSim(top10_share), 'da receita no período', 'neu');
    html += kpiCardLight('Top 20 clientes', fmtPctSim(top20_share), 'da receita no período', 'neu');
    html += kpiCardLight('Clientes ativos', fmtNum(cliArr.length, 0), 'no período selecionado', 'neu');
    html += '</div>';

    // === Tabela Segmentação por grupo — 1º bloco (destaque visual) ===
    const grpsDef = [
      {id:'A', label:'Altíssimo', arr:grpA, faixa:'0% a 25%',
        bg:'#0F4245', color:'#fff', badgeBg:'#0F4245', badgeColor:'#fff', rowBg:'rgba(15,66,69,.07)'},
      {id:'B', label:'Alto',      arr:grpB, faixa:'25% a 50%',
        bg:'#3F598C', color:'#fff', badgeBg:'#3F598C', badgeColor:'#fff', rowBg:'rgba(63,89,140,.07)'},
      {id:'C', label:'Médio',     arr:grpC, faixa:'50% a 75%',
        bg:'#5c8a5c', color:'#fff', badgeBg:'#5c8a5c', badgeColor:'#fff', rowBg:'rgba(92,138,92,.07)'},
      {id:'D', label:'Baixo',     arr:grpD, faixa:'75% a 100%',
        bg:'#546e8a', color:'#fff', badgeBg:'#546e8a', badgeColor:'#fff', rowBg:'rgba(84,110,138,.07)'},
    ];
    html += '<div class="chart-card light" style="margin-bottom:28px;padding:0;overflow:hidden;border:1.5px solid rgba(1,30,60,.13);box-shadow:0 3px 14px rgba(1,30,60,.09);">';
    html += '<div style="padding:18px 20px 10px;background:linear-gradient(135deg,#011E3C 0%,#0F4245 100%);">';
    html += '<div style="font-size:13px;font-weight:700;color:#E0EEE7;letter-spacing:.04em;text-transform:uppercase;">Segmentação de Clientes por Grupo</div>';
    html += '<div style="font-size:11px;color:rgba(224,238,231,.7);margin-top:3px;">Concentração por faixa de share acumulado · '+periodTxt+'</div>';
    html += '</div>';
    html += '<div style="overflow-x:auto;"><table style="width:100%;border-collapse:collapse;font-family:Montserrat,sans-serif;">';
    html += '<thead><tr style="background:rgba(1,30,60,.06);border-bottom:2px solid rgba(1,30,60,.12);">';
    html += '<th style="padding:11px 18px;text-align:left;font-size:11px;font-weight:700;color:#011E3C;letter-spacing:.06em;text-transform:uppercase;width:80px;">Grupo</th>';
    html += '<th style="padding:11px 14px;text-align:left;font-size:11px;font-weight:700;color:#011E3C;letter-spacing:.06em;text-transform:uppercase;">Volume</th>';
    html += '<th style="padding:11px 14px;text-align:center;font-size:11px;font-weight:700;color:#011E3C;letter-spacing:.06em;text-transform:uppercase;background:rgba(1,30,60,.04);">N° de Clientes</th>';
    html += '<th style="padding:11px 14px;text-align:center;font-size:11px;font-weight:700;color:#011E3C;letter-spacing:.06em;text-transform:uppercase;background:rgba(15,66,69,.07);">Faixa Share Acumulado</th>';
    html += '</tr></thead><tbody>';
    grpsDef.forEach(function(g){
      const pct = cliArr.length ? fmtPctSim(g.arr.length/cliArr.length*100) : '—';
      const fatGrp = g.arr.reduce(function(s,c){ return s + (c.total||0); }, 0);
      const fatPct = totFatCli > 0 ? fmtPctSim(fatGrp/totFatCli*100) : '—';
      html += '<tr style="border-bottom:1px solid rgba(1,30,60,.07);background:'+g.rowBg+';transition:background .15s;">';
      html += '<td style="padding:13px 18px;">';
      html += '<span style="display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:'+g.badgeBg+';color:'+g.badgeColor+';font-size:15px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.18);">'+g.id+'</span>';
      html += '</td>';
      html += '<td style="padding:13px 14px;font-size:13px;font-weight:600;color:#011E3C;">'+g.label+'</td>';
      html += '<td style="padding:13px 14px;text-align:center;background:rgba(1,30,60,.04);">';
      html += '<span style="font-size:18px;font-weight:800;color:'+g.badgeBg+';">'+fmtNum(g.arr.length,0)+'</span>';
      html += '<span style="font-size:11px;color:#546e8a;margin-left:5px;">('+pct+')</span>';
      html += '</td>';
      html += '<td style="padding:13px 14px;text-align:center;background:rgba(15,66,69,.05);">';
      html += '<span style="display:inline-block;padding:4px 12px;border-radius:20px;background:'+g.badgeBg+';color:'+g.badgeColor+';font-size:11px;font-weight:700;letter-spacing:.03em;">'+g.faixa+'</span>';
      html += '<span style="display:block;font-size:11px;color:#546e8a;margin-top:3px;">'+fatPct+' do faturamento</span>';
      html += '</td>';
      html += '</tr>';
    });
    html += '</tbody></table></div></div>';

    // Tabela ranking com toggle Top 5 / Top 10 / Top 20 / Total (logo após segmentação)
    html += '<div class="chart-card light" style="margin-bottom:28px;padding:0;overflow:hidden;">';
    html += '<div style="padding:16px 18px 4px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">';
    html += '<div class="chart-card-title" style="margin:0;">Ranking de clientes por faturamento</div>';
    html += '<div id="topnBtns" style="display:flex;gap:6px;">';
    [5,10,20].forEach(function(n, i){
      const isActive = (n === 5);
      html += '<button onclick="setCliTopN('+JSON.stringify(n)+')" id="topnBtn'+n+'" style="'
        +'font-family:Montserrat,sans-serif;font-size:11px;font-weight:600;border:1.5px solid #011E3C;'
        +'border-radius:6px;padding:5px 13px;cursor:pointer;transition:all .15s;'
        +(isActive ? 'background:#011E3C;color:#fff;' : 'background:transparent;color:#011E3C;')
        +'" onmouseover="this.style.opacity=.8" onmouseout="this.style.opacity=1">'
        +'Top '+n+'</button>';
    });
    html += '</div></div>';
    html += '<div style="overflow-x:auto;"><table class="abc-table">';
    html += '<thead><tr><th>#</th><th class="abc-name">Cliente</th><th>Tipo</th><th>Qtd Itens</th><th>Faturamento</th><th>Ticket Médio</th><th>Mix %</th><th>Share Ac.</th></tr></thead>';
    html += '<tbody id="cliTableBody">';
    cliArr.slice(0,5).forEach(function(c){
      const tipo = c.tipo || 'B2C';
      html += '<tr><td>'+c.pos+'</td>';
      html += '<td class="abc-name">'+(c.nome||'').toString().slice(0,42)+'</td>';
      html += '<td><span class="tipo-badge tipo-'+tipo.toLowerCase()+'">'+tipo+'</span></td>';
      html += '<td>'+fmtNum(c.qtd,0)+'</td>';
      html += '<td>'+fmtBRLk(c.total)+'</td>';
      html += '<td>'+fmtBRLk(c.tkt)+'</td>';
      html += '<td>'+fmtPctSim(c.mix)+'</td>';
      html += '<td>'+fmtPctSim(c.share_ac)+'</td></tr>';
    });
    html += '</tbody></table></div></div>';

    // Gráficos ABC: Concentração (barras) + Donut ABC grupos — após o ranking
    html += '<div class="grid-2" style="margin-bottom:28px;">';
    html += '<div class="chart-card light"><div class="chart-card-title">Top 10 — Concentração de faturamento</div><div class="chart-card-sub">Participação individual na receita</div><div style="position:relative;height:330px;"><canvas id="chAbcConcentracao"></canvas></div></div>';
    html += '<div class="chart-card light"><div class="chart-card-title">Número de clientes por grupo</div><div class="chart-card-sub">Grupo A · Altíssimo | B · Alto | C · Médio | D · Baixo</div><div style="position:relative;height:330px;"><canvas id="chAbcGrupos"></canvas></div></div>';
    html += '</div>';

    // Armazenar cliArr em STATE para uso em buildComClientesCharts e setCliTopN
    STATE.cliArr = cliArr.map(function(c){ return {pos:c.pos,nome:c.nome,tipo:c.tipo,semClass:c.semClass,qtd:c.qtd,total:c.total,tkt:c.tkt,mix:c.mix,share_ac:c.share_ac}; });

    // Aviso de clientes sem classificação B2B/B2C — no final da página, depois
    // de tudo. Esses clientes ficam de FORA do cálculo de Mix B2B vs B2C acima
    // (não contam nem como B2B nem como B2C) até serem revisados na aba
    // "Classificacao_Clientes" da planilha.
    var semClass = cliArr.filter(function(c){ return c.semClass; });
    if (semClass.length){
      var fatSemClass = semClass.reduce(function(s,c){ return s+(c.total||0); }, 0);
      html += '<div style="background:#FFF6E5;border:1px solid #F0D28A;border-radius:10px;padding:14px 18px;margin:0 0 24px;font-size:13px;color:#7A5A10;">'
        + '⚠ <strong>' + semClass.length + ' cliente(s) sem classificação B2B/B2C</strong> neste período — ' + fmtBRLk(fatSemClass) + ' em faturamento não entram no Mix B2B vs B2C acima até serem revisados. '
        + 'Provavelmente são clientes novos que ainda não entraram nos relatórios do eGestor enviados; assim que forem classificados na aba "Classificacao_Clientes" da planilha, eles passam a contar automaticamente.'
        + '</div>';
    }
  }

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

/* ============ ABA 03 — COMERCIAL · PADRÃO SEMANAL ============ */
function renderComPadraoSemanal(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);
  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';

  // Header
  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--navy);"><span class="pill-num">03</span> · Comercial · Padrão Semanal</div>';
  html += '<h2 class="title-xl">Padrão<br><u>semanal</u></h2>';
  html += '<p class="lead" style="color:var(--text-on-light-muted);">Concentração de faturamento e de vendas por dia da semana.<br>Período: '+periodTxt+'.</p>';
  html += '</div></div>';
  html += '<hr class="np-divider">';

  // === Concentração por dia da semana ===
  const diasOrd = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  const sdAgg = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.share_dia) return;
    Object.entries(d.share_dia).forEach(function([dia, v]){
      if (!sdAgg[dia]) sdAgg[dia] = {qtd:0, fat:0};
      sdAgg[dia].qtd += v.qtd||0;
      sdAgg[dia].fat += v.fat||0;
    });
  });
  const diasComDado = diasOrd.filter(function(d){ return !!sdAgg[d]; });

  if (diasComDado.length > 0) {
    const totFatDia = diasComDado.reduce(function(s,d){ return s+sdAgg[d].fat; }, 0);
    const totQtdDia = diasComDado.reduce(function(s,d){ return s+sdAgg[d].qtd; }, 0);
    const melhorDia = diasComDado.reduce(function(a,b){ return sdAgg[a].fat >= sdAgg[b].fat ? a : b; });
    const piorDia = diasComDado.reduce(function(a,b){ return sdAgg[a].fat <= sdAgg[b].fat ? a : b; });

    html += '<h3 class="section-title">Indicadores · '+periodTxt+'</h3>';
    html += '<div class="grid-3" style="margin-bottom:24px;">';
    html += kpiCardLight('Melhor dia', melhorDia, fmtBRLk(sdAgg[melhorDia].fat)+' no período', 'pos');
    html += kpiCardLight('Dia mais fraco', piorDia, fmtBRLk(sdAgg[piorDia].fat)+' no período', 'neg');
    html += kpiCardLight('Dias com venda', fmtNum(diasComDado.length,0), 'de 7 dias da semana', 'neu');
    html += '</div>';

    html += '<hr class="np-divider">';
    html += '<h3 class="section-title">Concentração por dia da semana · '+periodTxt+'</h3>';
    html += '<div class="grid-2" style="margin-bottom:28px;">';
    html += '<div class="chart-card light"><div class="chart-card-title">Faturamento por dia da semana</div><div class="chart-card-sub">Distribuição da receita</div><div style="position:relative;height:350px;"><canvas id="chDiaFat"></canvas></div></div>';
    html += '<div class="chart-card light"><div class="chart-card-title">Vendas por dia da semana</div><div class="chart-card-sub">Quantidade de vendas únicas</div><div style="position:relative;height:350px;"><canvas id="chDiaQtd"></canvas></div></div>';
    html += '</div>';

    // Tabela detalhada por dia — ordenável por clique no cabeçalho
    STATE.padraoSemanalRows = diasComDado.map(function(d){
      return {
        dia: d,
        diaIdx: diasOrd.indexOf(d),
        fat: sdAgg[d].fat,
        pctFat: totFatDia ? (sdAgg[d].fat/totFatDia*100) : null,
        qtd: sdAgg[d].qtd
      };
    });
    if (!STATE.padraoSemanalSort) STATE.padraoSemanalSort = {col:'diaIdx', dir:1};

    html += '<div class="chart-card light" style="padding:0;overflow:hidden;margin-bottom:28px;">';
    html += '<div style="overflow-x:auto;"><table class="abc-table" id="padraoSemanalTable">';
    html += '<thead><tr>';
    html += '<th class="abc-name" style="cursor:pointer;user-select:none;" onclick="sortPadraoSemanal(\'diaIdx\')">Dia<span id="ps-arrow-diaIdx"></span></th>';
    html += '<th style="cursor:pointer;user-select:none;" onclick="sortPadraoSemanal(\'fat\')">Faturamento<span id="ps-arrow-fat"></span></th>';
    html += '<th style="cursor:pointer;user-select:none;" onclick="sortPadraoSemanal(\'pctFat\')">% do Total<span id="ps-arrow-pctFat"></span></th>';
    html += '<th style="cursor:pointer;user-select:none;" onclick="sortPadraoSemanal(\'qtd\')">N° de vendas<span id="ps-arrow-qtd"></span></th>';
    html += '</tr></thead><tbody id="padraoSemanalTbody"></tbody></table></div></div>';
  } else {
    html += '<div class="placeholder-card"><div class="ph-icon">📅</div><div class="ph-title">Sem dados de padrão semanal</div><div class="ph-sub">O período selecionado não tem detalhamento por dia da semana disponível.</div></div>';
  }

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}


/* ============ ABA 04 — PRODUTOS ============ */
function renderProdutos(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);
  const unico = meses.length === 1;
  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';

  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--navy);"><span class="pill-num">03</span> · Comercial · Produtos</div>';
  html += '<h2 class="title-xl">Mix<br>e <u>Produtos</u></h2>';
  html += '<p class="lead" style="color:var(--text-on-light-muted);">ABC de Produtos, agrupamento Linha × Tamanho, margens e comparativo vendido vs produzido.<br>Custos unitários extraídos do ERP (aba ABC Produtos).</p>';
  html += '</div></div>';
  html += '<hr class="np-divider">';

  // === Agregar produtos de todos os meses selecionados ===
  // Fev/26 usa proxy de Mar/26 nos custos — marcar com ⚠ quando incluso
  const temFev = meses.includes('Fev/26');
  const prodMap = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.produtos_abc) return;
    d.produtos_abc.forEach(function(p){
      if (!p.produto || p.produto === 'TOTAL') return;
      const k = canonProduto(p.produto);
      if (!prodMap[k]) prodMap[k] = {
        produto: p.produto, linha: p.linha, tamanho: p.tamanho,
        qtd: 0, venda_total: 0, custo_total: 0, lucro: 0, _nomeQtd: -1
      };
      if ((p.qtd||0) > prodMap[k]._nomeQtd) { prodMap[k].produto = p.produto; prodMap[k].linha = p.linha; prodMap[k].tamanho = p.tamanho; prodMap[k]._nomeQtd = (p.qtd||0); }
      prodMap[k].qtd += p.qtd||0;
      prodMap[k].venda_total += p.venda_total||0;
      prodMap[k].custo_total += p.custo_total||0;
      prodMap[k].lucro += p.lucro||0;
    });
  });
  const skus = Object.values(prodMap)
    .sort((a,b) => b.venda_total - a.venda_total)
    .map(function(p, i){
      p.pos = i+1;
      p.markup = p.custo_total > 0 ? (p.lucro/p.custo_total*100) : 0;
      return p;
    });
  const totVenda = skus.reduce((s,p)=>s+(p.venda_total||0),0);
  let runMix = 0;
  skus.forEach(p => {
    p.mix = totVenda ? (p.venda_total/totVenda*100) : 0;
    runMix += p.mix;
    p.share_ac = runMix;
  });
  const totLucro = skus.reduce((s,p)=>s+(p.lucro||0),0);
  const totCusto = skus.reduce((s,p)=>s+(p.custo_total||0),0);
  const margemMedia = totVenda ? (totLucro/totVenda*100) : 0;
  const markupMedio = totCusto ? (totLucro/totCusto*100) : 0;

  // === Indicadores (cards) — primeiro bloco da aba ===
  html += '<h3 class="section-title">Indicadores · '+periodTxt+'</h3>';
  // Aviso Fev/26 movido para aba 6 (Qualidade dos Dados)
  html += '<div class="grid-4" style="margin-bottom:24px;">';

  html += kpiCardLight('Faturamento', fmtBRLk(totVenda), '100%', 'neu');
  html += kpiCardLight('Lucro Bruto (s/ rateio)', fmtBRLk(totLucro), 'margem '+fmtPctSim(margemMedia), 'neu');
  html += kpiCardLight('Markup médio', fmtPctSim(markupMedio), 'sobre custo', 'neu');
  html += '</div>';

  // === ABC Produtos completa ===

  html += '<div class="chart-card light" style="margin-bottom:24px;padding:0;overflow:hidden;">';
  html += '<div style="padding:16px 18px 4px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;">';
  html += '<div class="chart-card-title" style="margin:0;">ABC completa · '+skus.length+' produtos</div>';
  html += '<div id="prodTopnBtns" style="display:flex;gap:6px;">';
  [5,10,20].forEach(function(n){
    const isActive = (n === 5);
    html += '<button onclick="setProdTopN('+JSON.stringify(n)+')" id="prodTopnBtn'+n+'" style="'
      +'font-family:Montserrat,sans-serif;font-size:11px;font-weight:600;border:1.5px solid #011E3C;'
      +'border-radius:6px;padding:5px 13px;cursor:pointer;transition:all .15s;'
      +(isActive ? 'background:#011E3C;color:#fff;' : 'background:transparent;color:#011E3C;')
      +'" onmouseover="this.style.opacity=.8" onmouseout="this.style.opacity=1">'
      +'Top '+n+'</button>';
  });
  html += '</div></div>';
  html += '<div style="overflow-x:auto;max-height:520px;overflow-y:auto;"><table class="abc-table">';
  html += '<thead><tr><th>#</th><th class="abc-name">Produto</th><th>Qtd</th><th>Faturamento</th><th>Custo Unit.</th><th>Lucro</th><th>Mix %</th></tr></thead>';
  html += '<tbody id="prodTableBody">';
  skus.slice(0,5).forEach(p => {
    const cu = p.qtd ? (p.custo_total/p.qtd) : 0;
    html += '<tr><td>'+p.pos+'</td><td class="abc-name">'+(p.produto||'').trim()+'</td>';
    html += '<td>'+fmtNum(p.qtd,0)+'</td><td>'+fmtBRLk(p.venda_total)+'</td>';
    html += '<td>'+fmtBRLk(cu)+'</td><td>'+fmtBRLk(p.lucro)+'</td>';
    html += '<td>'+fmtPctSim(p.mix)+'</td></tr>';
  });
  html += '</tbody></table></div></div>';

  // === Agrupamento por linha ===
  html += '<hr class="np-divider">';
  html += '<h3 class="section-title">Composição por Linha de produto</h3>';
  const porLinha = {};
  skus.forEach(p => {
    const L = p.linha || 'Tradicional';
    if (!porLinha[L]) porLinha[L] = {qtd:0, venda:0, custo:0, lucro:0};
    porLinha[L].qtd += p.qtd||0;
    porLinha[L].venda += p.venda_total||0;
    porLinha[L].custo += p.custo_total||0;
    porLinha[L].lucro += p.lucro||0;
  });
  html += '<div class="grid-2" style="margin-bottom:24px;">';
  html += '<div class="chart-card light"><div class="chart-card-title">Faturamento por linha</div><div class="chart-card-sub">Composição da receita</div><div style="position:relative;height:330px;"><canvas id="chLinhaFat"></canvas></div></div>';
  html += '<div class="chart-card light"><div class="chart-card-title">Margem % por linha</div><div class="chart-card-sub">Lucro / Venda · Calda excluída (markup distorcido no ERP)</div><div style="position:relative;height:330px;"><canvas id="chLinhaMargem"></canvas></div></div>';
  html += '</div>';

  html += '<div class="chart-card light" style="margin-bottom:36px;padding:0;overflow:hidden;">';
  html += '<div class="chart-card-title" style="padding:16px 18px 4px;">Detalhamento por linha</div>';
  html += '<div style="overflow-x:auto;"><table class="abc-table">';
  html += '<thead><tr><th>#</th><th class="abc-name">Linha</th><th>Qtd Vendida</th><th>Faturamento</th><th>Custo Total</th><th>Lucro</th><th>Margem %</th><th>Mix %</th></tr></thead><tbody>';
  const linhasArr = Object.entries(porLinha).filter(([L])=>(L||'').trim().toLowerCase()!=='calda').sort((a,b)=>b[1].venda - a[1].venda);
  linhasArr.forEach(([L, d], i) => {
    const margem = d.venda ? (d.lucro/d.venda*100) : 0;
    const mix = totVenda ? (d.venda/totVenda*100) : 0;
    html += '<tr><td>'+(i+1)+'</td><td class="abc-name"><strong>'+L+'</strong></td>';
    html += '<td>'+fmtNum(d.qtd,0)+'</td><td>'+fmtBRLk(d.venda)+'</td>';
    html += '<td>'+fmtBRLk(d.custo)+'</td><td>'+fmtBRLk(d.lucro)+'</td>';
    html += '<td>'+fmtPctSim(margem)+'</td><td>'+fmtPctSim(mix)+'</td></tr>';
  });
  html += '</tbody></table></div></div>';

  // === Cruzamento Linha × Tamanho ===
  html += '<h3 class="section-title">Cruzamento Linha × Tamanho · Faturamento</h3>';
  const tamanhos = ['10L','5L','2L','1L','500ml','Galão'];
  const linhas = Array.from(new Set(skus.map(p=>p.linha||'Tradicional')));
  const matriz = {};
  linhas.forEach(L => { matriz[L] = {}; tamanhos.forEach(T => matriz[L][T] = 0); });
  skus.forEach(p => {
    const L = p.linha || 'Tradicional';
    const T = (p.tamanho === '-' || !p.tamanho) ? '500ml' : p.tamanho;
    if (matriz[L] && matriz[L][T] !== undefined) matriz[L][T] += p.venda_total||0;
  });
  html += '<div class="chart-card light" style="margin-bottom:36px;padding:0;overflow:hidden;">';
  html += '<div style="overflow-x:auto;"><table class="abc-table">';
  html += '<thead><tr><th>#</th><th class="abc-name">Linha \\\\ Tamanho</th>';
  tamanhos.forEach(T => html += '<th>'+T+'</th>');
  html += '<th>Total</th></tr></thead><tbody>';
  linhas.forEach((L, i) => {
    html += '<tr><td>'+(i+1)+'</td><td class="abc-name"><strong>'+L+'</strong></td>';
    let tot = 0;
    tamanhos.forEach(T => {
      const v = matriz[L][T] || 0;
      tot += v;
      html += '<td style="'+(v>0?'':'opacity:.3;')+'">'+(v > 0 ? fmtBRLk(v) : '–')+'</td>';
    });
    html += '<td><strong>'+fmtBRLk(tot)+'</strong></td></tr>';
  });
  html += '</tbody></table></div></div>';

  // === Cruzamento vendido vs produzido — só mês único (cruzamento não disponível no JSON) ===
  const cruzamentoMes04 = unico && __ABAS_POR_MES__[meses[0]] ? __ABAS_POR_MES__[meses[0]].cruzamento : null;
  if (unico && cruzamentoMes04) {
    html += '<hr class="np-divider">';
    html += '<h3 class="section-title">Vendido vs Produzido · '+meses[0]+'</h3>';
    html += '<p class="lead" style="margin-bottom:16px;color:var(--text-on-light-muted);font-size:13px;">Diferença positiva indica formação de estoque; negativa indica consumo de estoque ou produção insuficiente.</p>';
    const cruz = cruzamentoMes04.filter(c => c.vendido > 0 || c.produzido > 0)
      .sort((a,b) => Math.abs(b.diferenca) - Math.abs(a.diferenca));
    html += '<div class="chart-card light" style="margin-bottom:36px;padding:0;overflow:hidden;">';
    html += '<div style="overflow-x:auto;"><table class="abc-table">';
    html += '<thead><tr><th>#</th><th class="abc-name">Produto</th><th>Vendido</th><th>Produzido</th><th>Diferença</th><th>Status</th></tr></thead><tbody>';
    cruz.forEach((c, i) => {
      const ststr = c.diferenca > 0 ? '<span style="color:var(--success);">+ estoque</span>' :
                    c.diferenca < 0 ? '<span style="color:var(--danger);">– estoque</span>' :
                    '<span style="opacity:.5;">equilíbrio</span>';
      html += '<tr><td>'+(i+1)+'</td><td class="abc-name">'+c.produto+'</td>';
      html += '<td>'+fmtNum(c.vendido,0)+'</td><td>'+fmtNum(c.produzido,0)+'</td>';
      html += '<td><strong>'+(c.diferenca > 0 ? '+' : '')+fmtNum(c.diferenca,0)+'</strong></td>';
      html += '<td>'+ststr+'</td></tr>';
    });
    html += '</tbody></table></div></div>';
  } else if (!unico) {
    html += '<div style="padding:14px 18px;background:rgba(15,66,69,.06);border-radius:8px;margin-bottom:36px;font-size:12px;color:var(--text-on-light-muted);">';
    html += 'Cruzamento Vendido vs Produzido disponível apenas para análise de mês único.</div>';
  }

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

/* ============ PRODUÇÃO · SUBABA "VISÃO GERAL" ============ */
function renderProducaoGeral(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);
  const caldaToggle = 'cenario_a';
  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';

  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--navy);"><span class="pill-num">05</span> · Produção · Visão Geral</div>';
  html += '<h2 class="title-xl">Produção<br>e <u>eficiência</u></h2>';
  const totalBatidasDesc = meses.reduce((s,m)=>{ const d=__ABAS_POR_MES__[m]; return s+(d?d.producao.batidas.length:0); },0);
  html += '<p class="lead" style="color:var(--text-on-light-muted);">Volume por produto, custo unitário e número de ordens de produção.<br>';
  html += '<strong style="font-size:12px;">Ordem de Produção</strong> = registro de lote fabricado no ERP (cada ordem corresponde a um lote fabricado no dia). ';
  html += periodTxt+': '+fmtNum(totalBatidasDesc,0)+' ordens de produção registradas.</p>';
  html += '</div></div>';
  html += '<hr class="np-divider">';

  // === Agregar produção de todos os meses ===
  const aggMap = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.producao || !d.producao.agregado) return;
    d.producao.agregado.forEach(function(a){
      const isCalda = (a.produto||'').toLowerCase().includes('calda');
      if (caldaToggle === 'cenario_a' && isCalda) return; // ocultar calda no cenário A
      const k = canonProduto(a.produto);
      if (!aggMap[k]) aggMap[k] = {
        produto: a.produto, linha: a.linha||'', tamanho: a.tamanho||'',
        qtd: 0, custo_total: 0, _nomeQtd: -1
      };
      if ((a.qtd||0) > aggMap[k]._nomeQtd) { aggMap[k].produto = a.produto; aggMap[k].linha = a.linha||''; aggMap[k].tamanho = a.tamanho||''; aggMap[k]._nomeQtd = (a.qtd||0); }
      aggMap[k].qtd += a.qtd||0;
      aggMap[k].custo_total += a.custo_total||0;
    });
  });
  const agg = Object.values(aggMap).map(function(a){
    a.custo_unit = a.qtd > 0 ? a.custo_total/a.qtd : 0;
    return a;
  }).sort((a,b) => b.qtd - a.qtd);

  const totUnidades = agg.reduce((s,a)=>s+a.qtd,0);
  const totCusto = agg.reduce((s,a)=>s+a.custo_total,0);

  const totalBatidasCount = meses.reduce((s,m)=>{ const d=__ABAS_POR_MES__[m]; return s+(d?d.producao.batidas.length:0); },0);

  // KPIs
  html += '<h3 class="section-title">Indicadores · '+periodTxt+'</h3>';
  html += '<div class="grid-4" style="margin-bottom:36px;">';
  html += kpiCardLight('Ordens de Produção', fmtNum(totalBatidasCount, 0), 'no período', 'neu');
  html += kpiCardLight('Unidades produzidas', fmtNum(totUnidades, 0), 'excl. calda', 'neu');
  html += kpiCardLight('Produtos produzidos', fmtNum(agg.length, 0), 'produtos distintos', 'neu');
  html += kpiCardLight('Custo total produção', fmtBRLk(totCusto), 'soma insumos', 'neu');
  html += '</div>';

  // === Top produtos produzidos ===
  html += '<hr class="np-divider">';
  html += '<h3 class="section-title">Volume e custo por produto</h3>';
  html += '<div class="grid-2" style="margin-bottom:24px;">';
  html += '<div class="chart-card light"><div class="chart-card-title">Top 10 produtos produzidos · Quantidade</div><div class="chart-card-sub">Unidades fabricadas no período</div><div style="position:relative;height:370px;"><canvas id="chProdQtd"></canvas></div></div>';
  const custoProdMode = STATE.custoProdMode || 'total';
  html += '<div class="chart-card light">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:0 0 4px;flex-wrap:wrap;gap:8px;">';
  html += '<div><div class="chart-card-title" style="margin:0;">Top 10 produtos · Custo de produção</div>';
  html += '<div class="chart-card-sub">'+(custoProdMode==='total'?'Custo total de insumos por produto':'Custo unitário médio por produto')+'</div></div>';
  html += '<div style="display:flex;gap:6px;">';
  ['total','unitario'].forEach(function(m){
    const lbl = m==='total' ? 'Custo Total' : 'Custo Unitário';
    const active = custoProdMode === m;
    html += '<button onclick="STATE.custoProdMode=\''+m+'\';render();" style="font-family:Montserrat,sans-serif;font-size:11px;font-weight:600;border:1.5px solid #011E3C;border-radius:6px;padding:5px 11px;cursor:pointer;transition:all .15s;background:'+(active?'#011E3C':'transparent')+';color:'+(active?'#fff':'#011E3C')+';">'+lbl+'</button>';
  });
  html += '</div></div>';
  html += '<div style="position:relative;height:370px;"><canvas id="chProdCusto"></canvas></div></div>';
  html += '</div>';

  // === Tabela agregada ===
  html += '<div class="chart-card light" style="margin-bottom:36px;padding:0;overflow:hidden;">';
  html += '<div style="padding:16px 18px 12px;">';
  html += '<div class="chart-card-title" style="margin:0;padding:0;">Produção agregada por produto</div>';
  html += '</div>';
  html += '<div style="padding:0 18px 10px;font-size:11px;color:var(--text-on-light-muted);">';
  html += 'Todos os produtos · '+agg.length+' itens';
  html += '</div>';
  html += '<div style="overflow-x:auto;max-height:520px;overflow-y:auto;"><table class="abc-table">';
  html += '<thead><tr><th>#</th><th class="abc-name">Produto</th><th>Qtd Produzida</th><th>Custo Total</th><th>Custo Unitário</th></tr></thead><tbody>';
  agg.forEach((a, i) => {
    html += '<tr><td>'+(i+1)+'</td><td class="abc-name">'+a.produto+'</td>';
    html += '<td>'+fmtNum(a.qtd,1)+'</td>';
    html += '<td>'+fmtBRLk(a.custo_total)+'</td>';
    html += '<td>'+fmtBRLk(a.custo_unit)+'</td></tr>';
  });
  html += '</tbody></table></div></div>';

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

/* ============ PRODUÇÃO · SUBABA "BATIDAS" ============ */
function renderProducaoBatidas(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);
  const unico = meses.length === 1;
  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';

  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--navy);"><span class="pill-num">05</span> · Produção · Ordens de Produção</div>';
  html += '<h2 class="title-xl">Ordens de<br><u>produção</u></h2>';
  html += '<p class="lead" style="color:var(--text-on-light-muted);">Distribuição das ordens de produção ao longo do período e detalhamento lote a lote.<br>';
  html += '<strong style="font-size:12px;">Ordem de Produção</strong> = registro de lote fabricado no ERP (cada ordem corresponde a um lote fabricado no dia).</p>';
  html += '</div></div>';
  html += '<hr class="np-divider">';

  // === Batidas: concatenar e ordenar por data ===
  let todasBatidas = [];
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.producao) return;
    d.producao.batidas.forEach(function(b){
      todasBatidas.push(Object.assign({}, b, {_mes: m}));
    });
  });
  todasBatidas.sort(function(a,b){
    const pa = a.dt.split('/').reverse().join('');
    const pb = b.dt.split('/').reverse().join('');
    return pa > pb ? 1 : pa < pb ? -1 : 0;
  });

  // === Batidas por dia (agrupadas) ===
  const batidasDia = {};
  const qtdDia = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.producao) return;
    if (d.producao.batidas_por_dia) {
      Object.entries(d.producao.batidas_por_dia).forEach(function([dia, v]){
        batidasDia[dia] = (batidasDia[dia]||0) + v;
      });
    }
    if (d.producao.qtd_por_dia) {
      Object.entries(d.producao.qtd_por_dia).forEach(function([dia, v]){
        qtdDia[dia] = (qtdDia[dia]||0) + v;
      });
    }
  });
  const diasOrdenados = Object.keys(batidasDia).sort(function(a,b){
    const pa = a.split('/').reverse().join('');
    const pb = b.split('/').reverse().join('');
    return pa > pb ? 1 : pa < pb ? -1 : 0;
  });

  // KPI rápido no topo desta subaba
  html += '<div class="grid-4" style="margin-bottom:36px;">';
  html += kpiCardLight('Ordens de Produção', fmtNum(todasBatidas.length, 0), 'no período', 'neu');
  const totQtdBatidas = todasBatidas.reduce((s,b)=>s+(b.qtd_total||0),0);
  html += kpiCardLight('Unidades nas ordens', fmtNum(totQtdBatidas, 1), 'soma qtd_total', 'neu');
  const totCustoBatidas = todasBatidas.reduce((s,b)=>s+(b.custo_total||0),0);
  html += kpiCardLight('Custo total das ordens', fmtBRLk(totCustoBatidas), 'soma custo_total', 'neu');
  html += kpiCardLight('Dias com produção', fmtNum(diasOrdenados.length, 0), 'dias distintos', 'neu');
  html += '</div>';

  if (diasOrdenados.length > 0) {
    html += '<hr class="np-divider">';
    if (unico) {
      html += '<h3 class="section-title">Distribuição das ordens de produção no mês <span style="font-size:12px;font-weight:400;color:var(--text-on-light-muted);">— por semana</span></h3>';
      html += '<div class="grid-2" style="margin-bottom:36px;">';
      html += '<div class="chart-card light"><div class="chart-card-title">Ordens de produção por semana</div><div class="chart-card-sub">Número de lotes produzidos por semana</div><div style="position:relative;height:330px;"><canvas id="chBatidasDia"></canvas></div></div>';
      html += '<div class="chart-card light"><div class="chart-card-title">Volume produzido por semana</div><div class="chart-card-sub">Total de unidades fabricadas por semana</div><div style="position:relative;height:330px;"><canvas id="chQtdDia"></canvas></div></div>';
    } else {
      html += '<h3 class="section-title">Distribuição das ordens de produção por mês</h3>';
      html += '<div class="grid-2" style="margin-bottom:36px;">';
      html += '<div class="chart-card light"><div class="chart-card-title">Ordens de produção por mês</div><div class="chart-card-sub">Número de lotes produzidos por mês</div><div style="position:relative;height:330px;"><canvas id="chBatidasDia"></canvas></div></div>';
      html += '<div class="chart-card light"><div class="chart-card-title">Volume produzido por mês</div><div class="chart-card-sub">Total de unidades fabricadas por mês</div><div style="position:relative;height:330px;"><canvas id="chQtdDia"></canvas></div></div>';
    }
    html += '</div>';
  }

  // === Lista de batidas (detalhamento) ===
  html += '<hr class="np-divider">';
  html += '<h3 class="section-title">Detalhamento das ordens de produção <span style="font-size:11px;font-weight:400;color:var(--text-on-light-muted);">(ordem de produção = um lote fabricado em determinado dia)</span></h3>';
  html += '<div class="chart-card light" style="margin-bottom:24px;padding:0;overflow:hidden;">';
  html += '<div style="overflow-x:auto;max-height:480px;overflow-y:auto;"><table class="abc-table">';
  html += '<thead><tr><th>Ordem</th><th>Mês</th><th>Data</th><th>Itens</th><th>Qtd Total</th><th>Custo Total</th></tr></thead><tbody>';
  todasBatidas.forEach(b => {
    html += '<tr><td><strong>#'+b.num+'</strong></td>';
    html += '<td>'+(b._mes||'-')+'</td>';
    html += '<td>'+(b.dt||'-')+'</td>';
    html += '<td>'+fmtNum(b.qtd_itens,0)+'</td>';
    html += '<td>'+fmtNum(b.qtd_total,1)+'</td>';
    html += '<td>'+fmtBRLk(b.custo_total)+'</td></tr>';
  });
  html += '</tbody></table></div></div>';

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

/* ============ PRODUÇÃO · SUBABA "PRODUÇÃO×VENDA" ============ */
function renderProducaoVenda(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);
  const unico = meses.length === 1;
  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';

  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--navy);"><span class="pill-num">05</span> · Produção · Produção×Venda</div>';
  html += '<h2 class="title-xl">Produção × <u>venda</u></h2>';
  html += '<p class="lead" style="color:var(--text-on-light-muted);">Comparativo entre unidades produzidas e vendidas por produto — indício de gargalos ou excesso de estoque.</p>';

/* ============ HELPERS SÉRIES ============ */
function sumSerieFat(meses){
  if (!meses) return 0;
  return meses.reduce((s,m) => s + (SERIES.faturamento[m] || 0), 0);
}
function sumSerieVendas(meses){
  return meses.reduce((s,m) => s + (SERIES.n_vendas[m] || 0), 0);
}
function sumSerieDesc(meses){
  return meses.reduce((s,m) => s + (SERIES.descontos[m] || 0), 0);
}
function avgSerie(key, meses){
  const vs = meses.map(m => SERIES[key][m]).filter(v => v != null);
  if (!vs.length) return null;
  return vs.reduce((s,v)=>s+v,0) / vs.length;
}
function prevMonths(meses){
  // Retorna o período imediatamente anterior do mesmo tamanho
  if (!meses.length) return [];
  const idx0 = MESES.indexOf(meses[0]);
  const n = meses.length;
  const start = idx0 - n;
  if (start < 0) return [];
  return MESES.slice(start, idx0);
}
function prevYear(mes){
  // Abr/26 → Abr/25
  const m = mes.match(/^(.+)\/(\d\d)$/);
  if (!m) return mes;
  const yy = parseInt(m[2]) - 1;
  return m[1] + '/' + (yy < 10 ? '0' + yy : yy);
}
function deltaClsAbas(diff){
  if (diff > 0) return 'pos';
  if (diff < 0) return 'neg';
  return 'neu';
}

/* ---- Plugin inline: rótulos acima das barras (sem CDN externa) ---- */
/* Suporta barras verticais e horizontais (indexAxis:'y'); fmtFn pode receber (val, ds, i) para formatação dinâmica */
function makeLabelPlugin(fmtFn, opts){
  // opts: { color, font, negAbaixo }
  opts = opts || {};
  return {
    id: opts.id || 'nortBarLabels',
    afterDatasetsDraw: function(chart, args, pluginOpts){
      var ctx = chart.ctx;
      var horizontal = chart.options && chart.options.indexAxis === 'y';
      chart.data.datasets.forEach(function(ds, di){
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden) return;
        if (ds.type === 'line') return;
        meta.data.forEach(function(bar, i){
          var val = ds.data[i];
          if (val == null || val === 0) return;
          var label = fmtFn(val, ds, i);
          if (!label) return;
          ctx.save();
          ctx.font = (opts.font || '600 10px Montserrat,sans-serif');
          ctx.fillStyle = opts.color || '#011E3C';
          if (horizontal){
            ctx.textAlign = val < 0 ? 'right' : 'left';
            ctx.textBaseline = 'middle';
            var xPos = bar.x + (val < 0 ? -5 : 5);
            ctx.fillText(label, xPos, bar.y);
          } else {
            ctx.textAlign = 'center';
            var isNeg = (val < 0 && opts.negAbaixo);
            ctx.textBaseline = isNeg ? 'top' : 'bottom';
            var yPos = bar.y + (isNeg ? 4 : -4);
            ctx.fillText(label, bar.x, yPos);
          }
          ctx.restore();
        });
      });
    }
  };
}
/* ---- Plugin inline: rótulos acima dos pontos, para gráficos de linha simples ---- */
function makePointLabelPlugin(fmtFn, opts){
  opts = opts || {};
  return {
    id: opts.id || 'nortPointLabels',
    afterDatasetsDraw: function(chart){
      var ctx = chart.ctx;
      chart.data.datasets.forEach(function(ds, di){
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden) return;
        meta.data.forEach(function(pt, i){
          var val = ds.data[i];
          if (val == null) return;
          var label = fmtFn(val, ds, i);
          if (!label) return;
          ctx.save();
          ctx.font = (opts.font || '600 10px Montserrat,sans-serif');
          ctx.fillStyle = opts.color || '#011E3C';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(label, pt.x, pt.y - (opts.offset || 8));
          ctx.restore();
        });
      });
    }
  };
}
/* ---- Formatadores específicos para os rótulos ---- */
var _pluginFat  = makeLabelPlugin(function(v){ return fmtBRLk(v); });
var _pluginTkt  = makeLabelPlugin(function(v){ return 'R$ '+Math.round(v).toLocaleString('pt-BR'); });
var _pluginInt  = makeLabelPlugin(function(v){ return Math.round(v).toLocaleString('pt-BR'); });
var _pluginYoY  = makeLabelPlugin(function(v){ return (v>=0?'+':'')+v.toFixed(1).replace('.',',')+'%'; }, {negAbaixo:true});
/* Plugin exclusivo para chYoYFat (e demais gráficos YoY compactos): rótulo centralizado sobre cada barra, formato compacto (valor em mil, sem "R$"/"mil") */
var _pluginFatOffset = (function(){
  function fmt(v){
    if (v == null || isNaN(v)) return '';
    var mil = v / 1e3;
    var casas = Math.abs(mil) >= 100 ? 0 : 1;
    return mil.toFixed(casas).replace('.', ',');
  }
  return {
    id: 'nortBarLabelsOffset',
    afterDatasetsDraw: function(chart){
      var ctx = chart.ctx;
      chart.data.datasets.forEach(function(ds, di){
        var meta = chart.getDatasetMeta(di);
        if (meta.hidden || ds.type === 'line') return;
        meta.data.forEach(function(bar, i){
          var val = ds.data[i];
          if (val == null || val === 0) return;
          ctx.save();
          ctx.font = '600 9px Montserrat,sans-serif';
          ctx.fillStyle = '#011E3C';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'bottom';
          ctx.fillText(fmt(val), bar.x, bar.y - 4);
          ctx.restore();
        });
      });
    }
  };
})();
