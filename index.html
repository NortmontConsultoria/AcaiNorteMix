/* Tabela ordenável — Padrão Semanal (aba 03) */
function renderPadraoSemanalTbody(){
  const tbody = document.getElementById('padraoSemanalTbody');
  if (!tbody || !STATE.padraoSemanalRows) return;
  const sort = STATE.padraoSemanalSort || {col:'diaIdx', dir:1};
  const rows = STATE.padraoSemanalRows.slice().sort(function(a,b){
    const av = a[sort.col], bv = b[sort.col];
    if (av == null && bv == null) return 0;
    if (av == null) return 1;
    if (bv == null) return -1;
    if (av < bv) return -1 * sort.dir;
    if (av > bv) return 1 * sort.dir;
    return 0;
  });
  let html = '';
  rows.forEach(function(r){
    const pctTxt = r.pctFat != null ? fmtPctSim(r.pctFat) : '—';
    html += '<tr><td class="abc-name">'+r.dia+'</td><td>'+fmtBRLk(r.fat)+'</td><td>'+pctTxt+'</td><td>'+fmtNum(r.qtd,0)+'</td></tr>';
  });
  tbody.innerHTML = html;
  ['diaIdx','fat','pctFat','qtd'].forEach(function(col){
    const arrowEl = document.getElementById('ps-arrow-'+col);
    if (!arrowEl) return;
    arrowEl.innerHTML = (col === sort.col) ? (sort.dir === 1 ? ' &#9650;' : ' &#9660;') : '';
  });
}
function sortPadraoSemanal(col){
  const sort = STATE.padraoSemanalSort || {col:'diaIdx', dir:1};
  if (sort.col === col){
    sort.dir = sort.dir * -1;
  } else {
    sort.col = col;
    sort.dir = 1;
  }
  STATE.padraoSemanalSort = sort;
  renderPadraoSemanalTbody();
}

function buildProdutosCharts(){
  const meses = STATE.selectedMonths;
  // Agregar produtos de todos os meses (igual ao renderProdutos)
  const prodMapC = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.produtos_abc) return;
    d.produtos_abc.forEach(function(p){
      const k = canonProduto(p.produto);
      if (!prodMapC[k]) prodMapC[k] = {produto:p.produto, linha:p.linha, tamanho:p.tamanho, qtd:0, venda_total:0, custo_total:0, lucro:0, _nomeQtd:-1};
      if ((p.qtd||0) > prodMapC[k]._nomeQtd) { prodMapC[k].produto = p.produto; prodMapC[k].linha = p.linha; prodMapC[k].tamanho = p.tamanho; prodMapC[k]._nomeQtd = (p.qtd||0); }
      prodMapC[k].qtd += p.qtd||0;
      prodMapC[k].venda_total += p.venda_total||0;
      prodMapC[k].custo_total += p.custo_total||0;
      prodMapC[k].lucro += p.lucro||0;

    const L = p.linha || 'Tradicional';
    if (!porLinha[L]) porLinha[L] = {venda:0, lucro:0};

/* ============ PRODUÇÃO · GRÁFICOS "VISÃO GERAL" ============ */
function buildProducaoGeralCharts(){
  const meses = STATE.selectedMonths;
  const caldaToggle = 'cenario_a';

  const aggMap = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.producao || !d.producao.agregado) return;
    d.producao.agregado.forEach(function(a){
      const isCalda = (a.produto||'').toLowerCase().includes('calda');
      if (caldaToggle === 'cenario_a' && isCalda) return;
      const k = canonProduto(a.produto);
      if (!aggMap[k]) aggMap[k] = {produto:a.produto, qtd:0, custo_total:0, _nomeQtd:-1};
      if ((a.qtd||0) > aggMap[k]._nomeQtd) { aggMap[k].produto = a.produto; aggMap[k]._nomeQtd = (a.qtd||0); }
      aggMap[k].qtd += a.qtd||0;
      aggMap[k].custo_total += a.custo_total||0;
    });
  });
  const agg = Object.values(aggMap).map(function(a){ a.custo_unit = a.qtd > 0 ? a.custo_total / a.qtd : 0; return a; }).sort((a,b)=>b.qtd-a.qtd);

  const ctxOpts = nortChartBaseOpts(function(v){ return v; });

  const ctxQ = document.getElementById('chProdQtd');
  if (ctxQ){
    // Chart.js indexAxis:'y' renderiza do topo para baixo → reverse para maior no topo
    const top10Qtd = agg.slice(0, 10).reverse();
    STATE.charts.prodQtd = new Chart(ctxQ, {
      type:'bar',
      data:{labels: top10Qtd.map(a=>a.produto.length>22?a.produto.slice(0,20)+'…':a.produto),

      plugins: [makeLabelPlugin(function(v){ return Math.round(v).toLocaleString('pt-BR'); })]
    });
  }

  const ctxC = document.getElementById('chProdCusto');
  if (ctxC){
    const custoProdMode = STATE.custoProdMode || 'total';
    // Ordenar agg (já limpo, sem calda) pelo valor relevante desc e pegar top10, depois inverter para Chart.js
    const sortedC = agg.slice()
      .sort((a,b) => custoProdMode === 'unitario' ? b.custo_unit - a.custo_unit : b.custo_total - a.custo_total)
      .slice(0, 10)
      .reverse();
    const dataVals = sortedC.map(a => custoProdMode === 'unitario' ? a.custo_unit : a.custo_total);
    STATE.charts.prodCusto = new Chart(ctxC, {

      options:{...ctxOpts, indexAxis:'y',
        scales:{x:{ticks:{color:'#011E3C',font:{size:10.5},callback:v=>fmtBRLk(v)},grid:{color:'rgba(1,30,60,.06)'}},
          y:{beginAtZero:true,ticks:{color:'#011E3C',font:{size:10.5}},grid:{display:false}}},
        plugins:{...ctxOpts.plugins,
          tooltip:{backgroundColor:'#011E3C',titleColor:'#E0EEE7',bodyColor:'#E0EEE7',

    });
  }

/* ============ PRODUÇÃO · GRÁFICOS "BATIDAS" ============ */
function buildProducaoBatidasCharts(){
  const meses = STATE.selectedMonths;
  const unico = meses.length === 1;

  const ctxOpts = nortChartBaseOpts(function(v){ return v; });

  // Batidas — agrupar por mês (multi) ou por semana (único)
  const batidasDia = {};
  const qtdDia = {};
  meses.forEach(function(m){
    const d = __ABAS_POR_MES__[m];
    if (!d || !d.producao) return;
    if (d.producao.batidas_por_dia) {
      Object.entries(d.producao.batidas_por_dia).forEach(function([dia, v]){ batidasDia[dia] = (batidasDia[dia]||0) + v; });
    }
    if (d.producao.qtd_por_dia) {
      Object.entries(d.producao.qtd_por_dia).forEach(function([dia, v]){ qtdDia[dia] = (qtdDia[dia]||0) + v; });
    }
  });
  const diasRaw = Object.keys(batidasDia).sort(function(a,b){
    const pa = a.split('/').reverse().join('');
    const pb = b.split('/').reverse().join('');
    return pa > pb ? 1 : pa < pb ? -1 : 0;
  });

  // Função: converte "DD/MM/YYYY" → semana do mês no formato "Sem N (MM/AAAA)"
  function diaParaSemana(dStr) {
    const parts = dStr.split('/');
    const day = parseInt(parts[0], 10);
    const semN = Math.ceil(day / 7);
    return 'Sem ' + semN + ' (' + parts[1] + '/' + parts[2] + ')';
  }
  // Função: converte "DD/MM/YYYY" → "MMM/AAAA" (ex: "Jan/2026")
  const MESES_ABREV = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  function diaParaMes(dStr) {
    const parts = dStr.split('/');
    const mes = parseInt(parts[1], 10) - 1;
    return MESES_ABREV[mes] + '/' + parts[2];
  }

  // Agregar
  let agrupKeys, agrupBatidas, agrupQtd;
  if (unico) {
    // Por semana
    const mapB = {}, mapQ = {};
    diasRaw.forEach(function(d){
      const k = diaParaSemana(d);
      mapB[k] = (mapB[k]||0) + batidasDia[d];
      mapQ[k] = (mapQ[k]||0) + (qtdDia[d]||0);
    });
    agrupKeys = Object.keys(mapB);
    agrupBatidas = mapB;
    agrupQtd = mapQ;
  } else {
    // Por mês
    const mapB = {}, mapQ = {};
    diasRaw.forEach(function(d){
      const k = diaParaMes(d);
      mapB[k] = (mapB[k]||0) + batidasDia[d];
      mapQ[k] = (mapQ[k]||0) + (qtdDia[d]||0);
    });
    agrupKeys = Object.keys(mapB).sort(function(a,b){
      const ai = MESES_ABREV.indexOf(a.split('/')[0]) + parseInt(a.split('/')[1],10)*12;
      const bi = MESES_ABREV.indexOf(b.split('/')[0]) + parseInt(b.split('/')[1],10)*12;
      return ai - bi;
    });
    agrupBatidas = mapB;
    agrupQtd = mapQ;
  }

  const ctxBD = document.getElementById('chBatidasDia');
  if (ctxBD && agrupKeys.length > 0){
    STATE.charts.batidasDia = new Chart(ctxBD, {
      type:'bar',
      data:{labels: agrupKeys, datasets:[{label:'Ordens de produção', data: agrupKeys.map(k=>agrupBatidas[k]),
        backgroundColor:'#0F4245', borderRadius:4}]},
      options:{...ctxOpts, layout:{padding:{top:24}},
        scales:{x:{ticks:{color:'#011E3C',font:{size:unico?9:10}},grid:{display:false}},
          y:{beginAtZero:true,grace:'12%',ticks:{color:'#011E3C',font:{size:10.5}},grid:{color:'rgba(1,30,60,.06)'}}}},
      plugins: [makeLabelPlugin(function(v){ return Math.round(v).toLocaleString('pt-BR'); }, {font:'600 9.5px Montserrat,sans-serif'})]
    });
  }

  const ctxQD = document.getElementById('chQtdDia');
  if (ctxQD && agrupKeys.length > 0){
    STATE.charts.qtdDia = new Chart(ctxQD, {
      type:'bar',
      data:{labels: agrupKeys, datasets:[{label:'Unidades', data: agrupKeys.map(k=>agrupQtd[k]),
        backgroundColor:'#A8CCA8', borderRadius:4}]},
      options:{...ctxOpts, layout:{padding:{top:24}},
        scales:{x:{ticks:{color:'#011E3C',font:{size:unico?9:10}},grid:{display:false}},
          y:{beginAtZero:true,grace:'12%',ticks:{color:'#011E3C',font:{size:10.5}},grid:{color:'rgba(1,30,60,.06)'}}}},
      plugins: [makeLabelPlugin(function(v){ return Math.round(v).toLocaleString('pt-BR'); }, {font:'600 9.5px Montserrat,sans-serif'})]
    });
  }
}

  ].forEach(([t,d])=>{ html += '<div class="insight-card light" style="margin-bottom:10px;border-left:3px solid var(--warning,#f59e0b);"><div class="insight-label" style="color:var(--warning,#f59e0b);">⚠ '+t+'</div><div class="insight-text">'+d+'</div></div>'; });
  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

}

/* ============ HELPERS UI ============ */
function kpiCardLight(label, value, delta, deltaCls, extra, pct){
  var bar = '';
  if (pct != null && !isNaN(pct)){
    var cls = pct >= 100 ? 'ok' : pct >= 75 ? 'warn' : 'bad';
    var w = Math.min(Math.max(pct, 0), 120);
    bar = '<div class="np-pbar-wrap"><div class="np-pbar '+cls+'" style="width:'+w+'%"></div></div>';
  }
  return '<div class="kpi-card light">'
    + '<div class="kpi-label">'+label+'</div>'
    + '<div class="kpi-value">'+value+'</div>'
    + (delta ? '<div class="kpi-delta '+deltaCls+'">'+delta+'</div>' : '')
    + bar
    + (extra ? '<div class="kpi-extra">'+extra+'</div>' : '')
    + '</div>';
}
function kpiCardDark(label, value, delta, deltaCls, extra){
  return '<div class="kpi-card"><div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+'</div>'
    + (delta ? '<div class="kpi-delta '+deltaCls+'">'+delta+'</div>' : '')
    + (extra ? '<div class="kpi-extra">'+extra+'</div>' : '')
    + '</div>';
}
function nivelCard(num, titulo, valor, desc, meta, nv){
  return '<div class="nivel-card '+nv+'"><div class="nv-num">'+num+'</div>'
    + '<div class="nv-titulo">'+titulo+'</div>'
    + '<div class="nv-valor">'+valor+'</div>'
    + '<div class="nv-desc">'+desc+'</div>'
    + (meta ? '<div class="nv-meta">'+meta+'</div>' : '')
    + '</div>';
}


/* ============================================================
   ABA 1: RESUMO EXECUTIVO
   ============================================================ */
function renderResumo(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);

  // KPIs financeiros principais (regime caixa)
  const recBruta = sumSerie('receita_bruta', meses);
  const lucroBruto = sumSerie('lucro_bruto', meses);
  const lucroOp = sumSerie('lucro_operacional', meses);
  const excedente = sumSerie('excedente', meses);

  // MC e PE (são percentuais/valores diretos, faz sentido pegar média no período)
  let mcAvg = null, peAvg = null;
  if (meses.length === 1){
    mcAvg = (SERIES.margem_contribuicao[meses[0]] || 0) * 100;
    peAvg = SERIES.ponto_equilibrio[meses[0]] || 0;
  } else {
    let mcSum = 0, peSum = 0, count = 0;
    meses.forEach(m => {
      if (SERIES.margem_contribuicao[m]) { mcSum += SERIES.margem_contribuicao[m]; count++; }
      if (SERIES.ponto_equilibrio[m]) peSum += SERIES.ponto_equilibrio[m];
    });
    mcAvg = count > 0 ? (mcSum/count)*100 : null;
    peAvg = meses.length > 0 ? peSum/meses.length : null;
  }

  // Variações
  const yoyRec = yoyPct('receita_bruta', meses);
  const yoyExc = yoyPct('excedente', meses);
  const ahRec = ahPct('receita_bruta', meses);
  const ahExc = ahPct('excedente', meses);

  // Faturamento (competência) - planilha comercial
  const fatComp = sumSerie('faturamento', meses);

  // Metas - só faz sentido para o primeiro mês selecionado ou somatório
  const cota = sumMetas(meses, 'cota');
  const meta = sumMetas(meses, 'meta');
  const superMeta = sumMetas(meses, 'super');
  const hasMeta = cota > 0;
  const coberturaCota = (hasMeta && cota > 0) ? (fatComp / cota) * 100 : null;
  const coberturaMeta = (hasMeta && meta > 0) ? (fatComp / meta) * 100 : null;
  const coberturaSuper = (hasMeta && superMeta > 0) ? (fatComp / superMeta) * 100 : null;

  // Despesas operacionais
  const despOp = sumSerie('desp_operacionais', meses);

  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';
  html += '<div class="mountain-bg"><svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"><path d="M0,900 L0,500 L200,300 L400,420 L600,200 L800,360 L1000,180 L1200,320 L1400,240 L1600,360 L1600,900 Z" fill="#011E3C" fill-opacity=".55"/><path d="M0,900 L0,650 L150,520 L350,580 L520,420 L720,520 L920,380 L1120,490 L1320,400 L1500,500 L1600,460 L1600,900 Z" fill="#011E3C" fill-opacity=".35"/></svg></div>';

  // Header
  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--teal-deep);"><span class="pill-num">01</span> · Resumo Executivo</div>';
  html += '<h2 class="title-xl">Fechamento<br>de <u>'+periodTxt+'</u></h2>';
  html += '<p class="lead">Visão consolidada do desempenho operacional, comercial e financeiro do período selecionado.</p>';
  html += '</div></div>';

  html += '<hr class="np-divider">';

  // YoY baseline (mesmo período 2025)
  var prevMesesYoY = meses.map(function(m){ var p=m.split('/'); return p[0]+'/'+(parseInt(p[1])-1).toString().padStart(2,'0'); });
  var recBrutaYoY  = prevMesesYoY.every(function(m){ return SERIES.receita_bruta && SERIES.receita_bruta[m]!==undefined; }) ? sumSerie('receita_bruta', prevMesesYoY) : null;
  var lucroOpYoY   = prevMesesYoY.every(function(m){ return SERIES.lucro_operacional && SERIES.lucro_operacional[m]!==undefined; }) ? sumSerie('lucro_operacional', prevMesesYoY) : null;
  var excedenteYoY = prevMesesYoY.every(function(m){ return SERIES.excedente && SERIES.excedente[m]!==undefined; }) ? sumSerie('excedente', prevMesesYoY) : null;
  var mcYoY = prevMesesYoY.every(function(m){ return SERIES.margem_contribuicao && SERIES.margem_contribuicao[m]!==undefined; })
    ? (prevMesesYoY.reduce(function(s,m){ return s+(SERIES.margem_contribuicao[m]||0); },0)/prevMesesYoY.length)*100 : null;
  var peYoY = prevMesesYoY.every(function(m){ return SERIES.ponto_equilibrio && SERIES.ponto_equilibrio[m]!==undefined; })
    ? prevMesesYoY.reduce(function(s,m){ return s+(SERIES.ponto_equilibrio[m]||0); },0)/prevMesesYoY.length : null;

  // Variações YoY adicionais
  var yoyLucroOp = pctChange(lucroOp, lucroOpYoY);
  var yoyMC = pctChange(mcAvg, mcYoY);
  var yoyPE = pctChange(peAvg, peYoY);

  // ===== KPIs principais =====
  html += '<h3 class="section-title">Indicadores do período</h3>';
  html += '<div class="grid-5" style="margin-bottom:36px;">';

  html += kpiCardLight('Receita Bruta (caixa)', fmtBRLshort(recBruta),
    '', '',
    recBrutaYoY !== null ? '<span>2025: '+fmtBRLshort(recBrutaYoY)+'</span>' + deltaInline(yoyRec) : '');

  html += kpiCardLight('Lucro Operacional', fmtBRLshort(lucroOp),
    recBruta ? fmtPct((lucroOp/recBruta)*100)+' margem' : '', 'neu',
    lucroOpYoY !== null ? '<span>2025: '+fmtBRLshort(lucroOpYoY)+'</span>' + deltaInline(yoyLucroOp) : '');

  html += kpiCardLight('Excedente (Caixa Líquido)', fmtBRLshort(excedente),
    '', '',
    excedenteYoY !== null ? '<span>2025: '+fmtBRLshort(excedenteYoY)+'</span>' + deltaInline(yoyExc) : '');

  html += kpiCardLight('Margem de Contribuição', mcAvg !== null ? fmtPct(mcAvg) : '-', '', 'neu',
    mcYoY !== null ? '<span>2025: '+fmtPct(mcYoY)+'</span>' + deltaInline(yoyMC) : '');

  // PE invertido: subir é ruim, descer é bom
  html += kpiCardLight('Ponto de Equilíbrio', peAvg !== null ? fmtBRLshort(peAvg) : '-', '', 'neu',
    peYoY !== null ? '<span>2025: '+fmtBRLshort(peYoY)+'</span>' + deltaInline(yoyPE, true) : '');

  html += '</div>';

  // ===== Cobertura de meta =====
  if (hasMeta){
    html += '<h3 class="section-title">Cobertura de meta comercial</h3>';
    html += '<p class="lead" style="margin-bottom:12px;">Faturamento de '+periodTxt+' (regime competência): <strong>'+fmtBRL(fatComp)+'</strong>. Comparação com Cota, Meta e Super Meta do período.</p>';
    html += '<div class="meta-row">';
    html += metaCard('Cota', cota, coberturaCota);
    html += metaCard('Meta', meta, coberturaMeta);
    html += metaCard('Super Meta', superMeta, coberturaSuper);
    html += '</div>';
  }

  html += '<hr class="np-divider">';

  // ===== Cascata simplificada da DRE =====
  html += '<h3 class="section-title">Da receita ao caixa</h3>';
  html += '<p class="lead" style="margin-bottom:20px;">DRE consolidada em estrutura simplificada — em '+periodTxt+'.</p>';

  html += '<div class="grid-2" style="margin-bottom:36px;">';

  // Cascata visual
  html += '<div class="chart-card light"><div class="chart-card-title">Cascata DRE</div><div class="chart-card-sub">Receita → Lucro</div>';
  html += '<div style="position:relative;height:370px;"><canvas id="chCascataResumo"></canvas></div></div>';

  // Cascata texto
  const recLiq = sumSerie('receita_liquida', meses);
  const impostos = sumSerie('impostos', meses);
  const cmv = sumSerie('cmv', meses);
  const investProv = sumSerie('invest_provisoes', meses);
  html += '<div class="chart-card light"><div class="chart-card-title">Valores</div><div class="chart-card-sub">Em R$</div>';
  html += '<table class="cascata-table">';
  html += casRow('(+) Receita Bruta', recBruta, 100, true);
  html += casRow('(−) Impostos', -impostos, recBruta ? -(impostos/recBruta*100) : null);
  html += casRow('(=) Receita Líquida', recLiq, recBruta ? (recLiq/recBruta*100) : null, true, true);
  html += casRow('(−) CMV', -cmv, recBruta ? -(cmv/recBruta*100) : null);
  html += casRow('(=) Lucro Bruto', lucroBruto, recBruta ? (lucroBruto/recBruta*100) : null, true, true);
  html += casRow('(−) Despesas Operacionais', -despOp, recBruta ? -(despOp/recBruta*100) : null);
  html += casRow('(=) Lucro Operacional', lucroOp, recBruta ? (lucroOp/recBruta*100) : null, true, true);
  html += casRow('(−) Investimentos e Provisões', -investProv, recBruta ? -(investProv/recBruta*100) : null);
  html += casRow('(=) Excedente', excedente, recBruta ? (excedente/recBruta*100) : null, true, true);
  html += '</table></div>';

  html += '</div>';

  // ===== Variação consolidada do período vs mesmo período do ano anterior =====
  const mesesYoYCasc = meses.filter(m => m.endsWith('/26') && SERIES.receita_bruta[m.replace('/26','/25')] != null)
    .map(m => m.replace('/26','/25'));
  if (mesesYoYCasc.length > 0){
    const recBrutaYoY = sumSerie('receita_bruta', mesesYoYCasc);
    const lucroBrutoYoY = sumSerie('lucro_bruto', mesesYoYCasc);
    const lucroOpYoY = sumSerie('lucro_operacional', mesesYoYCasc);
    const excedenteYoY = sumSerie('excedente', mesesYoYCasc);
    html += '<h3 class="section-title">Variação consolidada do período <span style="font-size:12px;font-weight:400;color:var(--text-on-light-muted);">— total do período vs mesmo período de 2025</span></h3>';
    html += '<p class="lead" style="margin-bottom:20px;">Soma de '+periodTxt+' comparada à soma dos meses equivalentes em 2025 — complementa a visão mês a mês do DFC (Aba 02).</p>';
    html += '<div class="chart-card light" style="margin-bottom:36px;"><div class="chart-card-title">Receita e lucros · consolidado do período</div><div class="chart-card-sub">2025 (cinza) vs 2026 (petróleo) · Em R$</div><div style="position:relative;height:360px;"><canvas id="chCascataYoY"></canvas></div></div>';
    STATE._cascataYoYData = {
      labels:['Receita Bruta','Lucro Bruto','Lucro Operacional','Excedente'],
      v25:[recBrutaYoY, lucroBrutoYoY, lucroOpYoY, excedenteYoY],
      v26:[recBruta, lucroBruto, lucroOp, excedente]
    };
  } else {
    STATE._cascataYoYData = null;
  }

  html += '<hr class="np-divider">';

  // ===== 4 níveis (Receita / Custo / Despesas / Caixa) =====
  html += '<h3 class="section-title">Estrutura do resultado</h3>';
  html += '<div class="grid-4" style="margin-bottom:36px;">';
  html += nivelCard('01', 'Receita Bruta', fmtBRLshort(recBruta),
    'Total recebido no período em regime de caixa.',
    'Faturamento competência: '+fmtBRLshort(fatComp), 'nv1');
  html += nivelCard('02', 'CMV', fmtBRLshort(cmv),
    'Custo das mercadorias vendidas: matérias-primas, embalagens, frete.',
    recBruta ? fmtPct(cmv/recBruta*100)+' da receita' : '', 'nv3');
  html += nivelCard('03', 'Despesas Operacionais', fmtBRLshort(despOp),
    'Administrativas, pessoal, marketing e financeiras.',
    recBruta ? fmtPct(despOp/recBruta*100)+' da receita' : '', 'nv4');
  html += nivelCard('04', 'Excedente', fmtBRLshort(excedente),
    'Geração líquida após investimentos e provisões.',
    recBruta ? fmtPct(excedente/recBruta*100)+' da receita' : '', 'nv2');
  html += '</div>';

  html += '<hr class="np-divider">';

  // ===== Leitura textual =====
  html += '<h3 class="section-title">Leitura do período</h3>';
  html += '<div class="grid-2" style="gap:16px;margin-bottom:36px;">';

  // Receita
  html += '<div class="insight-card light"><div class="insight-label">Receita</div><div class="insight-text">';
  html += 'A receita bruta totalizou <strong>'+fmtBRL(recBruta)+'</strong> em '+periodTxt+'.';
  if (ahRec !== null && isFinite(ahRec)){
    const dir = ahRec >= 0 ? 'crescimento' : 'retração';
    html += ' Frente ao período anterior comparável, <strong>'+dir+' de '+fmtPct(Math.abs(ahRec))+'</strong>.';
  }
  if (yoyRec !== null && isFinite(yoyRec)){
    const dir = yoyRec >= 0 ? 'expansão' : 'retração';
    html += ' Contra o mesmo período de 2025, <strong>'+dir+' de '+fmtPct(Math.abs(yoyRec))+'</strong>.';
  }
  html += '</div></div>';

  // Margem
  html += '<div class="insight-card light"><div class="insight-label">Margem e CMV</div><div class="insight-text">';
  if (mcAvg !== null) html += 'A margem de contribuição '+(meses.length>1?'média do período':'')+ ' foi de <strong>'+fmtPct(mcAvg)+'</strong>. ';
  if (recBruta && cmv) html += 'O CMV representou <strong>'+fmtPct(cmv/recBruta*100)+'</strong> da receita bruta. ';
  if (peAvg !== null) html += 'O ponto de equilíbrio '+(meses.length>1?'médio':'')+' do período foi <strong>'+fmtBRL(peAvg)+'</strong>.';
  html += '</div></div>';

  // Caixa
  html += '<div class="insight-card light"><div class="insight-label">Geração de caixa</div><div class="insight-text">';
  html += 'O excedente de caixa atingiu <strong>'+fmtBRL(excedente)+'</strong>';
  if (recBruta) html += ', equivalente a <strong>'+fmtPct(excedente/recBruta*100)+'</strong> sobre a receita';
  html += '. ';
  if (investProv > 0) html += 'Foram absorvidos <strong>'+fmtBRL(investProv)+'</strong> em investimentos e provisões.';
  html += '</div></div>';

  // Síntese
  html += '<div class="insight-card light" style="border-left-color:var(--warning);"><div class="insight-label" style="color:var(--warning);">Síntese</div><div class="insight-text">';
  if (excedente > 0 && lucroOp > 0 && recBruta && (lucroOp/recBruta) > 0.15){
    html += 'O período fecha com <strong>operação superavitária e margem operacional saudável</strong>. ';
  } else if (excedente > 0){
    html += 'O período fecha com <strong>geração positiva de caixa</strong>. ';
  } else {
    html += 'O período exigiu <strong>consumo de caixa</strong> para sustentar a operação. ';
  }
  if (hasMeta && coberturaMeta !== null){
    if (coberturaMeta >= 100) html += 'A meta comercial foi <strong>atingida ('+fmtPct(coberturaMeta)+')</strong>.';
    else if (coberturaCota >= 100) html += 'A cota foi atingida, mas a meta cheia ficou em <strong>'+fmtPct(coberturaMeta)+'</strong>.';
    else html += 'A cota comercial ficou em <strong>'+fmtPct(coberturaCota)+'</strong> — abaixo do mínimo esperado.';
  }
  html += '</div></div>';

  html += '</div>';

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

function casRow(label, value, pct, major, result){
  const cls = result ? 'result-row' : (major ? 'major-row' : '');
  const valCls = value < 0 ? 'neg' : (value > 0 ? 'pos' : '');
  const pctStr = pct !== null && pct !== undefined ? (pct >= 0 ? '+' : '') + pct.toFixed(1).replace('.',',') + '%' : '';
  return '<tr class="'+cls+'"><td class="label-cell">'+label+'</td><td class="num '+valCls+'">'+fmtBRL(value)+'</td><td class="pct-cell">'+pctStr+'</td></tr>';
}

function metaCard(name, target, cobertura){
  let cls = 'fraco';
  if (cobertura >= 100) cls = 'atingida';
  else if (cobertura >= 80) cls = 'parcial';
  const cardCls = cobertura >= 100 ? 'atingida' : '';
  const fill = Math.min(cobertura || 0, 150);
  return '<div class="meta-pill-card '+cardCls+'">'
    + '<div class="meta-name">'+name+'</div>'
    + '<div class="meta-target">'+fmtBRLshort(target)+'</div>'
    + '<div class="meta-cob '+cls+'">'+fmtPct(cobertura||0)+'</div>'
    + '<div class="meta-progress"><div class="meta-progress-fill '+cls+'" style="width:'+fill+'%;"></div></div>'
    + '</div>';
}

}

/* ============ FINANCEIRO · SUBABA "DFC" (tabela detalhada, regime de caixa) ============ */
function renderFinDFC(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);

  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';

  // Header
  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--teal-deep);"><span class="pill-num">02</span> · Financeiro · DFC</div>';
  html += '<h2 class="title-xl">DFC em <u>profundidade</u></h2>';
  html += '<p class="lead">Demonstração de Resultados em regime de caixa. Mês a mês com análise vertical (AV%) e horizontal (AH%). Acumulado do período ao final.</p>';
  html += '</div></div>';

  html += '<hr class="np-divider">';

  // ===== Tabela DRE completa =====
  const dreView = STATE.dreView || 'analitico';
  html += '<div class="dre-section-header">';

  html += '<div class="dre-view-toggle">';
  html += '<button class="dre-view-btn'+(dreView==='sintetico'?' active':'')+'" onclick="STATE.dreView=\'sintetico\';render();" title="Visão sintética — apenas os principais agregadores">Sintético</button>';
  html += '<button class="dre-view-btn'+(dreView==='analitico'?' active':'')+'" onclick="STATE.dreView=\'analitico\';render();" title="Visão analítica — todas as linhas detalhadas">Analítico</button>';
  html += '</div></div>';
  if (dreView === 'analitico'){
    html += '<p class="lead" style="margin-bottom:20px;">Clique no rótulo de uma linha agregadora (CMV, Despesas Administrativas, Pessoal, Marketing, Financeiras, Investimentos) para esconder ou expandir o detalhamento. Clique em qualquer outro ponto de uma linha para ver a evolução daquela conta em um gráfico.</p>';
  } else {
    html += '<p class="lead" style="margin-bottom:20px;">Visão sintética com os principais totalizadores. Alterne para Analítico para ver o detalhamento linha a linha. Clique em uma linha para ver a evolução daquela conta em um gráfico.</p>';
  }

  html += renderDRETable();

  html += '<div style="margin-top:20px;padding:14px 18px;background:rgba(1,30,60,.04);border-radius:6px;font-size:12px;color:var(--text-on-light-muted);line-height:1.6;">';
  html += '<strong style="color:var(--navy);">Convenções:</strong> (+) entradas · (−) saídas · (=) totalizadores. Linhas em destaque são consolidações. AV% é o peso sobre a Receita Bruta do mês. AH% compara contra o mês imediatamente anterior na seleção e é exibida quando há mais de um mês selecionado. A coluna "Acum. período" soma os meses visíveis; "Média/mês" tira a média mensal sobre os meses visíveis. Clique numa linha para abrir o gráfico de evolução mensal daquela conta, com comparativo 2026×2025.';
  html += '</div>';

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

/* ============ FINANCEIRO · SUBABA "INDICADORES" (KPIs + gráficos) ============ */
function renderFinIndicadores(){
  const meses = STATE.selectedMonths;
  const periodTxt = periodoLabel(meses);

  // KPIs do topo
  const recBruta = sumSerie('receita_bruta', meses);
  const lucroBruto = sumSerie('lucro_bruto', meses);
  const lucroOp = sumSerie('lucro_operacional', meses);
  const excedente = sumSerie('excedente', meses);

  let mcAvg = null, peAvg = null;
  if (meses.length === 1){
    mcAvg = (SERIES.margem_contribuicao[meses[0]] || 0) * 100;
    peAvg = SERIES.ponto_equilibrio[meses[0]] || 0;
  } else {
    let mcSum = 0, peSum = 0, c = 0;
    meses.forEach(m => { if (SERIES.margem_contribuicao[m]) { mcSum += SERIES.margem_contribuicao[m]; c++;} if (SERIES.ponto_equilibrio[m]) peSum += SERIES.ponto_equilibrio[m]; });
    mcAvg = c > 0 ? (mcSum/c)*100 : null;
    peAvg = meses.length > 0 ? peSum/meses.length : null;
  }

  let html = '<div class="tab-panel active">';
  html += '<section class="page light">';

  // Header
  html += '<div class="section-header"><div>';
  html += '<div class="pill" style="margin-bottom:18px;color:var(--teal-deep);"><span class="pill-num">02</span> · Financeiro · Indicadores</div>';
  html += '<h2 class="title-xl">Indicadores e <u>tendências</u></h2>';
  html += '<p class="lead">Indicadores-chave, evolução de faturamento vs receita e detalhamento por categoria de despesa.</p>';
  html += '</div></div>';

  html += '<hr class="np-divider">';

  // KPIs
  html += '<h3 class="section-title">Indicadores · '+periodTxt+'</h3>';
  html += '<div class="grid-6" style="margin-bottom:36px;">';
  html += kpiCardLight('Receita Bruta', fmtBRLshort(recBruta), recBruta ? fmtPct(100)+' AV' : '', 'neu');
  html += kpiCardLight('Lucro Bruto', fmtBRLshort(lucroBruto), recBruta ? fmtPct(lucroBruto/recBruta*100)+' AV' : '', 'neu');
  html += kpiCardLight('Lucro Operacional', fmtBRLshort(lucroOp), recBruta ? fmtPct(lucroOp/recBruta*100)+' AV' : '', 'neu');
  html += kpiCardLight('Excedente', fmtBRLshort(excedente), recBruta ? fmtPct(excedente/recBruta*100)+' AV' : '', 'neu');
  html += kpiCardLight('Margem de Contribuição', mcAvg !== null ? fmtPct(mcAvg) : '-', meses.length > 1 ? 'média do período' : 'do mês', 'neu');
  html += kpiCardLight('Ponto de Equilíbrio', peAvg !== null ? fmtBRLshort(peAvg) : '-', meses.length > 1 ? 'média mensal' : 'do mês', 'neu');
  html += '</div>';

  html += '<hr class="np-divider">';

  // ===== Faturamento vs Receita (comp vs caixa) =====
  html += '<h3 class="section-title">Faturamento vs Receita</h3>';
  html += '<p class="lead" style="margin-bottom:20px;">Comparativo entre faturamento (regime competência — venda emitida) e receita (regime caixa — efetivamente recebida).</p>';
  html += '<div class="chart-card light" style="margin-bottom:36px;"><div class="chart-card-title">Competência vs Caixa</div><div class="chart-card-sub">Série mensal completa</div><div style="position:relative;height:350px;"><canvas id="chFatRec"></canvas></div></div>';

  html += '<hr class="np-divider">';

  // ===== Composição (período selecionado) =====
  html += '<h3 class="section-title">Composição · '+periodTxt+'</h3>';
  html += '<div class="grid-2" style="margin-bottom:24px;">';
  html += '<div class="chart-card light"><div class="chart-card-title">Composição CMV · '+periodTxt+'</div><div class="chart-card-sub">Matérias-Primas · Embalagens · Frete · Pedágio · Combustível</div><div style="position:relative;height:310px;"><canvas id="chCMVComp"></canvas></div></div>';
  html += '<div class="chart-card light"><div class="chart-card-title">Composição despesas · '+periodTxt+'</div><div class="chart-card-sub">Peso de cada categoria</div><div style="position:relative;height:310px;"><canvas id="chDespComp"></canvas></div></div>';
  html += '</div>';

  html += '<div class="chart-card light" style="margin-bottom:36px;"><div class="chart-card-title">Despesas Operacionais · empilhadas</div><div class="chart-card-sub">Administrativas · Pessoal · Marketing · Financeiras</div><div style="position:relative;height:310px;"><canvas id="chDespStack"></canvas></div></div>';

  html += '<hr class="np-divider">';
  html += '<h3 class="section-title">Comparativo 2025 × 2026</h3>';
  html += '<p class="lead" style="margin-bottom:20px;">Mesmos meses do ano anterior lado a lado, com o valor de cada ano e a variação ao lado do gráfico — CMV, indicadores de saúde financeira e despesas por categoria. Use o botão "Comparativo 2025" para mostrar só 2026.</p>';

  html += finYoyRow('Cmv', 'chYoYCMV', 'CMV · 2025 vs 2026', 'Custo da mercadoria vendida (R$)');
  html += finYoyRow('Mc', 'chYoYMC', 'Margem de Contribuição · 2025 vs 2026', 'Em %');
  html += finYoyRow('Pe', 'chYoYPE', 'Ponto de Equilíbrio · 2025 vs 2026', 'Faturamento mínimo para não operar no vermelho (R$)');
  html += finYoyRow('DespAdm', 'chYoYDespAdm', 'Despesas Administrativas · 2025 vs 2026', 'R$ mensal');
  html += finYoyRow('DespPes', 'chYoYDespPes', 'Despesas com Pessoal · 2025 vs 2026', 'R$ mensal');
  html += finYoyRow('DespMkt', 'chYoYDespMkt', 'Despesas de Marketing e Vendas · 2025 vs 2026', 'R$ mensal');
  html += finYoyRow('DespFin', 'chYoYDespFin', 'Despesas Financeiras · 2025 vs 2026', 'R$ mensal');

  html += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  html += '</section></div>';
  return html;
}

/* Linha padrão de um gráfico comparativo 2025×2026 (Financeiro > Indicadores):
   chart-card com o gráfico + botão "Comparativo 2025" (ativo por padrão) e,
   ao lado, uma coluna de mini-cards com o valor de 2025, o de 2026 e a variação. */
function finYoyRow(key, canvasId, title, sub){
  const active = STATE.finYoyActive[key] !== false;
  return '<div class="fin-yoy-row'+(active?'':' yoy-off')+'" id="finYoyRow_'+key+'">'
    + '<div class="chart-card light fin-yoy-chart-card">'
      + '<div class="chart-card-header">'
        + '<div class="chart-card-title">'+title+'</div><div class="chart-card-sub">'+sub+'</div>'
        + '<button type="button" class="btn-comparativo'+(active?' active':'')+'" id="finYoyBtn_'+key+'" onclick="toggleFinYoY(\''+key+'\')">Comparativo 2025</button>'
      + '</div>'
      + '<div style="position:relative;height:300px;"><canvas id="'+canvasId+'"></canvas></div>'
    + '</div>'
    + '<div class="fin-yoy-cards" id="finYoyCards_'+key+'"></div>'
  + '</div>';
}

    {key:'inv_emprestimos', label:'Empréstimos', cls:'row-sub row-detail', neg:true, group:'inv'},
    {key:'inv_gerais', label:'Investimentos Gerais', cls:'row-sub row-detail', neg:true, group:'inv'},
    {key:'lucro_liquido', label:'(=) LUCRO LÍQUIDO', cls:'row-result', sintetico:true},
    {key:'distribuicao_lucros', label:'Distribuição de Lucros', cls:'row-major', neg:true, sintetico:true},
    {key:'excedente', label:'(=) EXCEDENTE', cls:'row-result row-major', sintetico:true}
  ];

  const mesesDRE = STATE.selectedMonths;
  const dreView = STATE.dreView || 'analitico';
  // No modo sintético, exibir apenas as linhas marcadas com sintetico:true
  // Linhas de detalhe zeradas em todos os meses selecionados não são exibidas.
  // Elas existem na DRE para receber lançamento futuro, mas poluem a tabela
  // enquanto estão vazias. Linhas sintéticas e totais aparecem sempre.
  const mesesSel = STATE.selectedMonths;
  const temValor = r => r.sintetico || !r.cls.includes('row-detail') ||
    mesesSel.some(m => Math.abs((SERIES[r.key] && SERIES[r.key][m]) || 0) > 0.005);
  const activeRows = (dreView === 'sintetico' ? rows.filter(r => r.sintetico) : rows).filter(temValor);
  const showAH = mesesDRE.length > 1;
  const labelAcum = mesesDRE.length === 1 ? 'Acumulado' : 'Acum. período';
  const labelMedia = mesesDRE.length === 1 ? '—' : 'Média/mês';

  let html = '<div class="dre-wrap'+(dreView==='sintetico'?' dre-sintetico':'')+'"><table class="dre">';
  html += '<thead><tr><th class="cat-th">Categoria</th>';
  mesesDRE.forEach(m => {
    html += '<th>'+m+'</th><th>AV%</th>';
    if (showAH) html += '<th class="month-end">AH%</th>';
  });
  html += '<th class="accum">'+labelAcum+'</th>';
  if (mesesDRE.length > 1) html += '<th class="accum">'+labelMedia+'</th>';
  html += '</tr></thead><tbody>';

  activeRows.forEach((r, idx) => {
    const isMajor = r.cls.includes('row-major');
    const isClickable = r.cls.includes('row-clickable');
    const collapseAttrs = isClickable ? ' data-group="'+r.group+'"' : (r.group && r.cls.includes('row-detail') ? ' data-detail-group="'+r.group+'"' : '');
    const drillAttrs = ' data-key="'+r.key+'" data-label="'+r.label.replace(/"/g,'&quot;')+'" data-cost="'+(!!r.neg)+'"';
    html += '<tr class="'+r.cls+' row-drill"'+collapseAttrs+drillAttrs+'><td class="cat-td">'+r.label+'</td>';
    mesesDRE.forEach((m, mi) => {
      const raw = (SERIES[r.key] && SERIES[r.key][m]) || 0;
      const v = r.neg ? -raw : raw;
      // AV%
      const rb = SERIES.receita_bruta[m];
      let av = rb ? (Math.abs(v) / rb) * 100 : null;
      if (r.key === 'receita_bruta') av = 100;
      html += '<td class="'+(v===0?'muted':'')+'">'+(v===0?'-':fmtBRL(v))+'</td>';
      html += '<td class="muted">'+(av===null||av===0?'-':fmtPct(av))+'</td>';
      // AH% — só renderiza se showAH
      if (showAH){
        let ah = null;
        if (mi > 0){
          const prevM = mesesDRE[mi-1];
          const rawPrev = (SERIES[r.key] && SERIES[r.key][prevM]) || 0;
          const vPrev = r.neg ? -rawPrev : rawPrev;
          if (vPrev !== 0) ah = ((v - vPrev) / Math.abs(vPrev)) * 100;
        }
        const ahClass = (ah === null || !isFinite(ah)) ? 'muted' : (ah > 1 ? 'pos' : (ah < -1 ? 'neg' : 'muted'));
        html += '<td class="'+ahClass+' month-end">'+(ah===null?'-':fmtPct(ah,{sign:true}))+'</td>';
      }
    });
    // Acumulado do período selecionado
    const acumPeriodo = mesesDRE.reduce((s,m) => {
      const raw = (SERIES[r.key] && SERIES[r.key][m]) || 0;
      return s + (r.neg ? -raw : raw);
    }, 0);
    html += '<td class="accum">'+(acumPeriodo===0?'-':fmtBRL(acumPeriodo))+'</td>';
    if (mesesDRE.length > 1){
      const mediaPeriodo = acumPeriodo / mesesDRE.length;
      html += '<td class="accum">'+(mediaPeriodo===0?'-':fmtBRL(mediaPeriodo))+'</td>';
    }
    html += '</tr>';
  });

  html += '</tbody></table></div>';
  return html;
}

function bindDRE(){
  // Colapsar/expandir grupos — clique no rótulo (cat-td) de uma linha agregadora.
  // Não se aplica no modo Sintético, que não tem sublinhas para expandir.
  if ((STATE.dreView || 'analitico') !== 'sintetico'){
    document.querySelectorAll('table.dre tr.row-clickable').forEach(tr => {
      tr.addEventListener('click', (ev) => {
        if (!ev.target.closest('td.cat-td')) return;
        const grp = tr.dataset.group;
        const willCollapse = !tr.classList.contains('collapsed');
        tr.classList.toggle('collapsed', willCollapse);
        document.querySelectorAll('table.dre tr[data-detail-group="'+grp+'"]').forEach(d => {
          d.classList.toggle('hide-collapsed', willCollapse);
        });
      });
    });
  }
  // Drill-down: clique em qualquer linha abre o popup com a evolução daquela conta.
  // Exceção: clique no rótulo (cat-td) de uma linha agregadora colapsável — aí só colapsa/expande.
  document.querySelectorAll('table.dre tr.row-drill').forEach(tr => {
    tr.addEventListener('click', (ev) => {
      const onCatTd = ev.target.closest('td.cat-td');
      if (onCatTd && tr.classList.contains('row-clickable')) return;
      const key = tr.dataset.key, label = tr.dataset.label, isCost = tr.dataset.cost === 'true';
      if (key) openDreDrillModal(key, label, isCost);
    });
  });
}

/* Toggle do botão "Comparativo 2025": alterna entre mostrar 2025×2026 (com cards)
   e mostrar só a barra de 2026 (gráfico ocupa a linha inteira, sem os cards). */
/* Mini-card de valor (2025 ou 2026) usado ao lado dos gráficos comparativos do Financeiro */
function yoyMiniCard(label, value, deltaHtml){
  return '<div class="kpi-card light"><div class="kpi-label">'+label+'</div><div class="kpi-value">'+value+'</div>'+(deltaHtml||'')+'</div>';
}
/* Chip de variação % vs 2025 — verde quando favorável, vermelho quando desfavorável.
   invertido=true para métricas onde CAIR é bom (custos/despesas/ponto de equilíbrio);
   invertido=false onde SUBIR é bom (ex.: Margem de Contribuição). */
function yoyDeltaChip(deltaPct, invertido){
  if (deltaPct === null || deltaPct === undefined || isNaN(deltaPct) || !isFinite(deltaPct)) return '';
  const favoravel = invertido ? deltaPct < -0.5 : deltaPct > 0.5;
  const desfavoravel = invertido ? deltaPct > 0.5 : deltaPct < -0.5;
  const cls = favoravel ? 'pos' : (desfavoravel ? 'neg' : 'neu');
  const arrow = deltaPct > 0.5 ? '▲' : (deltaPct < -0.5 ? '▼' : '•');
  return '<div class="yoy-delta-chip '+cls+'">'+arrow+' '+fmtPct(Math.abs(deltaPct))+' vs 2025</div>';
}

function toggleFinYoY(key){

function finYoYBarOpts(yCallback){
  return {
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{ position:'bottom', labels:{ color:NP_COLORS.navy, font:{size:11, family:'Montserrat'}, boxWidth:12, usePointStyle:true, padding:12 } },
      tooltip:{ backgroundColor:NP_COLORS.navy, titleColor:NP_COLORS.mint, bodyColor:'#fff', padding:11, cornerRadius:4,

    },
    scales:{

function makeFinYoYLabelPlugin(fmtFn){
  return {
    id:'finYoYLabels',
    afterDatasetsDraw:function(chart){
      const ctx = chart.ctx;
      chart.data.datasets.forEach(function(ds, di){
        const meta = chart.getDatasetMeta(di);
        if (meta.hidden) return;
        meta.data.forEach(function(bar, i){
          const val = ds.data[i];
          if (val == null || val === 0) return;
          ctx.save();
          ctx.font = '700 12px Montserrat,sans-serif';
          ctx.fillStyle = NP_COLORS.navy;
          ctx.textAlign = 'center';
          ctx.textBaseline = val < 0 ? 'top' : 'bottom';
          ctx.fillText(fmtFn(val), bar.x, bar.y + (val < 0 ? 6 : -6));
          ctx.restore();
        });
      });
    }
  };
}

/* ══════════════════════════════════════════════════════════════════════
   DFC — MODAL DE DRILL-DOWN (popup ao clicar numa linha da tabela DRE/DFC)
   ══════════════════════════════════════════════════════════════════════ */
const MESES_ABREV_DRILL = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
window._dreDrill = { key:null, label:null, isCost:false, view:'prog', months:[], gridOpen:false };
window._dreDrillChart = null;

function _drillFmtV(v){
  if (v === null || v === undefined) return '—';
  const s = v < 0 ? '-' : ''; const a = Math.abs(v);
  if (a >= 1e6) return s+'R$ '+(a/1e6).toFixed(2)+'M';
  if (a >= 1e3) return s+'R$ '+(a/1e3).toFixed(1)+'k';
  return s+'R$ '+a.toFixed(0);
}

function openDreDrillModal(key, label, isCost){
  window._dreDrill = { key, label, isCost, view:'prog', months:[...MESES], gridOpen:false };
  document.getElementById('dreDrillTitle').textContent = label;
  document.getElementById('dreDrillSub').textContent = 'Evolução mensal · comparativo com 2025';
  document.getElementById('dreDrillModal').classList.add('open');
  document.getElementById('dreDrillMvProg').classList.add('active');
  document.getElementById('dreDrillMvComp').classList.remove('active');
  _renderDreDrillPeriod();
  _renderDreDrillChart();
}
function closeDreDrillModal(){
  document.getElementById('dreDrillModal').classList.remove('open');
  if (window._dreDrillChart){ window._dreDrillChart.destroy(); window._dreDrillChart = null; }
}
function _dreDrillPresets(){
  const all = MESES;
  return [
    {id:'atual', label: all[all.length-1], months:[all[all.length-1]]},
    {id:'u3',    label:'Últimos 3m', months: all.slice(-3)},
    {id:'ytd26', label:'2026 (YTD)', months: all.filter(m=>m.endsWith('/26'))},
    {id:'todos', label:'Todos',      months: all}
  ];
}
function _renderDreDrillPeriod(){
  const el = document.getElementById('dreDrillPeriod'); if (!el) return;
  const sel = window._dreDrill.months;
  const same = (a,b) => a.length===b.length && a.every((x,i)=>x===b[i]);
  const activePreset = _dreDrillPresets().find(p => same(sel, p.months));
  const presets = _dreDrillPresets().map(p =>
    '<button class="mp-chip'+(activePreset && activePreset.id===p.id ? ' active':'')+'" onclick="setDreDrillPreset(\''+p.id+'\')">'+p.label+'</button>'
  ).join('');
  const gridOpen = window._dreDrill.gridOpen;
  const grid = MESES.map(m =>
    '<button class="mp-cell'+((sel.length===1 && sel[0]===m) ? ' active':'')+'" onclick="setDreDrillMonth(\''+m+'\')">'+m+'</button>'
  ).join('');
  el.innerHTML = '<div class="mp-row"><span class="mp-lbl">Período</span>'+presets
    +'<button class="mp-chip'+(!activePreset ? ' active':'')+'" onclick="toggleDreDrillGrid()">Mês específico</button></div>'
    +'<div class="mp-grid'+(gridOpen?'':' hidden')+'">'+grid+'</div>';
}
function toggleDreDrillGrid(){ window._dreDrill.gridOpen = !window._dreDrill.gridOpen; _renderDreDrillPeriod(); }
function setDreDrillPreset(id){
  const p = _dreDrillPresets().find(x=>x.id===id); if (!p) return;
  window._dreDrill.months = [...p.months]; window._dreDrill.gridOpen = false;
  _renderDreDrillPeriod(); _renderDreDrillChart();
}
function setDreDrillMonth(m){
  window._dreDrill.months = [m];
  _renderDreDrillPeriod(); _renderDreDrillChart();
}
function setDreDrillView(view){
  window._dreDrill.view = view;
  document.getElementById('dreDrillMvProg').classList.toggle('active', view==='prog');
  document.getElementById('dreDrillMvComp').classList.toggle('active', view==='comp');
  _renderDreDrillChart();
}
function _renderDreDrillChart(){
  const st = window._dreDrill;
  const key = st.key;
  if (window._dreDrillChart){ window._dreDrillChart.destroy(); window._dreDrillChart = null; }

  if (st.view === 'prog'){
    const labels = st.months;
    const vals = labels.map(m => (SERIES[key] && SERIES[key][m] !== undefined) ? SERIES[key][m] : null);
    const single = labels.length === 1;
    window._dreDrillChart = new Chart(document.getElementById('dreDrillChart'), {
      type:'line',
      data:{ labels, datasets:[
        { label: st.label, data: vals, borderColor: NP_COLORS.tealDeep, backgroundColor: NP_COLORS.tealDeep+'22', borderWidth:3, tension:.3, pointRadius: single?6:4, pointBackgroundColor: NP_COLORS.tealDeep, fill:true }
      ]},
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index', intersect:false},
        plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>_drillFmtV(c.parsed.y)}} },
        scales:{
          y:{ ticks:{ color:'rgba(224,238,231,.75)', callback:v=>_drillFmtV(v) }, grid:{ color:'rgba(224,238,231,.1)' } },
          x:{ ticks:{ color:'rgba(224,238,231,.75)' }, grid:{ display:false } }
        }
      }
    });
    const idxs = vals.map((v,i)=>i).filter(i=>vals[i]!=null);
    const arr = idxs.map(i=>vals[i]);
    const tot = arr.reduce((a,b)=>a+b,0);
    const media = arr.length ? tot/arr.length : 0;
    const first = idxs.length ? vals[idxs[0]] : null;
    const last = idxs.length ? vals[idxs[idxs.length-1]] : null;
    const growth = (first!=null && last!=null && first!==0) ? ((last-first)/Math.abs(first)*100) : null;
    const gGood = growth==null ? null : (st.isCost ? growth<0 : growth>0);
    const fromM = idxs.length ? labels[idxs[0]] : '', toM = idxs.length ? labels[idxs[idxs.length-1]] : '';
    document.getElementById('dreDrillKpis').innerHTML = [
      single ? '' : '<div class="m-kpi'+(growth==null?'':(gGood?' ok':' bad'))+'"><div class="m-kl">Variação no período</div><div class="m-kv">'+(growth!=null ? (growth>=0?'▲ ':'▼ ')+Math.abs(growth).toFixed(1)+'%' : '—')+'</div><div class="m-ks">'+fromM+' → '+toM+'</div></div>',
      '<div class="m-kpi"><div class="m-kl">'+(single?'Valor no mês':'Acumulado no período')+'</div><div class="m-kv">'+_drillFmtV(tot)+'</div><div class="m-ks">'+arr.length+' '+(arr.length===1?'mês':'meses')+'</div></div>',
      single ? '' : '<div class="m-kpi"><div class="m-kl">Média mensal</div><div class="m-kv">'+_drillFmtV(media)+'</div></div>'
    ].filter(Boolean).join('');
  } else {
    // Comparativo 2026 vs 2025 (mesmo mês) — apenas meses com par nos dois anos,
    // respeitando o período escolhido no seletor (Últimos 3m / YTD / Todos / mês específico).
    const pairable = MESES_ABREV_DRILL.filter(mm => MESES.includes(mm+'/26') && MESES.includes(mm+'/25'));
    const selAbrevs = [...new Set(st.months.map(m => m.slice(0, m.lastIndexOf('/'))))];
    let labels = pairable.filter(mm => selAbrevs.includes(mm));
    let semParNota = '';
    if (labels.length === 0){
      labels = pairable;
      semParNota = 'O período selecionado não tem par em 2025 — exibindo todos os meses comparáveis (Jan–Mai).';
    }
    const v26 = labels.map(mm => (SERIES[key] && SERIES[key][mm+'/26'] !== undefined) ? SERIES[key][mm+'/26'] : null);
    const v25 = labels.map(mm => (SERIES[key] && SERIES[key][mm+'/25'] !== undefined) ? SERIES[key][mm+'/25'] : null);
    const single = labels.length === 1;
    window._dreDrillChart = new Chart(document.getElementById('dreDrillChart'), {
      type:'line',
      data:{ labels, datasets:[
        { label:'2026', data:v26, borderColor: NP_COLORS.tealDeep, backgroundColor:'transparent', borderWidth:3, tension:.3, pointRadius: single?6:4, pointBackgroundColor: NP_COLORS.tealDeep, fill:false },
        { label:'2025', data:v25, borderColor: NP_COLORS.blueMid, borderDash:[5,4], borderWidth:2, tension:.3, pointRadius: single?5:3, pointBackgroundColor: NP_COLORS.blueMid, fill:false }
      ]},
      options:{
        responsive:true, maintainAspectRatio:false,
        interaction:{mode:'index', intersect:false},
        plugins:{ legend:{ position:'bottom', labels:{ boxWidth:12, padding:10, usePointStyle:true, color:'rgba(224,238,231,.92)', font:{size:11,family:"'Montserrat', sans-serif"} } }, tooltip:{callbacks:{label:c=>c.dataset.label+': '+_drillFmtV(c.parsed.y)}} },
        scales:{
          y:{ ticks:{ color:'rgba(224,238,231,.75)', callback:v=>_drillFmtV(v) }, grid:{ color:'rgba(224,238,231,.1)' } },
          x:{ ticks:{ color:'rgba(224,238,231,.75)' }, grid:{ display:false } }
        }
      }
    });
    const validIdx = v26.map((_,i)=>i).filter(i => v25[i]!=null && v26[i]!=null);
    const tot26 = validIdx.reduce((a,i)=>a+(v26[i]||0),0);
    const tot25 = validIdx.reduce((a,i)=>a+(v25[i]||0),0);
    const pct = tot25 ? ((tot26-tot25)/Math.abs(tot25)*100) : null;
    const good = pct==null ? null : (st.isCost ? pct<0 : pct>0);
    document.getElementById('dreDrillKpis').innerHTML =
      '<div class="m-kpi"><div class="m-kl">Total 2026</div><div class="m-kv">'+_drillFmtV(tot26)+'</div></div>'
      +'<div class="m-kpi"><div class="m-kl">Total 2025</div><div class="m-kv">'+_drillFmtV(tot25)+'</div></div>'
      +'<div class="m-kpi'+(pct==null?'':(good?' ok':' bad'))+'"><div class="m-kl">Variação Ano a Ano</div><div class="m-kv">'+(pct!=null ? (pct>=0?'▲ ':'▼ ')+Math.abs(pct).toFixed(1)+'%' : '—')+'</div></div>'
      +(semParNota ? '<div class="m-kpi-note">'+semParNota+'</div>' : '');
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDreDrillModal(); });
