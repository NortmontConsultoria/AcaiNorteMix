 * PAINEL · Financeiro · Inadimplência  ·  Açaí Norte Mix
 * Aba nova sob "02 Financeiro". Posição da carteira de recebíveis por
 * data de vencimento; NÃO acompanha o seletor de período das outras abas.
 * Dados: __INAD__ (embutido), sobrescrito pela aba "Inadimplência" da
 * planilha quando o backend passar a devolvê-la.
 * ========================================================================== */

const INAD_FX_COLOR = {
  'A vencer':'#3F598C','1-15':'#A8CCA8','16-30':'#C58B2A','31-60':'#C58B2A',
  '61-90':'#B33A3A','91-180':'#B33A3A','180+':'#7A2525'
};
const INAD_FX_LABEL = {
  'A vencer':'A vencer','1-15':'1 a 15 dias','16-30':'16 a 30 dias','31-60':'31 a 60 dias',
  '61-90':'61 a 90 dias','91-180':'91 a 180 dias','180+':'Mais de 180 dias'
};

function inadAcao(dmax){
  if (dmax > 180) return ['bad','Perda provável'];
  if (dmax > 90)  return ['bad','Negociar'];
  if (dmax > 30)  return ['warn','Cobrança ativa'];
  return ['ok','Amigável'];
}
function inadProvisao(){
  const P = {'61-90':0.25,'91-180':0.50,'180+':1.00};
  return (__INAD__.aging||[]).reduce((s,a)=> s + (P[a.faixa]||0)*a.valor, 0);
}

function inadLista(){
  // Títulos com saldo zerado (baixa parcial, diferença de arredondamento) não
  // são inadimplência: entram no relatório do ERP mas não devem ser cobrados.
  return (__INAD__.inad || []).filter(function(c){ return (c.valor || 0) > 0.005; });
}

function renderFinInadimplencia(){
  const T = __INAD__.tot, A = __INAD__.aging, M = __INAD__.mensal;
  const LISTA = inadLista();
  const PROV = inadProvisao();
  const pctRec = T.recebido/T.carteira*100, pctAb = T.aberto/T.carteira*100, pctInad = T.inad/T.carteira*100;

  let h = '<div class="tab-panel active"><section class="page light">';

  h += '<div class="section-header"><div>';
  h += '<div class="pill" style="margin-bottom:18px;color:var(--navy);"><span class="pill-num">02</span> · Financeiro · Inadimplência</div>';
  h += '<h2 class="title-xl">Carteira de <u>recebíveis</u></h2>';
  h += '<p class="lead" style="color:var(--text-on-light-muted);">Posição em <strong>'+__INAD__.data_base+'</strong>, por data de vencimento. '
     + fmtInt(T.titulos)+' títulos de '+fmtInt(T.clientes)+' clientes. Esta aba não segue o seletor de período.</p>';
  h += '</div></div><hr class="np-divider">';

  /* KPIs: 4 por linha para o valor não truncar */
  h += '<div class="grid-4" style="margin-bottom:14px;">';
  h += kpiCardLight('Carteira do período', fmtBRLshort(T.carteira), null, null,
        fmtInt(T.titulos)+' títulos · '+fmtInt(T.clientes)+' clientes');
  h += kpiCardLight('Recebido', fmtPct(pctRec), null, null, fmtBRLshort(T.recebido));
  h += kpiCardLight('Em aberto', fmtBRLshort(T.aberto), null, null, fmtPct(pctAb)+' da carteira');
  h += kpiCardLight('Inadimplência efetiva', fmtBRLshort(T.inad), null, null,
        fmtPct(pctInad)+' da carteira · '+LISTA.length+' clientes');
  h += '</div>';

  h += '<div class="insight-card light" style="margin-bottom:24px;">';
  h += '<div class="insight-label">Como ler estes números</div>';
  h += '<div class="insight-text">Título vencido não é o mesmo que inadimplência. <strong>'+fmtPct(T.em_dia_pct)
     + ' do valor é pago em dia</strong>, '+fmtPct(T.ate15)+' em até 15 dias, com atraso médio de '
     + String(T.atraso_medio).replace('.',',')+' dia. Por isso a faixa de 1 a 15 dias entra como cobrança corrente, '
     + 'e a inadimplência começa a contar a partir de 16 dias.</div></div>';

  /* AGING */
  h += '<h3 class="section-title">Aging da carteira em aberto</h3>';
  h += '<div class="grid-2" style="align-items:start;margin-bottom:24px;">';
  h += '<div class="chart-card light"><div class="chart-card-title" style="padding:16px 18px 4px;">Distribuição por faixa de atraso</div>'
     + '<div class="chart-card-sub" style="padding:0 18px 16px;">Valor em aberto por faixa, R$</div>'
     + '<div style="position:relative;height:330px;padding:0 18px 18px;"><canvas id="chInadAging"></canvas></div></div>';
  h += '<div class="chart-card light" style="padding:0;"><table class="abc-table"><thead><tr>'
     + '<th class="abc-name">Faixa</th><th>Títulos</th><th>Clientes</th><th>Valor</th><th>% aberto</th>'
     + '</tr></thead><tbody>';
  A.forEach(function(a){
    h += '<tr><td class="abc-name">'+(INAD_FX_LABEL[a.faixa]||a.faixa)+'</td>'
       + '<td>'+fmtInt(a.qtd)+'</td><td>'+fmtInt(a.clientes)+'</td>'
       + '<td>'+fmtBRL(a.valor)+'</td><td>'+fmtPct(a.valor/T.aberto*100)+'</td></tr>';
  });
  h += '<tr style="font-weight:700;background:rgba(1,30,60,.04);"><td class="abc-name">Total</td>'
     + '<td>'+fmtInt(A.reduce((s,a)=>s+a.qtd,0))+'</td><td></td><td>'+fmtBRL(T.aberto)+'</td><td>100,0%</td></tr>';
  h += '</tbody></table></div></div>';

  /* RESÍDUO MENSAL */
  h += '<h3 class="section-title">Resíduo em aberto por mês de vencimento</h3>';
  const ultMes = M.length ? M[M.length-1].mes : '';
  h += '<div class="insight-card light" style="margin-bottom:14px;"><div class="insight-label">Como ler</div>';
  h += '<div class="insight-text">Barra: quanto ainda não foi pago dos títulos que venceram no mês. '
     + 'Linha: esse valor em percentual do que foi emitido. Meses antigos tiveram mais tempo para receber, '
     + 'por isso ficam perto de zero. '+ultMes+' está em curso e aparece em tom claro: muitos títulos ainda nem venceram.</div></div>';
  h += '<div class="chart-card light" style="margin-bottom:24px;"><div class="chart-card-title" style="padding:16px 18px 4px;">Valor em aberto por mês de vencimento</div>'
     + '<div class="chart-card-sub" style="padding:0 18px 16px;">Barras: R$ em aberto · Linha: % do total emitido no mês · '+ultMes+' em curso</div>'
     + '<div style="position:relative;height:320px;padding:0 18px 18px;"><canvas id="chInadMensal"></canvas></div></div>';

  /* INADIMPLENTES */
  h += '<h3 class="section-title">Clientes inadimplentes · atraso acima de 15 dias</h3>';
  h += '<div class="chart-card light" style="padding:0;margin-bottom:24px;"><table class="abc-table"><thead><tr>'
     + '<th>#</th><th class="abc-name">Cliente</th><th>Títulos</th><th>Vencido</th>'
     + '<th>Atraso máx.</th><th>Faixa</th><th>Última compra</th><th>Ação</th>'
     + '</tr></thead><tbody>';
  LISTA.forEach(function(c,i){
    const a = inadAcao(c.dmax);
    h += '<tr><td>'+(i+1)+'</td><td class="abc-name">'+c.nome.replace(/\s+/g,' ').trim()+'</td>'
       + '<td>'+c.qtd+'</td><td>'+fmtBRL(c.valor)+'</td>'
       + '<td>'+c.dmax+' d</td><td>'+(INAD_FX_LABEL[c.faixa]||c.faixa)+'</td>'
       + '<td>'+(c.ult_compra||'')+'</td>'
       + '<td><span class="np-badge '+a[0]+'">'+a[1]+'</span></td></tr>';
  });
  h += '</tbody></table></div>';

  /* COBRANÇA CORRENTE */
  h += '<h3 class="section-title">Cobrança corrente · vencidos há até 15 dias</h3>';
  h += '<div class="insight-card light" style="margin-bottom:14px;"><div class="insight-label">'
     + fmtBRL(__INAD__.corrente_total)+' · '+__INAD__.corrente_qtd+' títulos · '+__INAD__.corrente_cli+' clientes</div>';
  h += '<div class="insight-text">Faixa de comportamento normal da carteira, não de inadimplência. '
     + 'Os 12 maiores estão abaixo; os demais '+__INAD__.corrente_resto_cli+' clientes somam '
     + fmtBRL(__INAD__.corrente_resto)+'.</div></div>';
  h += '<div class="chart-card light" style="padding:0;margin-bottom:24px;"><table class="abc-table"><thead><tr>'
     + '<th>#</th><th class="abc-name">Cliente</th><th>Títulos</th><th>Valor</th><th>Atraso máx.</th>'
     + '</tr></thead><tbody>';
  __INAD__.corrente.forEach(function(c,i){
    h += '<tr><td>'+(i+1)+'</td><td class="abc-name">'+c.nome.replace(/\s+/g,' ').trim()+'</td><td>'+c.qtd+'</td>'
       + '<td>'+fmtBRL(c.valor)+'</td><td>'+c.dmax+' d</td></tr>';
  });
  h += '</tbody></table></div>';

  /* PROVISÃO */
  h += '<h3 class="section-title">Provisão para perdas · critério sugerido</h3>';
  h += '<div class="grid-2" style="align-items:start;margin-bottom:24px;">';
  h += '<div class="chart-card light" style="padding:0;"><table class="abc-table"><thead><tr>'
     + '<th class="abc-name">Faixa</th><th>Em aberto</th><th>% provisão</th><th>Provisão</th>'
     + '</tr></thead><tbody>';
  const PCT = {'61-90':0.25,'91-180':0.50,'180+':1.00};
  A.filter(a=>PCT[a.faixa]).forEach(function(a){
    h += '<tr><td class="abc-name">'+(INAD_FX_LABEL[a.faixa]||a.faixa)+'</td>'
       + '<td>'+fmtBRL(a.valor)+'</td><td>'+fmtPct(PCT[a.faixa]*100,{decimals:0})+'</td>'
       + '<td>'+fmtBRL(PCT[a.faixa]*a.valor)+'</td></tr>';
  });
  h += '<tr style="font-weight:700;background:rgba(1,30,60,.04);"><td class="abc-name">Total</td><td></td><td></td><td>'
     + fmtBRL(PROV)+'</td></tr></tbody></table></div>';
  h += '<div class="insight-card light"><div class="insight-label">Provisão sugerida · '+fmtBRL(PROV)+'</div>';
  h += '<div class="insight-text">Escalonada por faixa: 25% acima de 60 dias, 50% acima de 90 e 100% acima de 180. '
     + 'Equivale a '+fmtPct(PROV/T.carteira*100,{decimals:2})+' da carteira do período. '
     + 'É um critério de prudência, não uma baixa contábil. O título continua cobrável.</div></div>';
  h += '</div>';

  h += '</section></div>';
  return h;
}

/* ============ FINANCEIRO · SUB-ABA "ORÇAMENTO" ============ */
function renderFinOrcamento(){
  let h = '<div class="tab-panel active"><section class="page light">';
  h += '<div class="section-header"><div>';
  h += '<div class="pill" style="margin-bottom:18px;color:var(--navy);"><span class="pill-num">02</span> · Financeiro · Orçamento</div>';
  h += '<h2 class="title-xl">Orçamento<br>e <u>caixa projetado</u></h2>';

  const R = ORC.garantir() ? ORC.calcular() : null;

  if (!R) {
    h += '<p class="lead" style="color:var(--text-on-light-muted);">As premissas do orçamento ainda não foram encontradas na planilha.</p>';
    h += '</div></div><hr class="np-divider">';
    h += '<div class="insight-card light" style="border-left:3px solid var(--warning,#f59e0b);">';
    h += '<div class="insight-label" style="color:var(--warning,#f59e0b);">Premissas não disponíveis</div>';
    h += '<div class="insight-text">Esta aba lê três abas da planilha: <strong>Orçamento Parâmetros</strong>, '
       + '<strong>Orçamento Mensal</strong> e <strong>Orçamento Itens</strong>. Enquanto elas não existirem, '
       + 'ou enquanto o painel estiver rodando com os dados embutidos em vez dos dados ao vivo, não há o que projetar.</div></div>';
    h += '</section></div>';
    return h;
  }

  const P = R.P, proj = R.proj;
  if (!proj.length) {
    h += '<p class="lead" style="color:var(--text-on-light-muted);">Todos os meses orçados já foram fechados no financeiro.</p>';
    h += '</div></div><hr class="np-divider">';
    h += '<div class="insight-card light"><div class="insight-label">Orçamento encerrado</div>';
    h += '<div class="insight-text">Os meses ' + R.jaFechados.join(', ') + ' saíram da projeção porque já têm '
       + 'Receita Bruta lançada na DRE. Para projetar um período novo, acrescente os meses na aba '
       + '<strong>Orçamento Mensal</strong> da planilha.</div></div>';
    h += '</section></div>';
    return h;
  }

  /* --- números do período --------------------------------------------- */
  const soma = f => proj.reduce((s,m) => s + f(P[m]), 0);
  const rbProj  = soma(p => p.rb);
  const loProj  = soma(p => p.lo);
  const capex   = soma(p => p.capex);
  const estoq   = soma(p => p.estoq);
  const cmvProj = soma(p => p.cmv);
  const saldoFim = P[proj[proj.length-1]].saldoFim;
  let minSaldo = Infinity, minMes = proj[0];
  proj.forEach(m => { if (P[m].saldoFim < minSaldo){ minSaldo = P[m].saldoFim; minMes = m; } });
  const ncg = ORC.p('Capital de giro mínimo (NCG)');

  // realizado sai da própria DRE — nunca de uma cópia
  const mesesReal = MESES.filter(m => m.endsWith('/'+proj[0].split('/')[1]) && SERIES.receita_bruta[m] > 0);
  const rbReal = mesesReal.reduce((s,m) => s + (SERIES.receita_bruta[m]||0), 0);

  h += '<p class="lead" style="color:var(--text-on-light-muted);">Projeção de <strong>'+proj[0]+' a '+proj[proj.length-1]+'</strong>. '
     + 'O realizado vem da DRE; a projeção, das premissas da planilha. '
     + (R.jaFechados.length ? 'Os meses '+R.jaFechados.join(', ')+' já foram fechados e saíram da projeção automaticamente. ' : '')
     + 'Esta aba não segue o seletor de período.</p>';
  h += '</div></div><hr class="np-divider">';

  /* --- KPIs ------------------------------------------------------------ */
  h += '<h3 class="section-title">Resumo</h3>';
  h += '<div class="grid-3" style="margin-bottom:14px;">';
  h += kpiCardLight('Receita bruta do ano', fmtBRLk(rbReal + rbProj),
        mesesReal.length+' meses realizados + '+proj.length+' projetados', 'neu');
  h += kpiCardLight('Resultado operacional projetado', fmtBRLk(loProj),
        'antes de investimentos', loProj >= 0 ? 'pos' : 'neg');
  h += kpiCardLight('Caixa ao fim do período', fmtBRLk(saldoFim),
        'após Pronampe e investimentos', saldoFim >= 0 ? 'pos' : 'neg');
  h += '</div>';
  h += '<div class="grid-3" style="margin-bottom:24px;">';
  h += kpiCardLight('CAPEX projetado', fmtBRLk(capex), 'investimentos do período', 'neu');
  h += kpiCardLight('Antecipação de estoque', fmtBRLk(estoq), 'desembolso com insumos', 'neu');
  h += kpiCardLight('Menor saldo do período', fmtBRLk(minSaldo), 'em '+minMes,
        minSaldo < ncg ? 'neg' : 'pos');
  h += '</div>';

  /* --- alertas --------------------------------------------------------- */
  h += '<h3 class="section-title">Alertas</h3>';
  const alerta = (cor, txt) =>
    '<div class="insight-card light" style="margin-bottom:10px;border-left:3px solid '+cor+';">'
    + '<div class="insight-text">'+txt+'</div></div>';
  const VERM = 'var(--danger,#8f2a2a)', AMAR = 'var(--warning,#f59e0b)', VERD = 'var(--success,#1e6a4f)';

  if (minSaldo < 0) {
    h += alerta(VERM, '<strong>Caixa negativo em '+minMes+'.</strong> O plano atual leva o saldo a '
       + fmtBRL(minSaldo)+'. É preciso escalonar a compra de açaí ou adiar parte do CAPEX.');
  } else if (minSaldo < ncg) {
    h += alerta(AMAR, '<strong>Caixa abaixo do capital de giro mínimo em '+minMes+'.</strong> O saldo cai para '
       + fmtBRL(minSaldo)+' contra os '+fmtBRL(ncg)+' definidos como piso. Sem folga para imprevisto no pior mês.');
  } else {
    h += alerta(VERD, '<strong>Caixa preservado o período todo.</strong> O menor saldo é '
       + fmtBRL(minSaldo)+' em '+minMes+', acima do piso de '+fmtBRL(ncg)+'.');
  }

  // itens de investimento sem valor orçado
  const porItem = {};
  ORC.itens.filter(i => i.tipo === 'Investimento' && proj.indexOf(i.mes) >= 0)
    .forEach(i => { porItem[i.item] = (porItem[i.item]||0) + i.valorMes; });
  const pendentes = Object.keys(porItem).filter(k => porItem[k] === 0);
  if (pendentes.length) {
    h += alerta(AMAR, '<strong>'+pendentes.length+' itens de investimento sem valor orçado:</strong> '
       + pendentes.join(', ') + '. Enquanto não entrarem, o CAPEX projetado está subestimado.');
  }

  /* Quando um mês orçado é fechado, a projeção passa a começar no mês seguinte —
     mas o "Saldo inicial de caixa" da planilha continua apontando para o mês
     antigo. Sem este aviso, a curva inteira ficaria errada em silêncio. */
  if (R.jaFechados.length) {
    h += alerta(VERM, '<strong>Confira o saldo inicial de caixa.</strong> '
       + R.jaFechados.join(', ') + ' já foi fechado no financeiro, então a projeção agora começa em '
       + proj[0] + '. O parâmetro <em>Saldo inicial de caixa</em> na planilha está em '
       + fmtBRL(ORC.p('Saldo inicial de caixa')) + ' — se ele ainda se refere ao mês antigo, '
       + 'toda a curva de caixa abaixo está deslocada. Atualize-o para a posição real no primeiro dia de '
       + proj[0] + '.');
  }

  if (estoq > cmvProj) {
    h += alerta(AMAR, '<strong>Descasamento entre compra e consumo:</strong> o desembolso com insumos no período é de '
       + fmtBRL(estoq)+' contra '+fmtBRL(cmvProj)+' de CMV por competência. A diferença de '
       + fmtBRL(estoq - cmvProj)+' é estoque que sai do caixa agora e só vira custo depois.');
  }
  h += '<hr class="np-divider">';

  /* --- gráficos -------------------------------------------------------- */
  h += '<h3 class="section-title">Receita e curva de caixa</h3>';
  h += '<div class="chart-card light" style="margin-bottom:24px;">'
     + '<div class="chart-card-title">Receita bruta · realizado × projetado</div>'
     + '<div class="chart-card-sub">Escuro: fechado na DRE · Claro: projetado a partir das premissas</div>'
     + '<div style="position:relative;height:420px;"><canvas id="chOrcRec"></canvas></div></div>';
  h += '<div class="chart-card light" style="margin-bottom:36px;">'
     + '<div class="chart-card-title">Saldo de caixa projetado</div>'
     + '<div class="chart-card-sub">Linha tracejada: capital de giro mínimo de '+fmtBRLk(ncg)+'</div>'
     + '<div style="position:relative;height:420px;"><canvas id="chOrcCx"></canvas></div></div>';
  h += '<hr class="np-divider">';

  /* --- fluxo de caixa -------------------------------------------------- */
  h += '<h3 class="section-title">Fluxo de caixa projetado</h3>';
  h += '<p class="lead" style="margin-bottom:20px;color:var(--text-on-light-muted);">Parte da receita bruta e desconta os '
     + 'desembolsos efetivos do período, incluindo a antecipação de estoque e o CAPEX.</p>';

  const LINHAS = [
    ['Saldo inicial',                    m => P[m].saldoIni,  'row-major',  'ini'],
    ['(+) Receita bruta',                m => P[m].rb,        ''],
    ['(−) Impostos',                     m => -P[m].imp,      'row-sub'],
    ['(−) Compra de estoque e insumos',  m => -P[m].estoq,    'row-sub'],
    ['(−) Despesas operacionais',        m => -P[m].dop,      'row-sub'],
    ['(=) CAIXA OPERACIONAL',            m => P[m].cxOper,    'row-result'],
    ['(+) Pronampe líquido',             m => P[m].rnop,      ''],
    ['(−) Investimentos (CAPEX)',        m => -P[m].capex,    ''],
    ['(−) Serviço da dívida',            m => -P[m].emp,      ''],
    ['(−) Distribuição de lucros',       m => -P[m].dist,     ''],
    ['(=) GERAÇÃO DE CAIXA',             m => P[m].ger,       'row-result'],
    ['SALDO FINAL',                      m => P[m].saldoFim,  'row-major',  'fim']
  ];

  h += '<div class="dre-wrap"><table class="dre"><thead><tr><th class="cat-th">Fluxo de caixa</th>';
  proj.forEach(m => h += '<th>'+m+'</th>');
  h += '<th class="accum">Total</th></tr></thead><tbody>';
  LINHAS.forEach(([lbl, fn, cls, tipoTot]) => {
    const vals = proj.map(fn);
    // saldos são posição, não fluxo: não podem ser somados na coluna Total
    const tot = tipoTot === 'ini' ? vals[0]
              : tipoTot === 'fim' ? vals[vals.length-1]
              : vals.reduce((a,b) => a+b, 0);
    h += '<tr class="'+(cls||'')+'"><td class="cat-td">'+lbl+'</td>';
    vals.forEach(v => h += '<td class="'+(v<0?'neg':(v===0?'muted':''))+'">'+(v===0?'-':fmtBRL(v))+'</td>');
    h += '<td class="accum">'+fmtBRL(tot)+'</td></tr>';
  });
  h += '</tbody></table></div>';

  h += '<div style="margin-top:20px;padding:14px 18px;background:rgba(1,30,60,.04);border-radius:6px;font-size:12px;color:var(--text-on-light-muted);line-height:1.6;">';
  h += '<strong style="color:var(--navy);">Como ler:</strong> Saldo inicial e Saldo final são posição, não fluxo — '
     + 'por isso a coluna Total traz o saldo de abertura do primeiro mês e o de fechamento do último, e não uma soma. '
     + 'As premissas ficam nas abas <strong>Orçamento Parâmetros</strong>, <strong>Orçamento Mensal</strong> e '
     + '<strong>Orçamento Itens</strong> da planilha; alterá-las lá atualiza esta tela. '
     + 'Um mês sai da projeção assim que ganha Receita Bruta na DRE.</div>';

  h += '<div class="np-footer"><span>Nortmont · Consultoria em Negócios</span><span>Açaí Norte Mix · Fechamento Mensal</span></div>';
  h += '</section></div>';
  return h;
}

function buildFinOrcamentoCharts(){
  if (!ORC.garantir()) return;
  const R = ORC.calcular();
  if (!R || !R.proj.length) return;
  const P = R.P, proj = R.proj;
  const ano = proj[0].split('/')[1];

  // Receita: uma única série, colorida por situação. Duas séries lado a lado
  // deixavam as barras estreitas demais e os rótulos colidiam.

const Login = {
  _entrando: false,
  _tentativas: 0,

  init() {
    // O botão sempre é desenhado primeiro, mesmo quando há sessão salva.
    // Antes, sessão salva pulava direto pra entrarNoApp() sem desenhar nada;
    // se o backend travasse, a tela ficava vazia (sem botão, sem mensagem) e
    // só um F5 em aba nova (sem sessão) mostrava o botão de novo.
    this.renderBotaoGoogle();

    if (sessionStorage.getItem(SESSION_KEY) === 'ok') {
      this._status('Continuando sessão anterior...');
      try {
        this.entrarNoApp().finally(() => this._status(''));
      } catch (e) {
        console.warn('Sessão anterior inconsistente, limpando:', e);
        sessionStorage.removeItem(SESSION_KEY);
        sessionStorage.removeItem(EMAIL_LOGADO_KEY);
        this._status('');
      }
    }
  },

  _status(texto) {
    const el = document.getElementById('loginStatus');
    if (!el) return;
    if (!texto) { el.style.display = 'none'; el.innerHTML = ''; return; }
    el.style.display = 'flex';
    el.innerHTML = '<span class="login-spinner"></span><span>' + texto + '</span>';
  },

  _ocupado(sim) {
    const cont = document.getElementById('google-btn-container');
    if (cont) cont.classList.toggle('login-ocupado', !!sim);
  },

  renderBotaoGoogle() {
    if (!window.google || !google.accounts || !google.accounts.id) {
      this._tentativas++;
      if (this._tentativas > 40) { this._mostrarPlanoB('A biblioteca de login do Google não carregou.'); return; }
      setTimeout(() => this.renderBotaoGoogle(), 300);
      return;
    }
    try {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: (resp) => this.aoLogar(resp),
        auto_select: false,
        itp_support: true,
        use_fedcm_for_prompt: true,
        cancel_on_tap_outside: true
      });
      google.accounts.id.renderButton(
        document.getElementById('google-btn-container'),
        { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', width: 280 }
      );
    } catch (e) {
      this._mostrarPlanoB('Não foi possível montar o botão do Google: ' + e.message);
    }
  },

  // Caminho alternativo: popup OAuth. Não depende do iframe de One Tap/FedCM,
  // então funciona quando o botão padrão está travado ou bloqueado.
  _mostrarPlanoB(motivo) {
    const box = document.getElementById('loginError');
    if (!box || box._planoB) return;
    box._planoB = true;
    box.innerHTML = '<div style="margin-bottom:10px;opacity:.85;">' + motivo + '</div>' +
      '<button id="btnPlanoB" style="background:#E0EEE7;color:#011E3C;border:none;' +
      'padding:9px 18px;border-radius:50px;font-family:inherit;font-size:12px;' +
      'font-weight:700;cursor:pointer;letter-spacing:.4px;">Entrar por outro caminho</button>';
    const btn = document.getElementById('btnPlanoB');
    if (btn) btn.addEventListener('click', () => this.entrarViaPopup());
  },

  entrarViaPopup() {
    if (this._entrando) return;
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      document.getElementById('loginError').textContent =
        'A biblioteca do Google não carregou. Recarregue a página com Ctrl+Shift+R.';
      return;
    }
    const cli = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: 'openid email profile',
      callback: (resp) => {
        if (!resp || !resp.access_token) {
          document.getElementById('loginError').textContent = 'Login cancelado ou negado pelo Google.';
          return;
        }
        this._entrando = true;
        this._ocupado(true);
        this._status('Confirmando sua conta...');
        fetch('https://www.googleapis.com/oauth2/v3/userinfo', {
          headers: { Authorization: 'Bearer ' + resp.access_token }
        })
          .then(r => r.json())
          .then(info => this._autorizar((info.email || '').toLowerCase().trim()))
          .catch(err => {
            this._entrando = false; this._ocupado(false); this._status('');
            document.getElementById('loginError').textContent =
              'Não foi possível ler o e-mail da conta: ' + err.message;
          });
      }
    });
    cli.requestAccessToken();
  },

  // Decodifica o JWT do Google no navegador, sem verificar assinatura —
  // suficiente pra ler o e-mail no client-side. A validação de "quem pode
  // entrar" é a lista EMAILS_AUTORIZADOS. Proteção real do dado é a
  // planilha do Google continuar privada.
  _decodificarJWT(token) {
    const payload = token.split('.')[1];
    const base64 = payload.replace(/-/g, '+').replace(/_/g, '/');
    const json = decodeURIComponent(atob(base64).split('').map(c =>
      '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
    ).join(''));
    return JSON.parse(json);
  },

  aoLogar(resp) {
    if (this._entrando) return; // já tem um login em andamento, ignora clique repetido
    this._entrando = true;
    this._ocupado(true);
    this._status('Entrando...');
    let dados;
    try { dados = this._decodificarJWT(resp.credential); }
    catch (e) {
      this._entrando = false; this._ocupado(false); this._status('');
      this._mostrarPlanoB('Não foi possível ler os dados de login.');
      return;
    }
    this._autorizar((dados.email || '').toLowerCase().trim());
  },

  _autorizar(email) {
    const box = document.getElementById('loginError');
    if (!email) {
      this._entrando = false; this._ocupado(false); this._status('');
      if (box) box.textContent = 'Não foi possível identificar o e-mail da conta.';
      return;
    }
    const ok = EMAILS_AUTORIZADOS.map(e => e.toLowerCase().trim()).includes(email);
    if (!ok) {
      this._entrando = false; this._ocupado(false); this._status('');
      if (box) box.textContent = 'E-mail (' + email + ') não autorizado. Fale com a equipe Nortmont pra liberar o acesso.';
      return;
    }
    sessionStorage.setItem(SESSION_KEY, 'ok');
    sessionStorage.setItem(EMAIL_LOGADO_KEY, email);
    if (box) { box.innerHTML = ''; box._planoB = false; }
    this._status('Carregando os dados do painel...');
    this.entrarNoApp().finally(() => {
      this._entrando = false; this._ocupado(false); this._status('');
    });
  },

  // Sempre resolve dentro de um tempo limitado (ver fetchComTimeout, 9s) e
  // sempre termina chamando showApp(), mesmo se o backend falhar ou travar.
  // A tela nunca mais fica presa no login esperando uma resposta que não vem.
  entrarNoApp() {
    let p;
    try { p = carregarDadosAoVivo(); }
    catch (e) { console.error('carregarDadosAoVivo falhou:', e); showApp(true); return Promise.resolve(); }
    if (!p || typeof p.then !== 'function') { showApp(true); return Promise.resolve(); }
    return p.then(() => showApp())
      .catch(err => {
        console.error('Falha ao buscar dados ao vivo, usando JSON estático embutido:', err);
        showApp(true);
      });
  }
};

function setCliTopN(n){
  var arr = STATE.cliArr || [];

  if (!body) return;
  body.innerHTML = sub.map(function(c){
    var t = getTipo(c.nome, c.tipo, c.pos);
    var fat = c.total >= 1e6 ? 'R$\u00a0'+(c.total/1e6).toFixed(1).replace('.',',')+'\u00a0mi'
            : c.total >= 1e3 ? 'R$\u00a0'+(c.total/1e3).toFixed(1).replace('.',',')+'\u00a0mil'
            : 'R$\u00a0'+c.total.toFixed(2).replace('.',',');

            : 'R$\u00a0'+c.tkt.toFixed(2).replace('.',',');

      +'<td class="abc-name">'+(c.nome||'').toString().slice(0,42)+'</td>'
      +'<td><span class="tipo-badge tipo-'+t.toLowerCase()+'">'+t+'</span></td>'
      +'<td>'+(c.qtd ? c.qtd.toLocaleString('pt-BR') : '0')+'</td>'
      +'<td>'+fat+'</td>'

      +'<td>'+c.share_ac.toFixed(1).replace('.',',')+'\u00a0%</td></tr>';

// da planilha ao vivo). Sem isso, um backend lento ou fora do ar faz o
// dashboard parecer normal mostrando números desatualizados sem aviso nenhum.
function mostrarAvisoFallback(){
  if (document.querySelector('.aviso-fallback')) return;
  const b = document.createElement('div');
  b.className = 'aviso-fallback';
  b.innerHTML = '⚠ Não consegui buscar os dados mais recentes da planilha. '
    + 'Mostrando a última versão salva no arquivo, que pode estar desatualizada.'
    + '<button onclick="location.reload()">Tentar de novo</button>';
  document.body.insertBefore(b, document.body.firstChild);
}

function _normNome(nome){ return (nome||'').replace(/\s+/g,' ').trim(); }
// Cliente cadastrado com o número do documento (CPF/CNPJ) na frente do nome
// (ex.: "48.718.011 ALINE VERA VAZ ROCHA") indica pessoa/empresa que se
// formalizou pra comprar — na prática, revenda. Confirmado pelo cliente:
// sempre que o nome tem esse prefixo numérico, é B2B, mesmo que o relatório
// do eGestor (que classifica por CPF x CNPJ) tenha marcado como consumidor
// final. Essa regra tem prioridade sobre a lista de relatórios abaixo.
function _temPrefixoDocumento(nome){
  return /^\d{2}\.\d{3}\.\d{3}\s/.test(_normNome(nome));
}
// A classificação B2B/B2C vem direto dos relatórios (coluna de tipo de cliente:
// consumidor final = B2C, não consumidor final = B2B). Não aplicamos mais nenhuma
// heurística por posição no ranking ou por formato do nome — isso divergia da
// classificação oficial dos relatórios e inflava artificialmente o B2B.
function getTipo(nome, tipoOriginal, pos) {
  if (STATE.overridesTipo[nome]) return STATE.overridesTipo[nome];
  if (_FIXED_TIPO_OVERRIDES[nome]) return _FIXED_TIPO_OVERRIDES[nome];
  if (_temPrefixoDocumento(nome)) return 'B2B';
  if (_RELATORIO_TIPO_CLIENTE[_normNome(nome)]) return _RELATORIO_TIPO_CLIENTE[_normNome(nome)];
  // Sem nenhuma fonte confiável — cai em B2C por padrão só pra não quebrar
  // contas, mas isSemClassificacao() abaixo sinaliza esse caso pra exibir
  // um aviso na tela em vez de esconder o problema.
  return (tipoOriginal === 'B2B') ? 'B2B' : 'B2C';
}
// Verdadeiro quando NENHUMA fonte confiável classificou o cliente (nem
// override manual, nem prefixo de documento, nem a lista dos relatórios, nem
// um "B2B"/"B2C" explícito vindo da planilha — inclui o caso "S/C" que a
// fórmula da aba Top Clientes retorna pra cliente novo ainda não revisado).
function isSemClassificacao(nome, tipoOriginal){
  if (STATE.overridesTipo[nome] || _FIXED_TIPO_OVERRIDES[nome]) return false;
  if (_temPrefixoDocumento(nome)) return false;
  if (_RELATORIO_TIPO_CLIENTE[_normNome(nome)]) return false;
  return tipoOriginal !== 'B2B' && tipoOriginal !== 'B2C';
}

// ── Recalcula b2b_b2c a partir dos clientes_abc com overrides ───────────────
function calcB2BByCli(cliArr) {
  var fat2b = 0, fat2c = 0, v2b = 0, v2c = 0, n2b = 0, n2c = 0;
  cliArr.forEach(function(c, i) {
    // Cliente sem classificação confiável não entra no cálculo de B2B nem
    // de B2C — fica de fora até ser revisado (ver aviso no fim da página).
    var semClass = (c.semClass !== undefined) ? c.semClass : isSemClassificacao(c.nome, c.tipoRaw || c.tipo);
    if (semClass) return;
    var t = c.tipo || getTipo(c.nome, c.tipoRaw || c.tipo, c.pos || (i+1));
    if (t === 'B2B') { fat2b += (c.total||0); v2b += (c.qtd||0); n2b++; }
    else              { fat2c += (c.total||0); v2c += (c.qtd||0); n2c++; }
  });
  return { b2b_fat: fat2b, b2c_fat: fat2c, b2b_vendas: v2b, b2c_vendas: v2c, b2b_clientes: n2b, b2c_clientes: n2c };
}

// ── Modo edição ────────────────────────────────────────────────────────────
function enterEditMode() {
  STATE.editMode = true;
  document.getElementById('btnEditar').style.display = 'none';
  document.getElementById('editBadge').style.display = 'flex';
  document.getElementById('editActions').style.display = 'flex';
  applyEditables();
}

function exitEditMode(save) {
  STATE.editMode = false;
  if (!save) { STATE.savedEdits = {}; }
  document.getElementById('btnEditar').style.display = '';
  document.getElementById('editBadge').style.display = 'none';
  document.getElementById('editActions').style.display = 'none';
  // remove contenteditable
  document.querySelectorAll('[contenteditable]').forEach(function(el) {
    el.removeAttribute('contenteditable');
  });
  if (!save) { render(); }
}

function applyEditables() {
  if (!STATE.editMode) return;
  var SELS = ['.dash-title','.dash-sub','.card-title','.kpi-label','.kpi-title',
              '.section-title','.chart-title','.chart-sub','.tab-label',
              'h1','h2','h3','.top-period'];
  SELS.forEach(function(sel) {
    document.querySelectorAll(sel).forEach(function(el, i) {
      if (el.getAttribute('contenteditable')) return; // already set
      var key = sel + ':' + i;
      el.setAttribute('contenteditable', 'true');
      el.setAttribute('data-ekey', key);
      if (STATE.savedEdits[key] !== undefined) {
        el.textContent = STATE.savedEdits[key];
      }
      el.addEventListener('blur', function() {
        STATE.savedEdits[key] = el.textContent;
      });
      el.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
      });
    });
  });
}

function reapplySavedEdits() {
  if (!STATE.editMode) return;
  setTimeout(applyEditables, 80);
}

// ── Modal B2B/B2C ────────────────────────────────────────────────────────
function openB2BModal() {
  document.getElementById('edtOverlay').classList.add('active');
  document.getElementById('edtSearch').value = '';
  renderEdtList('');
}

function closeB2BModal() {
  document.getElementById('edtOverlay').classList.remove('active');
  // re-render to apply any changes
  render();
}

function filterEdtClientes() {
  renderEdtList(document.getElementById('edtSearch').value.toLowerCase());
}

function getEdtClientes() {
  var map = {};
  // Abas por mês
  Object.keys(__ABAS_POR_MES__).forEach(function(mes) {
    var d = __ABAS_POR_MES__[mes];
    if (d && d.clientes_abc) {
      d.clientes_abc.forEach(function(c) {
        if (!map[c.nome]) map[c.nome] = c.tipo || 'B2C';
      });
    }
  });
  return Object.keys(map).sort().map(function(n) { return { nome: n, tipo: map[n] }; });
}

function renderEdtList(filter) {
  var all = getEdtClientes();
  if (filter) all = all.filter(function(c) { return c.nome.toLowerCase().indexOf(filter) >= 0; });
  var ovrCount = Object.keys(STATE.overridesTipo).length;
  document.getElementById('edtInfo').textContent =
    ovrCount > 0 ? ovrCount + ' correção(ões) ativa(s)' : 'Sem correções ativas';
  var html = all.map(function(c) {
    var tipoAtual = STATE.overridesTipo[c.nome] || c.tipo;
    var hasOvr = !!STATE.overridesTipo[c.nome];
    var nomeSafe = c.nome.replace(/\\/g,'\\\\').replace(/'/g,"\\'");
    var tipoOrig = c.tipo;
    return '<div class="edt-row">'
      + '<span class="edt-nome">' + c.nome
      + (hasOvr ? '<span class="edt-ovr">✎</span>' : '')
      + '</span>'
      + '<button class="edt-tipo-btn ' + tipoAtual.toLowerCase()
      + '" onclick="toggleCliTipo(\'' + nomeSafe + '\',\'' + tipoOrig + '\')">'
      + tipoAtual + '</button></div>';
  }).join('');
  document.getElementById('edtList').innerHTML = html || '<div style="padding:20px;color:rgba(255,255,255,.3);font-size:12px;">Nenhum cliente encontrado.</div>';
}

function toggleCliTipo(nome, tipoOriginal) {
  var atual = STATE.overridesTipo[nome] || tipoOriginal;
  var novo = atual === 'B2B' ? 'B2C' : 'B2B';
  if (novo === tipoOriginal) {
    delete STATE.overridesTipo[nome];
  } else {
    STATE.overridesTipo[nome] = novo;
  }
  renderEdtList(document.getElementById('edtSearch').value.toLowerCase());
}

function salvarTudo(){
  const btn = document.querySelector('.btn-salvar');
  if (btn) { btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;flex-shrink:0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Salvando…'; btn.disabled = true; }
  try {
    const html = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;
    const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'Fechamento_Açaí_-_Atual.html';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 3000);
  } catch(e) {
    console.error('Erro ao salvar:', e);
  } finally {
    if (btn) {
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:13px;height:13px;flex-shrink:0"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Salvar';
      }, 1500);

  }

const MAIN_TABS_CFG = {
  resumo: { label:'Resumo', subs:[] },
  fin:    { label:'Financeiro', subs:[
    {id:'dre',         label:'DRE'},
    {id:'indicadores', label:'Indicadores'},

    {id:'padraoSemanal',label:'Padrão Semanal'},
    {id:'produtos',     label:'Produtos'}
  ]},
  prod:   { label:'Produção', subs:[
    {id:'producao',      label:'Visão Geral'},
    {id:'batidas',       label:'Ordens de Produção'},
    {id:'producaoVenda', label:'Produção×Venda'}
  ]}
};
/* painel de conteúdo default de cada aba principal (quando não tem subabas,
   ou subaba ainda não escolhida nesta sessão) */
const MAIN_DEFAULT_PANEL = { resumo:'resumo', fin:'dre', com:'faturamento', prod:'producao' };
let CUR_MAIN = 'resumo';
const CUR_SUB = { fin:'dre', com:'faturamento', prod:'producao' }; // última subaba ativa por aba principal

function bindTabs(){ /* onclick já vem inline nos botões (showMainTab) */ }

/* Mede as alturas reais do header (top-bar + stickyNav) e ajusta os offsets.
   Evita qualquer "costura" entre faixas causada por valores de px chutados —
   #stickyNav e main.padding-top são sempre recalculados a partir do DOM real. */
function adjustHeaderOffsets(){
  const topBar = document.querySelector('.top-bar');
  const stickyNav = document.getElementById('stickyNav');
  const main = document.querySelector('main');
  if (!topBar || !stickyNav || !main) return;
  const topBarH = topBar.offsetHeight;
  stickyNav.style.top = topBarH + 'px';
  const stickyNavH = stickyNav.offsetHeight;
  main.style.paddingTop = (topBarH + stickyNavH) + 'px';
}
window.addEventListener('resize', adjustHeaderOffsets);

function showMainTab(mainId){
  CUR_MAIN = mainId;
  document.querySelectorAll('#tabsList .tab-btn').forEach(b => b.classList.remove('active'));
  const btn = document.getElementById('mtab-'+mainId);
  if (btn) btn.classList.add('active');
  buildSubtabNav();
  const panelId = MAIN_TABS_CFG[mainId].subs.length ? (CUR_SUB[mainId] || MAIN_TABS_CFG[mainId].subs[0].id) : MAIN_DEFAULT_PANEL[mainId];
  goTab(panelId);
}

function buildSubtabNav(){
  const nav = document.getElementById('subtabNav');
  const cfg = MAIN_TABS_CFG[CUR_MAIN];
  if (!cfg || !cfg.subs.length){
    nav.classList.remove('visible');
    document.body.classList.remove('has-subtabs');
    nav.innerHTML = '';
    adjustHeaderOffsets();
    return;
  }
  document.body.classList.add('has-subtabs');
  nav.classList.add('visible');
  const activeSub = CUR_SUB[CUR_MAIN] || cfg.subs[0].id;
  nav.innerHTML = cfg.subs.map(s =>
    '<button class="stab'+(s.id===activeSub?' active':'')+'" onclick="showSubTab(\''+s.id+'\')">'+s.label+'</button>'
  ).join('');
  adjustHeaderOffsets();
}

function showSubTab(subId){
  CUR_SUB[CUR_MAIN] = subId;
  document.querySelectorAll('#subtabNav .stab').forEach(b => b.classList.remove('active'));
  buildSubtabNav();
  goTab(subId);
}

function goTab(tabId){
  STATE.currentTab = tabId;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============ PERÍODO ESTILO G5 ============ */

// Gera os botões de mês e de intervalo com base nos meses que realmente têm
// dado comercial vindo da planilha (chaves de __ABAS_POR_MES__), em vez de
// uma lista fixa escrita no HTML. Assim, quando um mês novo (ex.: Jul/26)
// aparecer na planilha, o botão dele passa a existir sozinho, sem precisar
// editar o código a cada fechamento mensal.
function buildPeriodChips(){
  const chipsWrap = document.getElementById('g5Chips');
  const rangesWrap = document.getElementById('g5Ranges');
  if (!chipsWrap || !rangesWrap) return;

  const mesesComDado = MESES.filter(m => __ABAS_POR_MES__[m]);
  if (!mesesComDado.length) return; // sem dado comercial: mantém o que já está no HTML (fallback estático)

  chipsWrap.innerHTML = mesesComDado.map(m =>
    '<button class="g5-chip" data-month="' + m + '">' + m + '</button>'
  ).join('');

  // Ranges dinâmicos: "1º Tri" = 3 primeiros meses com dado; "Todos" = todos
  // os meses com dado comercial disponíveis no momento.
  const ranges = [];
  if (mesesComDado.length >= 3){
    const tri = mesesComDado.slice(0, 3);
    ranges.push({label:'1º Tri', meses:tri});
  }
  if (mesesComDado.length >= 2){
    ranges.push({label: mesesComDado[0] + '–' + mesesComDado[mesesComDado.length-1], meses: mesesComDado});
  }
  rangesWrap.innerHTML = ranges.map(r =>
    '<button class="g5-range" data-months="' + r.meses.join(',') + '">' + r.label + '</button>'
  ).join('');

  // Seleciona o mês mais recente com dado por padrão.
  STATE.selectedMonths = [mesesComDado[mesesComDado.length - 1]];
}

function initPeriodChips(){
  buildPeriodChips();
  const chipsWrap = document.getElementById('g5Chips');
  const rangesWrap = document.getElementById('g5Ranges');

  // Clique normal num mês: sempre isola aquele mês (não fica alternando
  // dentro da seleção atual — era isso que dava sensação de botão travado
  // ao tentar sair de um intervalo como Jan-Jun).
  // Ctrl/Cmd+clique: adiciona ou remove aquele mês da seleção atual, sem
  // mexer nos demais — assim dá pra combinar meses não seguidos, tipo
  // Jan + Mar, pulando Fevereiro.
  chipsWrap.querySelectorAll('.g5-chip').forEach(chip => {
    chip.addEventListener('click', (ev) => {
      const m = chip.dataset.month;
      if (ev.ctrlKey || ev.metaKey){
        const idx = STATE.selectedMonths.indexOf(m);
        if (idx >= 0){
          // não deixa desmarcar o último mês restante
          if (STATE.selectedMonths.length > 1) STATE.selectedMonths.splice(idx, 1);
        } else {
          STATE.selectedMonths.push(m);
        }
        STATE.selectedMonths.sort((a,b)=> MESES.indexOf(a) - MESES.indexOf(b));
      } else {
        STATE.selectedMonths = [m];
      }
      updateChips();
      render();
    });
  });

  // Ranges (1º Tri, Jan-Abr)
  rangesWrap.querySelectorAll('.g5-range').forEach(btn => {
    btn.addEventListener('click', () => {
      const ms = (btn.dataset.months || '').split(',').filter(Boolean);
      if (!ms.length) return;
      STATE.selectedMonths = MESES.filter(m => ms.includes(m));
      updateChips();
      render();
    });
  });

  updateChips();
}

function updateChips(){
  const sel = STATE.selectedMonths;

  // Marca chips de mês
  document.querySelectorAll('.g5-chip').forEach(chip => {
    chip.classList.toggle('active', sel.includes(chip.dataset.month));
  });

  // Marca ranges que batem exatamente com a seleção
  document.querySelectorAll('.g5-range').forEach(btn => {
    const ms = (btn.dataset.months || '').split(',').filter(Boolean);
    const match = ms.length === sel.length && ms.every(m => sel.includes(m));
    btn.classList.toggle('active', match);
  });

  // Label no topo + resumo
  let lbl;
  if (sel.length === 1) lbl = sel[0];
  else {
    const idxs = sel.map(m => MESES.indexOf(m)).sort((a,b)=>a-b);
    const contiguo = idxs.every((v,i)=> i===0 || v===idxs[i-1]+1);
    lbl = contiguo ? sel[0] + ' – ' + sel[sel.length-1] : sel.length + ' meses';
  }
  const topEl = document.getElementById('topPeriodo');
  if (topEl) topEl.textContent = lbl;

  const sumEl = document.getElementById('periodSummary');
  if (sumEl){
    sumEl.innerHTML = sel.length === 1
      ? '<strong>'+sel[0]+'</strong> selecionado'
      : '<strong>'+sel.length+' meses</strong> · '+sel[0]+' → '+sel[sel.length-1];
  }
}

  Object.values(STATE.charts).forEach(c => { try { c.destroy(); } catch(e){} });
  STATE.charts = {};
}

/* helpers comuns */
function fmtBRLk(v){
  if (v == null || isNaN(v)) return '-';
  if (Math.abs(v) >= 1e6) return 'R$ ' + (v/1e6).toFixed(2).replace('.',',') + ' mi';
  if (Math.abs(v) >= 1e3) return 'R$ ' + (v/1e3).toFixed(1).replace('.',',') + ' mil';
  return 'R$ ' + v.toFixed(2).replace('.',',');
}
function fmtNum(v, d){
  if (v == null || isNaN(v)) return '-';
  return v.toLocaleString('pt-BR', {minimumFractionDigits: d||0, maximumFractionDigits: d||0});
}
function fmtPctSim(v){
  if (v == null || isNaN(v)) return '-';
  return v.toFixed(1).replace('.',',') + '%';
}

/* Mini-card consolidado YoY, exibido no topo de cada gráfico comparativo.
   modo='soma' → total do período (Faturamento, N° Vendas); modo='media' → média mensal (Ticket, Clientes).
   fmt: função de formatação do valor (fmtBRLk, fmtInt, etc). */
function miniYoYCard(meses, key, modo, fmt){
  var mesesPrev = meses.map(prevYear);
  var v26, v25;
  if (modo === 'soma'){
    v26 = sumSerie(key, meses);
    v25 = sumSerie(key, mesesPrev);
  } else {
    v26 = avgSerie(key, meses);
    v25 = avgSerie(key, mesesPrev);
  }
  var temPar = (v25 != null && v25 > 0);
  var varPct = temPar ? (v26 / v25 - 1) * 100 : null;
  var rotulo = modo === 'soma' ? 'Total do período' : 'Média do período';
  var cls = varPct == null ? 'neu' : (varPct >= 0 ? 'pos' : 'neg');
  var deltaTxt = varPct == null ? '—'
    : (varPct >= 0 ? '▲ ' : '▼ ') + fmtPctSim(Math.abs(varPct)) + ' YoY';
  var h = '<div class="mini-yoy">';
  h +=   '<div class="mini-yoy-col"><span class="mini-yoy-lbl">'+rotulo+' · 2026</span><span class="mini-yoy-val">'+fmt(v26)+'</span></div>';
  h +=   '<div class="mini-yoy-col"><span class="mini-yoy-lbl">2025</span><span class="mini-yoy-val mut">'+(temPar?fmt(v25):'—')+'</span></div>';
  h +=   '<div class="mini-yoy-col mini-yoy-delta '+cls+'"><span class="mini-yoy-lbl">Variação</span><span class="mini-yoy-val">'+deltaTxt+'</span></div>';
  h += '</div>';
  return h;
}

/* Projeção de fechamento anual pelo crescimento YoY acumulado.
   Taxa = faturamento acumulado dos meses já fechados do ano corrente ÷ mesmos
   meses do ano anterior. Aplicada a cada mês do ano anterior ainda não
   realizado. Preserva sazonalidade, porque projeta sobre a curva real do ano
   passado em vez de extrapolar a tendência dos últimos meses. */
function projecaoAnualYoY(){
  if (!MESES || !MESES.length) return null;
  const ano = MESES[MESES.length-1].split('/')[1];
  const anoAnt = String(parseInt(ano,10)-1).padStart(2,'0');
  const abrev = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  const mesesAno = abrev.map(function(mm){ return mm+'/'+ano; });
  const realizados = [], futuros = [];
  mesesAno.forEach(function(m){
    const v = SERIES.faturamento ? SERIES.faturamento[m] : null;
    if (v != null && v > 0) realizados.push(m); else futuros.push(m);
  });
  if (realizados.length === 0) return null;
  const par = function(m){ return m.replace('/'+ano, '/'+anoAnt); };
  const acumAtual    = realizados.reduce(function(s,m){ return s + (SERIES.faturamento[m]||0); }, 0);
  const acumAnterior = realizados.reduce(function(s,m){ return s + (SERIES.faturamento[par(m)]||0); }, 0);
  if (!acumAnterior) return null;
  const crescimento = acumAtual/acumAnterior - 1;
  const projData = {};
  futuros.forEach(function(m){
    const base = SERIES.faturamento[par(m)];
    projData[m] = (base != null && base > 0) ? base * (1 + crescimento) : null;
  });
  const baseAnteriorFuturo = futuros.reduce(function(s,m){ return s + (SERIES.faturamento[par(m)]||0); }, 0);
  const totalProjetado = futuros.reduce(function(s,m){ return s + (projData[m]||0); }, 0);
  const totalAnoAnterior = mesesAno.reduce(function(s,m){ return s + (SERIES.faturamento[par(m)]||0); }, 0);
  return {ano:ano, anoAnt:anoAnt, anoL:'20'+ano, anoAntL:'20'+anoAnt,
          mesesAno:mesesAno, realizados:realizados, futuros:futuros, projData:projData,
          crescimento:crescimento, acumAtual:acumAtual, acumAnterior:acumAnterior,
          baseAnteriorFuturo:baseAnteriorFuturo, totalProjetado:totalProjetado,
          totalAno:acumAtual+totalProjetado, totalAnoAnterior:totalAnoAnterior};
}

    unico ? 'excl. vendas com R$ 0' : 'média do período', 'neu');

  html += kpiCardLight('Clientes Ativos', fmtNum(cli, 0),
    'média mensal', 'neu');
